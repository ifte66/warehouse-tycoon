<!-- ══ HEADER ══ -->

<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════════
   §1 UTILITIES & SEEDED RNG
   ═══════════════════════════════════════════════════════════════════ */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const RNG = { fn: Math.random, seeded:false,
  reset(){ this.seeded = el('seedToggle')?.checked; this.fn = this.seeded ? mulberry32(+el('seedVal').value||42) : Math.random; },
  r(){ return this.fn(); },
  range(a,b){ return a + this.r()*(b-a); },
  gauss(mu=0,sd=1){ let u=0,v=0; while(!u)u=this.r(); while(!v)v=this.r(); return mu+sd*Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); },
  poisson(l){ const L=Math.exp(-l); let k=0,p=1; do{k++;p*=this.r()}while(p>L); return k-1; }
};
const el = id => document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const fmt$=v=>{const n=Math.abs(v);const s=v<0?'-$':'$';if(n>=1e6)return s+(n/1e6).toFixed(2)+'M';if(n>=1e3)return s+(n/1e3).toFixed(1)+'k';return s+n.toFixed(0)};
const fmtN=v=>{const n=Math.abs(v);if(n>=1e6)return (v/1e6).toFixed(2)+'M';if(n>=1e3)return (v/1e3).toFixed(1)+'k';return (Math.round(v*10)/10).toString()};
const pct=v=>(v*100).toFixed(1)+'%';
const sgn$=v=>(v>=0?'+':'−')+fmt$(Math.abs(v));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];


/* ═══════════════════════════════════════════════════════════════════
   §1b SOUND — WebAudio dock thuds, reversing beepers, month chimes.
   Unlocks on first user gesture; throttled; silent at fast-forward.
   ═══════════════════════════════════════════════════════════════════ */
const SND = {
  ctx:null, on:true, last:{},
  ensure(){ if(!this.on) return false;
    if(!this.ctx){ try{ this.ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ this.on=false; return false; } }
    if(this.ctx.state==='suspended') this.ctx.resume();
    return this.ctx.state==='running';
  },
  gate(name, gapMs, anySpeed){
    if(!this.on || !this.ctx || this.ctx.state!=='running' || document.hidden) return false;
    if(S.tab!=='sim') return false;
    if(!anySpeed && SIM.speed>60) return false;          // fast-forward would machine-gun
    const n=performance.now();
    if(this.last[name] && n-this.last[name]<gapMs) return false;
    this.last[name]=n; return true;
  },
  osc(type,f0,f1,t0,dur,vol,curve){ const c=this.ctx,o=c.createOscillator(),g=c.createGain();
    o.type=type; o.frequency.setValueAtTime(f0,t0); if(f1!==f0) o.frequency[curve||'exponentialRampToValueAtTime'](Math.max(1,f1),t0+dur);
    g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(vol,t0+0.008); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g).connect(c.destination); o.start(t0); o.stop(t0+dur+0.02); },
  noise(t0,dur,vol,cut){ const c=this.ctx,len=Math.ceil(c.sampleRate*dur),b=c.createBuffer(1,len,c.sampleRate),d=b.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
    const s=c.createBufferSource(); s.buffer=b;
    const f=c.createBiquadFilter(); f.type='lowpass'; f.frequency.value=cut||500;
    const g=c.createGain(); g.gain.setValueAtTime(vol,t0); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    s.connect(f).connect(g).connect(c.destination); s.start(t0); },
  thud(){ if(!this.gate('thud',350)) return; try{ const t=this.ctx.currentTime;   // trailer meets dock bumper
    this.osc('sine',82,38,t,0.22,0.32); this.noise(t,0.13,0.20,420); }catch(e){} },
  beep(){ if(!this.gate('beep',640)) return; try{ const t=this.ctx.currentTime;   // reversing beeper pip
    this.osc('square',1180,1180,t,0.10,0.045); }catch(e){} },
  chime(good){ if(!this.gate('chime',1600,true)) return; try{ const t=this.ctx.currentTime;  // month close
    if(good){ this.osc('sine',523,523,t,0.16,0.10); this.osc('sine',784,784,t+0.14,0.26,0.10); }
    else    { this.osc('sine',392,392,t,0.18,0.10); this.osc('sine',311,311,t+0.16,0.30,0.10); } }catch(e){} },
  alert(){ if(!this.gate('alert',2400,true)) return; try{ const t=this.ctx.currentTime;      // SLA breach
    this.osc('triangle',660,440,t,0.16,0.09); this.osc('triangle',660,440,t+0.2,0.16,0.09); }catch(e){} }
};
document.addEventListener('pointerdown',()=>SND.ensure(),{passive:true});
window.toggleSound=function(){ SND.on=!SND.on; if(SND.on) SND.ensure(); const b=el('btnSound'); if(b) b.textContent=SND.on?'🔊':'🔇'; };

function mkLoc(o){ return Object.assign({ zoning:'Industrial 1', hazmatOK:true, coldOK:true, curfew:false }, o); }
const LOCATIONS = {

/* ═══════════════════════════════════════════════════════════════════
   §6 DERIVED MODEL — recompute() runs on every input change.
   All penalties (PEN), capacity, CapEx, OpEx rates trace to inputs.
   ═══════════════════════════════════════════════════════════════════ */
let D = {};      // derived snapshot
function mixShares(){ const t=Object.values(S.mix).reduce((a,b)=>a+b,0)||1; const o={}; for(const k in S.mix) if(S.mix[k]>0) o[k]=S.mix[k]/t; return o; }
function mixBlend(fn){ const sh=mixShares(); let v=0; for(const k in sh) v+=sh[k]*fn(VERTICALS[k],k); return v; }
function vertLocked(k){
  const v=VERTICALS[k], dd=S.dd, L=S.loc, reasons=[];
  if(v.needsESFR && dd.sprinkler!=='ESFR') reasons.push('needs ESFR sprinklers');
  if(v.needsCold && !L.coldOK) reasons.push('cold store not permitted (zoning)');
  if(v.needsFood && !dd.foodGrade) reasons.push('needs food-grade certification');
  if(v.needsGDP && !dd.gdpCert) reasons.push('needs TGA/GDP capability');
  if(v.needsDG && (!dd.dgLicense || !L.hazmatOK)) reasons.push('needs DG license + hazmat zoning');
  return reasons;
}
function recompute(){
  const L=S.loc, dd=S.dd, sh=mixShares(), area=S.site.areaM2;
  // remove locked verticals from active mix (visible in UI as locked)
  for(const k in S.mix) if(vertLocked(k).length) delete sh[k];
  const shT=Object.values(sh).reduce((a,b)=>a+b,0)||1; for(const k in sh) sh[k]/=shT;
  D.shares = sh;

  // ── DD scoring (needs reqKva → 2-pass)
  const coldShare=(sh.chilled||0)+(sh.frozen||0);
  D.reqKva = area*0.012 + area*coldShare*0.09 + (S.autom.agv*6) + (S.autom.sortation?140:0) + (S.autom.conveyor?60:0);
  let wSum=0, sSum=0; D.ddScores={};
  DD_ITEMS.forEach(i=>{ const s=clamp(i.score(dd[i.k],D),0,1); D.ddScores[i.k]=s; wSum+=i.w; sSum+=i.w*s; });
  D.ddScore = Math.round(100*sSum/wSum);

  // ── Penalties  (§2: missing items impose concrete effects)
  const P = {};
  P.maxLevels = Math.max(1, Math.floor((dd.clearHeight-1.5)/1.7));
  if(dd.sprinkler!=='ESFR') P.maxLevels = Math.min(P.maxLevels, 3);           // 6 m cap
  P.unloadMult   = (dd.levellers?1:1.3) * (dd.courtDepth<32?1.4:1);
  P.arrivalVar   = dd.gatehouse?1:1.5;
  P.shrinkAdd    = (dd.gatehouse?0:.002) + (dd.cctv?0:.003);
  P.pickMult     = (dd.lux<300?0.93:1) * (dd.dockWifi?1:0.95) * (dd.fiber?1:0.96);
  P.vnaOk        = dd.flatness==='FM1 / superflat';
  P.linehaulMult = dd.bDouble?1:1.18;
  P.absentAdd    = ({'Far':.03,'Moderate':.01,'Near':0})[dd.ptProx] + (dd.amenities?0:.01) + (dd.carPark<S_totalHeads()*0.7?.005:0);
  P.wageMult     = (dd.ptProx==='Far'?1.04:1);
  P.powerShort   = dd.supplyKva < D.reqKva && !S.autom.substation;
  P.canOccupy    = dd.egress && dd.occCert && dd.zoningOk;
  P.outageHrs    = dd.genset?0:L.gridOutage;
  P.roofRisk     = ({'Poor':.004,'Fair':.001,'Good':0})[dd.roof];             // stock damage %/mo
  D.pen = P;

  // ── Capacity
  const rackable = area * 0.55;                                               // aisles/staging/offices excluded
  const fpBlend = mixBlend(v=>v.footprint) || 1.15;
  D.palletCap = Math.floor(rackable/(fpBlend*2.2)) * P.maxLevels;   // footprint × aisle-share factor
  // demand
  const demandIdx = L.parcelDensity*(sh.ecom||0)*1.6 + L.b2bIndex*(1-(sh.ecom||0));
  D.baseOrders = S.site.targetOrders * demandIdx * (1 - L.vacancyRate/100*.8);
  D.basePallets = clamp(D.palletCap*0.78, 0, D.palletCap);                    // steady-state target fill

  // ── Rates (blended, all from location benchmarks × vertical multipliers)
  D.storRate = L.storageBench * (Object.entries(sh).reduce((a,[k,s])=>a+s*VERTICALS[k].storMult,0)||1);
  D.pickFee  = L.pickBench   * (Object.entries(sh).reduce((a,[k,s])=>a+s*VERTICALS[k].handMult,0)||1);
  if(sh.fmcg && !dd.foodGrade) D.storRate*= (1 - .05*sh.fmcg);
  D.picksPerOrder = mixBlend(v=>v.picks)||6;

  // ── Linehaul $/pallet from access distances (§1)
  D.linehaulIn  = (2.1 + L.kmPort*0.011 + L.kmRail*0.04 + L.kmMwy*0.35) * P.linehaulMult;
  D.linehaulOut = (1.6 + L.kmMwy*0.4 + L.kmAir*0.008) * P.linehaulMult;
  D.truckTurnVar = 1 + L.congestMin/60*.8;

  // ── CapEx  (§5)
  const C = {};
  C.landOrEntry = S.site.tenure==='buy' ? L.landPrice*area*1.45 : 0;          // land + build premium if buying
  C.fitout   = area * (55 + mixBlend(v=>v.compCapexM2));
  C.racking  = D.palletCap * (Object.entries(sh).reduce((a,[k,s])=>a+s*MODE_RACK_COST[VERTICALS[k].modeKey],0)||165);
  C.equipment= 42000*Math.ceil(S.staff.forklift*0.8) + S.autom.agv*68000 + (S.autom.conveyor?480000:0) + (S.autom.sortation?1350000:0) + (S.autom.solar?area*38*L.solarIdx:0) + (S.autom.substation?520000:0) + S.autom.extraDocks*185000 + (S.autom.slotting?35000:0);
  C.compliance = (dd.contam==='Flagged'?450000:0) + (dd.permits==='Pending'? L.approvalWeeks*week$():0) + (dd.roof==='Poor'?area*12:0);
  C.total = C.landOrEntry + C.fitout + C.racking + C.equipment + C.compliance - L.govtIncentive*1000;
  D.capex = C;
  function week$(){ return (L.leaseRate*area/52)*0.6; }                       // holding cost of delay

  // ── Debt package (§5)
  const debt = C.total * S.site.debtLVR/100;
  const r = S.site.debtRate/100/12, n = S.site.debtTermYr*12;
  D.debt = debt; D.debtSvcMo = debt>0 ? debt*r/(1-Math.pow(1+r,-n)) : 0;
  D.equity = C.total - debt;

  // ── OpEx rates (per day unless noted)
  const hrs=8, days=1;
  const wage = L.wage*P.wageMult, prem=L.forkPrem, load=L.unionLoad*(1+L.payrollTax/100);
  const heads=S.staff;
  D.laborDay = (
    (heads.receiving+heads.putaway+heads.picking+heads.packing+heads.dispatch+heads.qc+heads.cleaning)*wage*hrs*load +
    (heads.forklift)*(wage+prem)*hrs*load +
    (heads.maintenance)*(wage+2)*hrs*load +
    (heads.security)*(wage+1)*hrs*load*1.4 +                                  // 24/7 coverage
    (heads.supervisor)*(L.supSalary*1000/260) +
    (heads.admin)*(wage*0.95)*hrs*load
  );
  // energy: lighting + HVAC(climate) + refrigeration(vertical energyInt × volume)
  const vol = area*Math.min(dd.clearHeight,12);
  D.refrigKwhDay = Object.entries(sh).reduce((a,[k,s])=>a+s*VERTICALS[k].energyInt*vol,0);
  D.lightKwhDay  = area*0.011*(dd.lux/350)*16;
  D.energyDay = 0; // finalized per-tick with season/heatwave; base stored:
  D.powerTariffEff = L.powerTariff * (S.autom.solar? (1-0.32*L.solarIdx):1);
  D.leaseDay = S.site.tenure==='lease' ? (L.leaseRate+L.outgoings)*area/365 * (1-L.incentivePct/100*0.2) : (L.outgoings*area/365 + L.landPrice*area*L.propTax/100/365);
  D.maintDay = (C.racking+C.equipment)*0.045/365 + area*0.9/365;
  // insurance: value at risk × base × climate multiplier × security credit
  const invValue = D.basePallets * mixBlend(v=>v.valueDensity);
  const riskMult = 1 + L.riskCyclone*.9 + L.riskFlood*.6 + L.riskSeismic*.3 + L.riskBushfire*.3;
  const secCred = (dd.cctv?0.94:1)*(dd.fencing?0.97:1)*(dd.hydrants?0.95:1)*(dd.insQuote?1:1.1)*(S.autom.insBundle?0.86:1);
  D.insuranceYr = (invValue*0.0045 + area*4.2) * riskMult * secCred;
  D.securityDay = heads.security>0? 0 : 220;                                  // contract patrol if unstaffed
  D.adminDay = 380 + area*0.02;
  D.shrinkRate = mixBlend(v=>v.shrink) + P.shrinkAdd;
  D.invValue = invValue;
  D.dockCount = dd.dockDoors + S.autom.extraDocks;
  updateHeader();
}
function S_totalHeads(){ return Object.values(S.staff).reduce((a,b)=>a+b,0); }

/* ═══════════════════════════════════════════════════════════════════
   §7 SIMULATION ENGINE — discrete-event, 1-s resolution  (§4)
   ═══════════════════════════════════════════════════════════════════ */
const SIM = {
  t:0, day:1, month:0, paused:false, speed:1, speeds:[1,5,25,100,1000],
  pallets:0, inv:{}, promo:1, bestDay:0, backlog:0, staged:0, packQ:0, shippedToday:0, receivedToday:0,
  ordersToday:0, pickedToday:0, cohorts:[], lateToday:0, slaTrend:[],
  trucks:[], workers:[], vehicles:[], events:[],
  weather:{rain:false, heat:false, until:0},
  outage:false, outageUntil:0,
  fin:{ revToday:0, laborToday:0, energyToday:0, otherToday:0, days:[], months:[], cum:0, kwhToday:0 },
  cpoTrend:[], utilEMA:.5, dockBusy:0, dockSamples:1, dockBusySum:0,
  breakdowns:0, absentToday:0, rosterToday:0,
  started:false,
};
function totalInv(){ let t=0; for(const k in SIM.inv) t+=SIM.inv[k]; return t; }
function hourOf(){ return (SIM.t/3600)%24; }
function seasonTemp(){
  const m = SIM.month, L=S.loc;
  const seq=[L.tSummer,L.tSummer,L.tAutumn,L.tAutumn,L.tAutumn,L.tWinter,L.tWinter,L.tWinter,L.tSpring,L.tSpring,L.tSpring,L.tSummer]; // southern-hemisphere style; harmless generic cycle
  return seq[m];
}
function seasonMult(){ const m=SIM.month; return Object.entries(D.shares).reduce((a,[k,s])=>a+s*VERTICALS[k].season[m],0)||1; }

function resetSim(){
  RNG.reset(); recompute();
  Object.assign(SIM,{ t:6*3600, day:1, month:0, pallets:0, backlog:0, staged:0, packQ:0,
    shippedToday:0, receivedToday:0, ordersToday:0, pickedToday:0, trucks:[], workers:[], vehicles:[], events:[],
    weather:{rain:false,heat:false,until:0}, outage:false, outageUntil:0,
    fin:{revToday:0,laborToday:0,energyToday:0,otherToday:0,days:[],months:[],cum:-D.equity,kwhToday:0},
    cpoTrend:[], utilEMA:.5, dockBusySum:0, dockSamples:1, breakdowns:0, absentToday:0, rosterToday:0, started:true });
  SIM.inv={}; SIM.promo=1; SIM.bestDay=0; SIM.cohorts=[]; SIM.lateToday=0; SIM.slaTrend=[];
  for(const k in D.shares) SIM.inv[k]=Math.floor(D.basePallets*D.shares[k]*0.55);   // commissioning stock 55%
  SIM.pallets=totalInv();
  spawnWorld(); logEvent('Site commissioned — simulation started at '+S.loc.name,'ok');
}
function rollRoster(){
  const total=S_totalHeads();
  const absent = clamp((1-S.loc.laborAvail)*.12 + D.pen.absentAdd + RNG.gauss(0,.01), 0, .35);
  SIM.absentToday = Math.round(total*absent);
  SIM.rosterToday = total - SIM.absentToday;
  // rebuild worker entities to the rostered count (visual population)
  buildWorkers();
}
function newDay(){
  const f=SIM.fin;
  const dayRec={ day:SIM.day, rev:f.revToday, labor:f.laborToday, energy:f.energyToday, other:f.otherToday,
    orders:SIM.shippedToday, kwh:f.kwhToday, late:SIM.lateToday };
  dayRec.opex = dayRec.labor+dayRec.energy+dayRec.other;
  dayRec.cpo = SIM.shippedToday>0 ? dayRec.opex/SIM.shippedToday : 0;
  f.days.push(dayRec); if(f.days.length>400) f.days.shift();
  SIM.cpoTrend.push(dayRec.cpo); if(SIM.cpoTrend.length>60) SIM.cpoTrend.shift();
  if(SIM.shippedToday>SIM.bestDay && SIM.day>3){ SIM.bestDay=SIM.shippedToday; logEvent('Record dispatch — '+Math.round(SIM.shippedToday)+' orders shipped in a day','ok'); }
  const onTime = SIM.pickedToday>0? clamp(1-SIM.lateToday/Math.max(1,SIM.pickedToday),0,1) : 1;
  SIM.slaTrend.push(onTime); if(SIM.slaTrend.length>60) SIM.slaTrend.shift();
  if(onTime<0.95 && SIM.pickedToday>50){ SND.alert(); } if(onTime<0.95 && SIM.pickedToday>50) logEvent('SLA breach — '+((1-onTime)*100).toFixed(0)+'% shipped outside the '+(S.site.slaHours||24)+' h window; '+fmt$(SIM.lateToday*D.pickFee*0.5)+' service credits issued','warn');
  SIM.lateToday=0;
  f.cum += dayRec.rev - dayRec.opex - D.debtSvcMo/30.4;
  if(SIM.day%30===0){ closeMonth(); }
  SIM.day++; SIM.month = Math.floor((SIM.day-1)/30)%12;
  f.revToday=f.laborToday=f.energyToday=f.otherToday=f.kwhToday=0;
  SIM.shippedToday=SIM.receivedToday=SIM.ordersToday=SIM.pickedToday=0;
  rollRoster();
  // weather roll (climate-driven)
  const L=S.loc;
  if(RNG.r() < .06 + L.humidity*.1 + L.riskCyclone*.06){ SIM.weather.rain=true; SIM.weather.until=SIM.t+RNG.range(3,9)*3600; logEvent('Weather: rain front — yard moves slowed','warn'); }
  if(seasonTemp()>=30 && RNG.r()<.25){ SIM.weather.heat=true; SIM.weather.until=SIM.t+RNG.range(6,12)*3600; logEvent('Heatwave — refrigeration load up','warn'); }
  if(!S.dd.genset && RNG.r() < L.gridOutage/365){ SIM.outage=true; SIM.outageUntil=SIM.t+RNG.range(1,4)*3600; logEvent('Grid outage — operations halted (no backup generator)','bad'); }
  if(RNG.r() < L.riskCyclone*0.004){ SIM.outage=true; SIM.outageUntil=SIM.t+RNG.range(5,9)*3600;
    const excess=D.invValue*0.0004; SIM.fin.otherToday+=excess;
    logEvent('SEVERE STORM — site shut for the day-shift, insurance excess '+fmt$(excess)+' booked','bad'); }
  if(SIM.absentToday > S_totalHeads()*0.15) logEvent('Absenteeism spike — '+SIM.absentToday+' no-shows (labor index '+L.laborAvail+(S.dd.ptProx==='Far'?', PT far':'')+')','warn');
  if(RNG.r()<.05){ SIM.promo=1.3; logEvent('Client promo surge — order intake +30% today','warn'); } else SIM.promo=1;
}
function closeMonth(){
  const f=SIM.fin, last=f.days.slice(-30);
  const m={ month:f.months.length, rev:0,opex:0,orders:0, labor:0,energy:0,other:0,kwh:0,late:0 };
  last.forEach(d=>{m.rev+=d.rev;m.opex+=d.opex;m.orders+=d.orders;m.labor+=d.labor;m.energy+=d.energy;m.other+=d.other;m.kwh+=d.kwh||0;m.late+=d.late||0});
  m.debtSvc=D.debtSvcMo; m.ebitda=m.rev-m.opex; m.cash=m.ebitda-m.debtSvc;
  f.months.push(m);
  const first = m.ebitda>0 && f.months.filter(x=>x.ebitda>0).length===1;
  logEvent('Month '+(m.month+1)+' close — EBITDA '+fmt$(m.ebitda)+(first?' · first profitable month':''), m.ebitda>0?'ok':'warn');
  SND.chime(m.ebitda>0);
}
function logEvent(msg,cls){ SIM.events.unshift({t:SIM.day+'d '+String(Math.floor(hourOf())).padStart(2,'0')+':00', msg, cls}); if(SIM.events.length>40)SIM.events.pop(); }

/* ── per-second economic + flow tick ── */
function tick(){
  SIM.t++;
  const h=hourOf(), L=S.loc, P=D.pen, f=SIM.fin;
  if(SIM.t % 86400 < 1) newDay();
  if(SIM.weather.until && SIM.t>SIM.weather.until){ SIM.weather.rain=false; SIM.weather.heat=false; SIM.weather.until=0; }
  if(SIM.outage && SIM.t>SIM.outageUntil){ SIM.outage=false; logEvent('Grid restored','ok'); }
  const opsOpen = !SIM.outage && P.canOccupy && (!L.curfew || (h>=6&&h<22));

  // ORDERS — stochastic demand w/ seasonality + intraday curve
  const intraday = h>=8&&h<20 ? 1.72 : (h>=6&&h<8?0.74:0.18);   // integrates to ≈1.0/24h
  const perSec = D.baseOrders*seasonMult()*(SIM.promo||1)*intraday/86400 * (1+RNG.gauss(0,.15));
  if(RNG.r()<perSec){ SIM.backlog++; SIM.ordersToday++;
    let c=SIM.cohorts[SIM.cohorts.length-1];
    if(!c || SIM.t-c.born>1800){ c={born:SIM.t,n:0}; SIM.cohorts.push(c); }
    c.n++;
    if(SIM.cohorts.length>120){ const a=SIM.cohorts.shift(); SIM.cohorts[0].n+=a.n; SIM.cohorts[0].born=a.born; }
  }

  // TRUCK ARRIVAL WAVES (inbound) — waves at 06/10/14/18 ± congestion noise
  if(opsOpen && [6,10,14,18].includes(Math.floor(h)) && SIM.t%3600<1){
    // steady-state supply ≈ consumption at target fill; deficit adds proportional boost
    const defFac = clamp(1 + (D.basePallets-SIM.pallets)/Math.max(1,D.basePallets)*1.5, .4, 2.2);
    const n = Math.max(1, RNG.poisson(2.5*P.arrivalVar*seasonMult()*defFac));
    for(let i=0;i<n;i++) spawnTruck('in', RNG.range(0, L.congestMin*60*P.arrivalVar));
  }
  // outbound trucks summoned when packQ builds
  if(opsOpen && SIM.packQ>=26 && SIM.trucks.filter(t=>t.kind==='out'&&t.state!=='depart').length<3 && SIM.t%600<1) spawnTruck('out',0);

  // FLOW: staged → putaway → racking
  if(opsOpen){
    const putRate = (S.staff.putaway+S.staff.forklift*.5)*(SIM.rosterToday/Math.max(1,S_totalHeads()))* 22/3600; // pallets/s
    const mv = Math.min(SIM.staged, putRate*(SIM.weather.rain?0.99:1));
    if(mv>0 && SIM.pallets<D.palletCap){
      // deficit-weighted allocation across active verticals
      let defs={}, defT=0;
      for(const k in D.shares){ const d=Math.max(0, D.basePallets*D.shares[k]-(SIM.inv[k]||0)); defs[k]=d; defT+=d; }
      if(defT>0){ for(const k in defs) SIM.inv[k]=(SIM.inv[k]||0)+mv*defs[k]/defT; SIM.staged-=mv; }
    }
    // PICK: backlog → packQ, drawing real stock per vertical (picks ÷ 48 cartons/pallet)
    const pickersEff = pickersEffective();
    const pickRate = pickersEff * 20/3600 * P.pickMult / (D.picksPerOrder/6);   // orders/s
    let servable=0; for(const k in D.shares) if((SIM.inv[k]||0)>0.5) servable+=D.shares[k];
    if(SIM.backlog>0 && servable>0){
      const done = Math.min(SIM.backlog, pickRate*servable);
      SIM.backlog-=done; SIM.packQ+=done; SIM.pickedToday+=done;
      // SLA: consume oldest cohorts first (FIFO); late shipments earn the client a 50% pick-fee credit
      let rem=done, late=0; const slaS=(S.site.slaHours||24)*3600;
      while(rem>1e-6 && SIM.cohorts.length){ const c0=SIM.cohorts[0]; const take=Math.min(rem,c0.n);
        if(SIM.t-c0.born>slaS) late+=take;
        c0.n-=take; rem-=take; if(c0.n<=1e-6) SIM.cohorts.shift(); }
      if(late>0){ SIM.lateToday+=late; f.otherToday += late*D.pickFee*0.5; }
      for(const k in D.shares) if((SIM.inv[k]||0)>0.5)
        SIM.inv[k]=Math.max(0, SIM.inv[k]-done*(D.shares[k]/servable)*(VERTICALS[k].picks/48));
    }
    // PACK+DISPATCH via docked outbound trucks
    const packRate = S.staff.packing*26/3600*(S.autom.conveyor?1.25:1)*(S.autom.sortation?1.35:1);
    const outDocked = SIM.trucks.find(t=>t.kind==='out'&&t.state==='dock');
    if(SIM.packQ>0 && outDocked){
      const done=Math.min(SIM.packQ, packRate);
      SIM.packQ-=done; outDocked.load+=done;
      SIM.shippedToday+=done;
      f.revToday += done*D.pickFee;                                            // handling revenue
      if(outDocked.load>=outDocked.capacity) outDocked.state='departPrep';
    }
    // equipment breakdown events
    if(RNG.r()< (S.staff.forklift+S.autom.agv)*1.1e-6 ){ SIM.breakdowns++; logEvent('Equipment breakdown — maintenance dispatched (forklift #'+Math.ceil(RNG.r()*9)+')','warn'); f.otherToday+=380; }
  }
  // replenishment: keep inventory drifting toward target via inbound truck contents (handled in truck logic)
  // storage revenue & shrinkage — exact per-vertical rates on real stock pools
  for(const k in SIM.inv){ const v=VERTICALS[k];
    f.revToday   += SIM.inv[k]*S.loc.storageBench*v.storMult/7/86400;
    f.otherToday += SIM.inv[k]*v.valueDensity*(v.shrink+P.shrinkAdd)/365/86400; }
  SIM.pallets = totalInv();
  // labor cost accrues across the day
  f.laborToday += D.laborDay*(SIM.rosterToday/Math.max(1,S_totalHeads()))/86400 * (h>=22||h<6?0.35:1);
  // ENERGY: lighting(occupied hrs) + refrigeration(ambient-linked) + HVAC
  const amb = seasonTemp() + (SIM.weather.heat?6:0) + Math.sin((h-14)/24*2*Math.PI)*-4;
  const refrig = D.refrigKwhDay/86400 * (1 + Math.max(0,(amb-18))*0.028);
  const hvac = S.site.areaM2*0.004/86400 * Math.abs(amb-21)/10 *3600/3600;
  const light = (h>=5&&h<23?D.lightKwhDay/64800:D.lightKwhDay/64800*.15);
  const kwh = (refrig+hvac+light)*(SIM.outage?0:1);
  f.kwhToday+=kwh; f.energyToday += kwh*D.powerTariffEff*(SIM.weather.heat?1.12:1);
  // fixed dailies
  f.otherToday += (D.leaseDay + D.maintDay + D.insuranceYr/365 + D.securityDay + D.adminDay)/86400;
  // dock saturation sampling
  const busy=SIM.trucks.filter(t=>t.state==='dock').length;
  SIM.dockBusySum+=busy/Math.max(1,D.dockCount); SIM.dockSamples++;
  // labor utilization EMA (2 h)
  const util = clamp((SIM.backlog>0?1:0.35)+(SIM.staged>10?.15:0),0,1);
  SIM.utilEMA += (util-SIM.utilEMA)/7200;
  // trucks state machine
  truckTick();
}
function pickersEffective(){
  const n = S.staff.picking*(SIM.rosterToday/Math.max(1,S_totalHeads()));
  const agvAssist = Math.min(S.autom.agv*1.6, n*.8);
  // non-linear aisle congestion: penalty grows quadratically past 10 manual pickers, mitigated by automation
  const manual = Math.max(0, n-agvAssist*.4);
  const pen = manual>10 ? Math.pow((manual-10)/14,2)*(S.autom.slotting?0.55:1)*(S.autom.agv>0?0.7:1) : 0;
  return (n+agvAssist*.9) * clamp(1-pen,0.45,1);
}
/* ── trucks ── */
let truckId=0;
function spawnTruck(kind, delay){
  SIM.trucks.push({ id:++truckId, kind, state:'arrive', t:0, delay, x:-60, y:0, dock:-1,
    capacity: kind==='in'? Math.round(RNG.range(18,30)) : Math.round(RNG.range(24,32)), load:0,
    pallets: kind==='in'? Math.round(RNG.range(18,30)):0, smoke:RNG.r()<.3 });
}
function truckTick(){
  const P=D.pen, serviceBase = 55; // s per pallet unload w/ levellers
  for(const t of SIM.trucks){
    t.t++;
    switch(t.state){
      case 'arrive': if(t.t>t.delay+40){ t.state='queue'; t.t=0; } break;
      case 'queue': {
        if(t.t===2700){ SIM.fin.otherToday+=180; logEvent('Truck #'+t.id+' hit 45-min detention in the queue (+$180)','warn'); }
        const gateBusy = SIM.trucks.some(o=>o!==t && o.state==='gate');
        const ahead = SIM.trucks.filter(o=>o!==t&&o.state==='queue'&&o.id<t.id).length;
        if(!gateBusy && ahead===0 && t.t> (S.dd.gatehouse?90:30)){ t.state='gate'; t.t=0; }
        break; }
      case 'gate': if(t.t> (S.dd.gatehouse?110:260)){ // no gatehouse → paperwork chaos at dock
          const free=[...Array(D.dockCount).keys()].filter(i=>!SIM.trucks.some(o=>o.dock===i&&['dock','toDock','departPrep'].includes(o.state)));
          if(free.length){
            // dock zoning: inbound berths near receiving (left half), outbound near dispatch (right half)
            const half=D.dockCount/2;
            const pref=free.filter(i=> t.kind==='in' ? i<half : i>=half);
            const pool=pref.length?pref:free;
            t.dock=pool[Math.floor(RNG.r()*pool.length)]; t.state='toDock'; t.t=0; }
        } break;
      case 'toDock': if(t.t> 70*D.truckTurnVar*(SIM.weather.rain?1.25:1)){ t.state='dock'; t.t=0; SND.thud(); } break;
      case 'dock':
        if(t.kind==='in'){
          const per = serviceBase*P.unloadMult*(SIM.weather.rain?1.15:1);
          if(t.t> per*(t.capacity-t.pallets+1) && t.pallets>0){ t.pallets--; SIM.staged++; SIM.receivedToday++; SIM.fin.otherToday+=D.linehaulIn/t.capacity*0; }
          if(t.pallets<=0){ t.state='departPrep'; t.t=0; SIM.fin.otherToday += D.linehaulIn*t.capacity; }
        } else {
          if(t.state==='dock' && t.t>1500 && t.load>4) t.state='departPrep';   // cut-off departure
        }
        break;
      case 'departPrep': if(t.t>60){ if(t.kind==='out') SIM.fin.otherToday += D.linehaulOut*Math.ceil(t.load/12); t.state='depart'; t.t=0; } break;
      case 'depart': if(t.t>200){ t.dead=true; } break;
    }
  }
  SIM.trucks = SIM.trucks.filter(t=>!t.dead);
}

/* ═══════════════════════════════════════════════════════════════════
   §8 FINANCIAL & INVESTOR ENGINE  (§5)
   ═══════════════════════════════════════════════════════════════════ */
function modelRate(){ // steady-state estimate straight from the input model
    const rev = D.basePallets*D.storRate/7 + D.baseOrders*D.pickFee;
    const opex = D.laborDay + (D.refrigKwhDay+D.lightKwhDay)*D.powerTariffEff + D.leaseDay + D.maintDay + D.insuranceYr/365 + D.securityDay + D.adminDay + D.baseOrders/28*3*D.linehaulOut + D.baseOrders*D.picksPerOrder/48*D.linehaulIn;
    return {revDay:rev, opexDay:opex, orders:D.baseOrders, laborDay:D.laborDay, energyDay:(D.refrigKwhDay+D.lightKwhDay)*D.powerTariffEff, estimated:true};
}
function uphNow(){ // labor productivity: units picked per rostered labor-hour (trailing 7d or model)
  const days=SIM.fin.days.slice(-7);
  const ord = days.length? days.reduce((a,d)=>a+d.orders,0)/days.length : D.baseOrders;
  return ord*D.picksPerOrder/Math.max(1,(SIM.rosterToday||S_totalHeads())*8);
}
function runRate(){
  const days=SIM.fin.days.slice(-30);
  if(!days.length) return modelRate();
  const s=days.reduce((a,d)=>({rev:a.rev+d.rev,opex:a.opex+d.opex,orders:a.orders+d.orders,labor:a.labor+d.labor,energy:a.energy+d.energy}),{rev:0,opex:0,orders:0,labor:0,energy:0});
  const n=days.length;
  return {revDay:s.rev/n, opexDay:s.opex/n, orders:s.orders/n, laborDay:s.labor/n, energyDay:s.energy/n, estimated:false};
}
function project5y(over={}){
  // monthly cashflows, yr1 ramp 70→100%, growth 3%/yr, seasonality applied
  // base the projection on steady state: trailing sim data once 60 mature days exist, else the input model
  const rr = SIM.fin.days.length>=60 ? runRate() : modelRate();
  const cf=[]; let rev0=rr.revDay*30.4*(over.demand||1), opx0=rr.opexDay*30.4;
  const laborShare=rr.laborDay/Math.max(1,rr.opexDay), energyShare=rr.energyDay/Math.max(1,rr.opexDay);
  const leaseShare=D.leaseDay*30.4/Math.max(1,opx0);
  for(let m=0;m<60;m++){
    const ramp = m<10 ? .7+.03*m : 1;
    const g = Math.pow(1.03, m/12);
    const seas = Object.entries(D.shares).reduce((a,[k,s])=>a+s*VERTICALS[k].season[m%12],0)||1;
    let opexM = opx0*g*( 1 + laborShare*((over.wage||1)-1) + energyShare*((over.energy||1)-1) + leaseShare*((over.lease||1)-1) );
    opexM *= (.55 + .45*ramp*seas*(over.demand||1)); // variable portion flexes w/ volume
    const revM = rev0*ramp*seas*g;
    cf.push({rev:revM, opex:opexM, ebitda:revM-opexM, cash:revM-opexM-D.debtSvcMo});
  }
  if(S.site.tenure==='buy' && D.capex.landOrEntry>0){
    // terminal: property at 3%/yr appreciation less outstanding debt balance after 60 payments
    const r=S.site.debtRate/100/12, n=S.site.debtTermYr*12;
    const bal = D.debt>0? D.debt*(Math.pow(1+r,n)-Math.pow(1+r,60))/(Math.pow(1+r,n)-1) : 0;
    cf[59].cash += D.capex.landOrEntry*Math.pow(1.03,5) - bal;
  }
  return cf;
}
function npvIrr(cf){
  const rM = S.site.discountRate/100/12;
  let npv=-D.equity; cf.forEach((c,i)=>npv+=c.cash/Math.pow(1+rM,i+1));
  // IRR bisection on equity cashflows
  let lo=-0.05, hi=1.0, irr=NaN;
  const f=r=>{let v=-D.equity; cf.forEach((c,i)=>v+=c.cash/Math.pow(1+r/12,i+1)); return v;};
  if((f(lo)>0)!==(f(hi)>0)){ for(let i=0;i<60;i++){ const mid=(lo+hi)/2; if(f(mid)>0) lo=mid; else hi=mid; } irr=(lo+hi)/2; }
  // payback + breakeven
  let cum=-D.equity, payback=null, breakeven=null;
  cf.forEach((c,i)=>{ cum+=c.cash; if(payback===null&&cum>=0)payback=i+1; if(breakeven===null&&c.ebitda>0)breakeven=i+1; });
  const yr1=cf.slice(0,12), ebitdaYr=yr1.reduce((a,c)=>a+c.ebitda,0);
  const dscr = D.debtSvcMo>0 ? ebitdaYr/(D.debtSvcMo*12) : Infinity;
  return {npv, irr, payback, breakeven, dscr, ebitdaYr};
}
function sensitivity(){
  const base=npvIrr(project5y()).npv, out=[];
  [['Demand','demand'],['Wages','wage'],['Lease','lease'],['Energy','energy']].forEach(([lbl,k])=>{
    const up=npvIrr(project5y({[k]:1.2})).npv, dn=npvIrr(project5y({[k]:0.8})).npv;
    out.push({lbl, up:up-base, dn:dn-base});
  });
  return {base, bars:out.sort((a,b)=>Math.abs(b.up-b.dn)-Math.abs(a.up-a.dn))};
}
function confidenceScore(){
  const rr=runRate(), pj=npvIrr(project5y()), L=S.loc;
  const marginY = (rr.revDay-rr.opexDay)/Math.max(1,rr.revDay);
  const comp=[
    {k:'Site readiness (DD)', v:D.ddScore/100, w:.25, why:'due-diligence score'},
    {k:'EBITDA margin', v:clamp(marginY/0.28,0,1), w:.20, why:'vs 28% best-in-class 3PL'},
    {k:'IRR vs 12% hurdle', v: isNaN(pj.irr)?0:clamp(pj.irr/0.24,0,1), w:.20, why:'equity IRR'},
    {k:'Climate & regulatory risk', v:clamp(1-(L.riskCyclone*.5+L.riskFlood*.35+L.riskBushfire*.15+(S.dd.permits!=='Approved'?.25:0)),0,1), w:.15, why:'insurable hazards + permits'},
    {k:'Utilization headroom', v:clamp(SIM.started? SIM.pallets/Math.max(1,D.palletCap)/0.85 : .7,0,1), w:.10, why:'rack utilization vs 85% target'},
    {k:'Labor market', v:L.laborAvail, w:.10, why:'availability index'},
  ];
  let score=Math.round(100*comp.reduce((a,c)=>a+c.v*c.w,0));
  let override=null;
  if(!D.pen.canOccupy){ score=Math.min(score,25); override='Occupancy blocked: '+(!S.dd.zoningOk?'zoning non-conforming':!S.dd.occCert?'no occupancy certificate':'egress non-compliant'); }
  const verdict = score>=70?'GO':score>=50?'CONDITIONAL':'NO-GO';
  const flips = comp.slice().sort((a,b)=>a.v*a.w-b.v*b.w).slice(0,3).map(c=>flipText(c));
  return {score, verdict, comp, flips, override, pj, rr, marginY};
}
function flipText(c){
  const map={
    'Site readiness (DD)':'Lift DD score above 80 (resolve red items — sprinklers, power, compliance paperwork).',
    'EBITDA margin':'Raise margin above 18% — rebalance mix toward higher-rate verticals or cut CPO with automation.',
    'IRR vs 12% hurdle':'Push equity IRR past the 12% hurdle — reduce CapEx (lease vs buy) or negotiate rates.',
    'Climate & regulatory risk':'Secure approved permits and price hardened insurance / mitigation for climate exposure.',
    'Utilization headroom':'Fill racking to ≥70% steady-state via anchor-tenant contracts before commit.',
    'Labor market':'De-risk labor: shift premium, transport shuttle, or automation offsetting scarce local workforce.'
  };
  return map[c.k]||c.k;
}

function slaOnTime(){ const t=SIM.slaTrend.slice(-7); return t.length? t.reduce((a,b)=>a+b,0)/t.length : 1; }

function dockSat(){ return SIM.dockBusySum/Math.max(1,SIM.dockSamples); }
function energyShare(){ const rr=runRate(); return rr.energyDay/Math.max(1,rr.opexDay); }

function showToast(msg){ let t=el('toast'); if(!t){ t=document.createElement('div'); t.id='toast'; document.body.appendChild(t); }
  t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2200); }
function copyText(txt, okMsg){
  const done=()=>showToast(okMsg||'Copied to clipboard');
  const fallback=()=>{ const ta=document.createElement('textarea'); ta.value=txt; ta.style.cssText='position:fixed;opacity:0';
    document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); done(); }catch(e){ showToast('Copy failed — your browser blocked clipboard access'); } ta.remove(); };
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done,fallback); else fallback();
}
function scenarioPayload(sc,slot){
  return { app:'warehouse-tycoon', format:'scenario', version:4, slot:String.fromCharCode(65+slot),
    name:sc.name, savedAt:sc.saved, exportedAt:new Date().toISOString(),
    kpi:sc.kpi, config:sc.cfg };
}
window.exportScenario=function(i){ const sc=S.scenarios[i]; if(!sc) return;
  copyText(JSON.stringify(scenarioPayload(sc,i),null,2), 'Scenario '+String.fromCharCode(65+i)+' copied as JSON'); };
window.exportAllScenarios=function(){ const list=S.scenarios.map((sc,i)=>sc?scenarioPayload(sc,i):null).filter(Boolean);
  if(!list.length) return;
  copyText(JSON.stringify({app:'warehouse-tycoon',format:'scenario-set',version:4,exportedAt:new Date().toISOString(),scenarios:list},null,2),
    list.length+' scenario'+(list.length>1?'s':'')+' copied as JSON'); };

/* ═══════════════════════════════════════════════════════════════════
   §11 ISOMETRIC WORLD RENDERER  (§4 — "GTA for warehousing")
   Painter's-algorithm 2.5D; camera pan/zoom; day/night; weather;
   clickable zones/vehicles/workers → inspector card.
   ═══════════════════════════════════════════════════════════════════ */
const CAM = { x:0, y:-40, z:1, dragging:false, lx:0, ly:0 };
const TILE=26, TILEH=13;
function isoX(gx,gy){ return (gx-gy)*TILE; }
function isoY(gx,gy,gz=0){ return (gx+gy)*TILEH - gz*TILE; }
const DEPT_COLORS={ receiving:'#6FA3CC', putaway:'#8FBF6B', forklift:'#FFB020', picking:'#C58FCC', packing:'#E0C36B', dispatch:'#FF9B54', qc:'#5BD6C8', maintenance:'#E5484D', cleaning:'#9AA5B5', security:'#F2F7C8', supervisor:'#FFFFFF', admin:'#B9C4D4' };
let WORLD={zones:[],rackBlocks:[]};
function spawnWorld(){
  // layout derives from config: building footprint, docks along south face, modules per active vertical
  const W=34, Hh=22;                      // building grid size
  WORLD={zones:[],rackBlocks:[], W, H:Hh};
  const z=(id,name,gx,gy,w,h,color,info)=>WORLD.zones.push({id,name,gx,gy,w,h,color,info});
  z('yardIn','Receiving yard',2,Hh+2,14,6,'#1a212e');
  z('yardOut','Shipping yard',18,Hh+2,14,6,'#1a212e');
  z('gate','Gatehouse',0,Hh+4,2,2,S.dd.gatehouse?'#2a3345':'#442222');
  z('staging','Inbound staging',2,Hh-3,10,3,'#232c3d');
  z('pack','Packing benches',20,Hh-3,8,3,'#2d3143');
  z('dispatch','Dispatch lanes',28,Hh-3,5,3,'#33291d');
  z('break','Break room',0,0,4,3,'#22303a');
  z('office','Office / admin',30,0,4,3,'#2a2f42');
  z('charge','AGV charging',14,Hh-3,3,3,S.autom.agv>0?'#1d3326':'#1a212e');
  if(S.autom.conveyor||S.autom.sortation) z('conv','Conveyor / sortation',12,Hh-5,12,1.6,'#3a3320');
  // rack modules per active vertical, width ∝ share
  const sh=D.shares, keys=Object.keys(sh);
  let gx=1; const totW=30;
  keys.forEach(k=>{
    const w=Math.max(2,Math.round(sh[k]*totW));
    const v=VERTICALS[k];
    WORLD.rackBlocks.push({k, name:v.name, gx, gy:4, w:Math.min(w,totW-gx+1), h:12, color:v.color, feature:v.feature});
    gx+=w+1; if(gx>totW) gx=totW;
  });
  buildWorkers(); buildVehicles();
}
function zoneAnchor(id){ const z=WORLD.zones.find(z=>z.id===id); return z? {x:z.gx+z.w/2, y:z.gy+z.h/2} : {x:17,y:12}; }
function rackAnchor(){ const r=WORLD.rackBlocks[Math.floor(RNG.r()*WORLD.rackBlocks.length)]; return r? {x:r.gx+RNG.r()*r.w, y:r.gy+RNG.r()*r.h} : {x:17,y:10}; }
const DEPT_ROUTES={
  receiving:()=>[zoneAnchor('yardIn'),zoneAnchor('staging')],
  putaway:()=>[zoneAnchor('staging'),rackAnchor()],
  forklift:()=>[zoneAnchor('staging'),rackAnchor(),zoneAnchor('dispatch')],
  picking:()=>[rackAnchor(),rackAnchor(),zoneAnchor('pack')],
  packing:()=>[zoneAnchor('pack'),{x:zoneAnchor('pack').x+1,y:zoneAnchor('pack').y}],
  dispatch:()=>[zoneAnchor('pack'),zoneAnchor('dispatch'),zoneAnchor('yardOut')],
  qc:()=>[rackAnchor(),zoneAnchor('staging')],
  maintenance:()=>[zoneAnchor('charge'),rackAnchor(),zoneAnchor('office')],
  cleaning:()=>[rackAnchor(),zoneAnchor('break'),rackAnchor()],
  security:()=>[zoneAnchor('gate'),{x:zoneAnchor('gate').x+1,y:zoneAnchor('gate').y}],
  supervisor:()=>[zoneAnchor('staging'),zoneAnchor('pack'),zoneAnchor('office')],
  admin:()=>[zoneAnchor('office'),{x:zoneAnchor('office').x-1,y:zoneAnchor('office').y+1}],
};
function buildWorkers(){
  SIM.workers=[];
  const ratio = SIM.rosterToday>0? SIM.rosterToday/Math.max(1,S_totalHeads()) : 1;
  let budget=64; // perf cap (§7); degrade gracefully by capping population
  for(const dept in S.staff){
    let n=Math.round(S.staff[dept]*ratio);
    n=Math.min(n,budget); budget-=n;
    for(let i=0;i<n;i++){
      const wp=DEPT_ROUTES[dept]();
      SIM.workers.push({dept, x:wp[0].x+RNG.r(), y:wp[0].y+RNG.r(), wps:wp, wi:0, speed:.010+RNG.r()*.006, fatigue:RNG.r()*.3, onBreak:false, lunch:i%2===0});
    }
  }
}
function buildVehicles(){
  SIM.vehicles=[];
  const nf=Math.min(S.staff.forklift,8);
  for(let i=0;i<nf;i++) SIM.vehicles.push({kind:'forklift', x:6+RNG.r()*4, y:18+RNG.r()*2, wps:[zoneAnchor('staging'),rackAnchor()], wi:0, speed:.02, carrying:RNG.r()<.5});
  for(let i=0;i<Math.min(S.autom.agv,10);i++) SIM.vehicles.push({kind:'agv', x:15, y:20, wps:[zoneAnchor('charge'),rackAnchor(),zoneAnchor('pack')], wi:0, speed:.028, charge:RNG.r()});
}
function moveAgent(a,dt){
  if(a.onBreak) return;
  const h=hourOf();

function hitTest(sx,sy){

  for(const v of SIM.vehicles) if(v._sx!==undefined&&near(v._sx,v._sy,12)) return {type:'vehicle',ref:v};

function lineChart(cv, series, opts={}){

  const ctx=cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);

  let mn=Math.min(0,...all), mx=Math.max(...all,1); if(mx===mn)mx=mn+1;
  const X=i=>pad.l+(r.width-pad.l-pad.r)*i/Math.max(1,series[0].data.length-1);

  ctx.strokeStyle='#EBE7DA'; ctx.fillStyle='#8A8272'; ctx.font='9px monospace';
  for(let i=0;i<=4;i++){ const v=mn+(mx-mn)*i/4, y=Y(v); ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(r.width-pad.r,y);ctx.stroke(); ctx.fillText(opts.fmt?opts.fmt(v):fmtN(v),4,y+3); }
  if(opts.zero&&mn<0){ ctx.strokeStyle='#C13A3A66'; ctx.beginPath();ctx.moveTo(pad.l,Y(0));ctx.lineTo(r.width-pad.r,Y(0));ctx.stroke(); }
  if(opts.sla){ ctx.strokeStyle='#C13A3A'; ctx.setLineDash([4,4]); ctx.beginPath();ctx.moveTo(pad.l,Y(opts.sla));ctx.lineTo(r.width-pad.r,Y(opts.sla));ctx.stroke(); ctx.setLineDash([]); ctx.fillStyle='#C13A3A'; ctx.fillText('SLA '+(opts.fmt?opts.fmt(opts.sla):opts.sla), r.width-70, Y(opts.sla)-4); }
  series.forEach(s=>{ ctx.strokeStyle=s.color; ctx.lineWidth=1.6; ctx.beginPath();
    s.data.forEach((v,i)=>{ i?ctx.lineTo(X(i),Y(v)):ctx.moveTo(X(i),Y(v)); }); ctx.stroke();
    if(s.fill){ ctx.lineTo(X(s.data.length-1),Y(Math.max(mn,0))); ctx.lineTo(X(0),Y(Math.max(mn,0))); ctx.closePath(); ctx.fillStyle=s.color+'22'; ctx.fill(); } });
}
function barChart(cv, labels, values, colors, fmt){
  const dpr=window.devicePixelRatio||1, r=cv.getBoundingClientRect();
  cv.width=r.width*dpr; cv.height=r.height*dpr;
  const ctx=cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,r.width,r.height);
  const mx=Math.max(...values,1), bw=(r.width-50)/labels.length;
  labels.forEach((l,i)=>{ const h=(r.height-30)*values[i]/mx;
    ctx.fillStyle=colors[i]||'#3E7CA6'; ctx.fillRect(40+i*bw+3, r.height-20-h, bw-6, h);
    ctx.fillStyle='#8A8272'; ctx.font='9px monospace'; ctx.save(); ctx.translate(40+i*bw+bw/2, r.height-8); ctx.textAlign='center'; ctx.fillText(l,0,0); ctx.restore();
    ctx.fillStyle='#3A362C'; ctx.textAlign='center'; ctx.fillText(fmt?fmt(values[i]):fmtN(values[i]), 40+i*bw+bw/2, r.height-24-h); ctx.textAlign='left'; });
}
function tornadoChart(cv, sens){
  const dpr=window.devicePixelRatio||1, r=cv.getBoundingClientRect();
  cv.width=r.width*dpr; cv.height=r.height*dpr;
  const ctx=cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,r.width,r.height);
  const mx=Math.max(...sens.bars.flatMap(b=>[Math.abs(b.up),Math.abs(b.dn)]),1);
  const cx=r.width/2, rowH=(r.height-24)/sens.bars.length;
  ctx.strokeStyle='#B8B09C'; ctx.beginPath(); ctx.moveTo(cx,4); ctx.lineTo(cx,r.height-20); ctx.stroke();
  sens.bars.forEach((b,i)=>{ const y=8+i*rowH;
    ctx.fillStyle='#2F7D4699'; const w1=(Math.max(b.up,b.dn))/mx*(cx-70); const w2=(Math.min(b.up,b.dn))/mx*(cx-70);
    ctx.fillRect(cx, y, Math.max(0,w1), rowH-12);
    ctx.fillStyle='#C13A3A99'; ctx.fillRect(cx+Math.min(0,w2), y, Math.abs(Math.min(0,w2)), rowH-12);
    ctx.fillStyle='#3A362C'; ctx.font='10px monospace'; ctx.fillText(b.lbl+' ±20%', 4, y+rowH/2);
    ctx.fillStyle='#8A8272'; ctx.fillText(sgn$(Math.min(b.up,b.dn)), 4, y+rowH/2+11);
    ctx.fillText(sgn$(Math.max(b.up,b.dn)), cx+(cx-70)*Math.max(0,Math.max(b.up,b.dn))/mx+6, y+rowH/2); });
  ctx.fillStyle='#8A8272'; ctx.font='9px monospace'; ctx.textAlign='center'; ctx.fillText('Δ NPV vs base '+fmt$(sens.base), cx, r.height-6); ctx.textAlign='left';
}

function renderFin(){
  const rr=runRate(), pj=npvIrr(project5y()), sens=sensitivity();
  const C=D.capex;
  // per-vertical contribution: labor by pick intensity, insurance by value at risk, energy by profile intensity
  const dvol=S.site.areaM2*Math.min(S.dd.clearHeight,12);
  const pickSum=Object.entries(D.shares).reduce((a,[k,sh])=>a+sh*VERTICALS[k].picks,0)||1;
  const invT=Math.max(1,Object.entries(D.shares).reduce((a,[k,sh])=>a+(SIM.started?(SIM.inv[k]||0):D.basePallets*sh)*VERTICALS[k].valueDensity,0));
  const drill=Object.entries(D.shares).map(([k,sh])=>{ const v=VERTICALS[k];
    const pal=SIM.started?(SIM.inv[k]||0):D.basePallets*sh;
    const stor=pal*S.loc.storageBench*v.storMult*52;
    const hand=rr.orders*sh*S.loc.pickBench*v.handMult*365;
    const labor=rr.laborDay*365*(sh*v.picks/pickSum)*0.62;
    const energy=sh*v.energyInt*dvol*365*D.powerTariffEff;
    const shrink=pal*v.valueDensity*(v.shrink+D.pen.shrinkAdd);
    const ins=D.insuranceYr*(pal*v.valueDensity/invT);
    const contrib=stor+hand-labor-energy-shrink-ins;
    return {k,v,pal,stor,hand,labor,energy,shrink,ins,contrib,cm:contrib/Math.max(1,stor+hand)};
  }).sort((a,b)=>b.contrib-a.contrib);
  const dt=drill.reduce((a,d)=>({stor:a.stor+d.stor,hand:a.hand+d.hand,labor:a.labor+d.labor,energy:a.energy+d.energy,shrink:a.shrink+d.shrink,ins:a.ins+d.ins,contrib:a.contrib+d.contrib}),{stor:0,hand:0,labor:0,energy:0,shrink:0,ins:0,contrib:0});
  el('stage-fin').innerHTML=`
    <div class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-5 gap-2 mb-4">
      ${[['Total CapEx',fmt$(C.total)],['Equity in',fmt$(D.equity)],['NPV @'+S.site.discountRate+'%',fmt$(pj.npv)],['IRR',isNaN(pj.irr)?'n/a':(pj.irr*100).toFixed(1)+'%'],
        ['Payback',pj.payback?pj.payback+' mo':'>60 mo'],['Break-even',pj.breakeven?'month '+pj.breakeven:'—'],['DSCR (yr 1)',pj.dscr===Infinity?'no debt':pj.dscr.toFixed(2)+'×'],['Rev / m²',fmt$(rr.revDay*365/S.site.areaM2)+'/yr'],
        ['EBITDA margin',((rr.revDay-rr.opexDay)/Math.max(1,rr.revDay)*100).toFixed(1)+'%'],['Units / labor hr',uphNow().toFixed(1)+' u/hr'],
        ['SLA on-time (7 d)',(slaOnTime()*100).toFixed(1)+'%'],['SLA credits','−'+fmt$((1-slaOnTime())*rr.orders*D.pickFee*0.5)+'/day']]
        .map(([l,v])=>`<div class="card p-2"><div class="lbl">${l}</div><div class="num font-bold text-[14px] mt-0.5">${v}</div></div>`).join('')}
    </div>
    <div class="grid grid-cols-1 xl:grid-cols-2 gap-3 mb-3">
      <div class="card p-3"><div class="lbl mb-1">Cumulative cash flow ($, from −equity)</div><canvas id="chCash" class="w-full h-44"></canvas></div>

function pnlRow(m,label,cls){
  const marg=m.rev>0?(m.rev-m.opex)/m.rev:0, cpo=m.orders>0?m.opex/m.orders:0, net=(m.rev-m.opex)-(m.debtSvc||D.debtSvcMo);
  return `<tr class="border-b border-line/40 ${cls||''}"><td class="text-mut whitespace-nowrap">${label}</td>
    <td class="text-right">${fmt$(m.rev)}</td><td class="text-right text-mut">−${fmt$(m.labor||0)}</td>
    <td class="text-right text-mut">−${fmt$(m.energy||0)}</td><td class="text-right text-mut">−${fmt$(m.other||0)}</td>
    <td class="text-right font-semibold ${m.rev-m.opex>=0?'text-ok':'text-warn'}">${fmt$(m.rev-m.opex)}</td>
    <td class="text-right ${marg>=.1?'text-ok':marg>=0?'text-amber':'text-warn'}">${(marg*100).toFixed(1)}%</td>
    <td class="text-right text-mut">−${fmt$(m.debtSvc||D.debtSvcMo)}</td>
    <td class="text-right font-semibold ${net>=0?'text-ok':'text-warn'}">${fmt$(net)}</td>
    <td class="text-right">${fmtN(Math.round(m.orders))}</td><td class="text-right">${cpo?fmt$(cpo):'—'}</td></tr>`;
}
function monthlyPnlCard(){
  const f=SIM.fin, months=f.months.slice(-12);
  const dim=(SIM.day-1)%30;                       // days into the open month
  let mtd=null;
  if(SIM.started && dim>0 && f.days.length){ const dd=f.days.slice(-dim);
    mtd={rev:0,opex:0,orders:0,labor:0,energy:0,other:0};
    dd.forEach(d=>{mtd.rev+=d.rev;mtd.opex+=d.opex;mtd.orders+=d.orders;mtd.labor+=d.labor;mtd.energy+=d.energy;mtd.other+=d.other});
    mtd.debtSvc=D.debtSvcMo*dim/30; }
  return `<div class="card p-3 mt-3 overflow-x-auto">
    <div class="lbl mb-2">Monthly P&L statements — closed months plus the month in progress</div>
    ${months.length||mtd?`<table class="w-full num min-w-[760px]">
      <tr class="lbl"><th class="text-left">Month</th><th class="text-right">Revenue</th><th class="text-right">Labor</th><th class="text-right">Energy</th><th class="text-right">Other opex</th><th class="text-right">EBITDA</th><th class="text-right">Margin</th><th class="text-right">Debt svc</th><th class="text-right">Net cash</th><th class="text-right">Orders</th><th class="text-right">CPO</th></tr>
      ${months.slice().reverse().map(m=>pnlRow(m, MONTHS[m.month%12]+' · M'+(m.month+1))).join('')}
      ${mtd?pnlRow(mtd, MONTHS[SIM.month]+' · to date ('+dim+' d)','opacity-70 italic'):''}
    </table>
    <div class="text-[10px] text-mut mt-1.5">Each statement closes on a 30-day cycle. Net cash = EBITDA less scheduled debt service${months.length>12?' · showing the last 12 months':''}.</div>`
    :`<div class="text-[12px] text-mut py-3">No months closed yet — run the live floor for 30 simulated days and the first statement lands here.</div>`}
  </div>`;
}
function cumSeries(){ let c=-D.equity; const out=[c]; SIM.fin.days.forEach(d=>{c+=d.rev-d.opex-D.debtSvcMo/30.4; out.push(c);}); return out; }

function renderScenarios(){
  const saved=S.scenarios.filter(Boolean);
  // metric rows: [label, formatter, raw accessor, direction ('hi' better / 'lo' better)]
  const rows=[
    ['Location',c=>esc(c.cfg.loc.name),null,null],
    ['DD score',c=>c.kpi.dd+'/100',c=>c.kpi.dd,'hi'],
    ['CapEx',c=>fmt$(c.kpi.capex),c=>c.kpi.capex,'lo'],
    ['Revenue /yr',c=>fmt$(c.kpi.revYr),c=>c.kpi.revYr,'hi'],
    ['EBITDA /yr',c=>fmt$(c.kpi.ebitdaYr),c=>c.kpi.ebitdaYr,'hi'],
    ['Margin',c=>(c.kpi.margin*100).toFixed(1)+'%',c=>c.kpi.margin,'hi'],
    ['NPV',c=>fmt$(c.kpi.npv),c=>c.kpi.npv,'hi'],
    ['IRR',c=>isNaN(c.kpi.irr)?'n/a':(c.kpi.irr*100).toFixed(1)+'%',c=>isNaN(c.kpi.irr)?-1:c.kpi.irr,'hi'],
    ['DSCR',c=>c.kpi.dscr===Infinity?'—':c.kpi.dscr.toFixed(2)+'×',c=>c.kpi.dscr===Infinity?99:c.kpi.dscr,'hi'],
    ['Payback',c=>c.kpi.payback?c.kpi.payback+' mo':'>60',c=>c.kpi.payback||99,'lo'],
    ['CPO',c=>fmt$(c.kpi.cpo),c=>c.kpi.cpo,'lo'],
    ['Rev / m²',c=>fmt$(c.kpi.revM2),c=>c.kpi.revM2,'hi'],
    ['Score / verdict',c=>`<b class="${c.kpi.verdict==='GO'?'text-ok':c.kpi.verdict==='CONDITIONAL'?'text-amber':'text-warn'}">${c.kpi.score} ${c.kpi.verdict}</b>`,c=>c.kpi.score,'hi'],
  ];
  function cellCls(row,sc){ // best = green, worst = red — only when 2+ saved and values actually differ
    if(!row[3]||saved.length<2||!sc) return '';
    const vals=saved.map(row[2]); if(Math.max(...vals)===Math.min(...vals)) return '';
    const v=row[2](sc);
    const best = row[3]==='hi'? Math.max(...vals):Math.min(...vals);
    const worst= row[3]==='hi'? Math.min(...vals):Math.max(...vals);
    return v===best?'text-ok font-bold':v===worst?'text-warn':'';
  }
  // config diff: only fields where the saved scenarios disagree
  const cfgRows=[
    ['Location',c=>c.loc.name],['Area',c=>(c.site.areaM2/1000)+'k m²'],['Tenure',c=>c.site.tenure],

/* ═══════════════════════════════════════════════════════════════════
   §11b MINI-MAP — scaled-down iso overview with live viewport window.
   Click anywhere on it to jump the camera.
   ═══════════════════════════════════════════════════════════════════ */
const MINI={w:158,h:112,s:1,ox:0,oy:0};
function miniProject(){ // fit full world (incl. yard) into the mini canvas
  const W=WORLD.W||34,Hh=WORLD.H||22;
  const cs=[[-2,-2],[W+3,-2],[W+3,Hh+10],[-2,Hh+10]].map(([x,y])=>[isoX(x,y),isoY(x,y)]);
  const xs=cs.map(c=>c[0]),ys=cs.map(c=>c[1]);
  const mnx=Math.min(...xs),mxx=Math.max(...xs),mny=Math.min(...ys),mxy=Math.max(...ys);
  MINI.s=Math.min((MINI.w-10)/(mxx-mnx),(MINI.h-10)/(mxy-mny));
  MINI.ox=MINI.w/2-(mnx+mxx)/2*MINI.s; MINI.oy=MINI.h/2-(mny+mxy)/2*MINI.s;
}
function mPt(gx,gy){ return [isoX(gx,gy)*MINI.s+MINI.ox, isoY(gx,gy)*MINI.s+MINI.oy]; }
function mQuad(ctx,gx,gy,w,h,fill){ ctx.fillStyle=fill; ctx.beginPath();
  const p=[mPt(gx,gy),mPt(gx+w,gy),mPt(gx+w,gy+h),mPt(gx,gy+h)];
  ctx.moveTo(p[0][0],p[0][1]); for(let i=1;i<4;i++) ctx.lineTo(p[i][0],p[i][1]); ctx.closePath(); ctx.fill(); }
function drawMiniMap(){
  const cv=el('miniMap'); if(!cv || cv.classList.contains('hidden')) return;
  const dpr=window.devicePixelRatio||1;
  if(cv.width!==MINI.w*dpr){ cv.width=MINI.w*dpr; cv.height=MINI.h*dpr; }
  const ctx=cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,MINI.w,MINI.h);
  miniProject();
  const W=WORLD.W||34,Hh=WORLD.H||22;
  mQuad(ctx,-1,-1,W+3,Hh+10,'#CFCaBB');                                   // yard slab
  mQuad(ctx,0,0,W,Hh,'#B9B3A1');                                          // building
  for(const z of WORLD.zones) mQuad(ctx,z.gx,z.gy,z.w,z.h,z.color+'CC');  // zones
  ctx.fillStyle='#6E675A';                                                // rack rows
  for(const r of WORLD.rackBlocks) mQuad(ctx,r.gx,r.gy,r.w,r.h,'#6E675A99');
  for(const t of SIM.trucks){ const p=truckPos(t); if(!p) continue;       // trucks
    const [x,y]=mPt(p.gx,p.gy); ctx.fillStyle=t.kind==='in'?'#3E7CA6':'#E07B3C';
    ctx.beginPath(); ctx.arc(x,y,2,0,7); ctx.fill(); }
  // viewport window: main canvas world-space rect → mini coords
  const mc=el('simCanvas'); if(mc){ const r=mc.getBoundingClientRect();
    const wx0=(-r.width/2-CAM.x)/CAM.z, wx1=(r.width/2-CAM.x)/CAM.z;
    const wy0=(-r.height/2-CAM.y)/CAM.z, wy1=(r.height/2-CAM.y)/CAM.z;
    ctx.strokeStyle='#C96442'; ctx.lineWidth=1.4;
    ctx.strokeRect(wx0*MINI.s+MINI.ox, wy0*MINI.s+MINI.oy, (wx1-wx0)*MINI.s, (wy1-wy0)*MINI.s); }
}
(function(){ const cv=el('miniMap'); if(!cv) return;
  cv.addEventListener('click',e=>{ const r=cv.getBoundingClientRect(); miniProject();
    const wx=((e.clientX-r.left)-MINI.ox)/MINI.s, wy=((e.clientY-r.top)-MINI.oy)/MINI.s;
    CAM.x=-wx*CAM.z; CAM.y=-wy*CAM.z; });
})();

/* ═══════════════════════════════════════════════════════════════════
   §14 MAIN LOOP, SHORTCUTS, ONBOARDING, INIT
   ═══════════════════════════════════════════════════════════════════ */
let uiTimer=0, lastFrame=performance.now();
function frame(now){
  try{ frameBody(now); }catch(e){ if(!frame._warned){ frame._warned=true; console.error('frame',e); } }
  requestAnimationFrame(frame);
}
function frameBody(now){
  const dt=Math.min(100,now-lastFrame); lastFrame=now;
  if(SIM.started && !SIM.paused){
    // 1-s resolution: batch ticks per frame by speed; coarse economics at high speed
    const target=SIM.speed*dt/1000*1;           // sim-seconds this frame at 1× = real-time-ish pacing ×60
    let n=Math.round(SIM.speed*(dt/16.7));      // ≈ speed ticks per 60fps frame
    n=Math.min(n, SIM.speed>=1000?4000:SIM.speed>=100?500:SIM.speed);
    for(let i=0;i<n;i++) tick();
  }
  if(S.tab==='sim'){ renderWorld(); renderSimUi(); drawMiniMap();
    if(SIM.started && !SIM.paused && SIM.trucks.some(t=>t.state==='toDock')) SND.beep(); }
  uiTimer+=dt;
  if(uiTimer>800){ uiTimer=0; kpiRibbon(); updateHeader();
    if(S.tab==='sim') renderLeft();
    if(S.tab==='adv') renderAdv();
  }
}
document.addEventListener('keydown',e=>{
  if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName)) return;
  if(e.code==='Space'){ e.preventDefault(); SIM.paused=!SIM.paused; renderSimUi(); }
  if(['1','2','3','4','5'].includes(e.key)){ SIM.speed=SIM.speeds[+e.key-1]; renderSimUi(); }
});

  el('obPrev').style.visibility=obI===0?'hidden':'visible'; el('obNext').textContent=obI===4?'Start building →':'Next →';
  el('onboard').classList.remove('hidden'); el('onboard').classList.add('flex'); }
function hideOb(){ el('onboard').classList.add('hidden'); el('onboard').classList.remove('flex'); S.onboardSeen=true; }
el('obNext').onclick=()=>obI===4?hideOb():showOb(obI+1);
el('obPrev').onclick=()=>showOb(obI-1);
el('obSkip').onclick=hideOb;
el('btnHelp').onclick=()=>showOb(0);

/* init */
recompute();
rollRoster();
spawnWorld();
resetSim();          // world is alive immediately; SETUP changes re-seed via ▶ button
setTab('setup');
kpiRibbon();
bindCanvas();
showOb(0);
requestAnimationFrame(frame);
</script>
