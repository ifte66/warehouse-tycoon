/* ── FINANCIALS ── */
function renderFin(){
  const rr=runRate(), pj=npvIrr(project5y()), sens=sensitivity();
  const C=D.capex;
  // per-vertical contribution: labor by pick intensity, insurance by value at risk, energy by profile intensity
  const dvol=S.site.areaM2*Math.min(S.dd.clearHeight,12);
  const pickSum=Object.entries(D.shares).reduce((a,[k,sh])=>a+sh*VERTICALS[k].picks,0)||1;
  const invT=Math.max(1,Object.entries(D.shares).reduce((a,[k,sh])=>a+(SIM.started?(SIM.inv[k]||0):D.basePallets*sh)*VERTICALS[k].valueDensity,0));
  const drill=Object.entries(D.shares).map(([k,sh])=>{ const v=VERTICALS[k];
    const pal=SIM.started?(SIM.inv[k]||0):D.basePallets*sh;
    const stor=pal*S.loc.storageBench*v.storMult*52;
    const hand=rr.orders*sh*S.loc.pickBench*v.handMult*365;
    const labor=rr.laborDay*365*(sh*v.picks/pickSum)*0.62;
    const energy=sh*v.energyInt*dvol*365*D.powerTariffEff;
    const shrink=pal*v.valueDensity*(v.shrink+D.pen.shrinkAdd);
    const ins=D.insuranceYr*(pal*v.valueDensity/invT);
    const contrib=stor+hand-labor-energy-shrink-ins;
    return {k,v,pal,stor,hand,labor,energy,shrink,ins,contrib,cm:contrib/Math.max(1,stor+hand)};
  }).sort((a,b)=>b.contrib-a.contrib);
  const dt=drill.reduce((a,d)=>({stor:a.stor+d.stor,hand:a.hand+d.hand,labor:a.labor+d.labor,energy:a.energy+d.energy,shrink:a.shrink+d.shrink,ins:a.ins+d.ins,contrib:a.contrib+d.contrib}),{stor:0,hand:0,labor:0,energy:0,shrink:0,ins:0,contrib:0});
  el('stage-fin').innerHTML=`
    <div class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-5 gap-2 mb-4 mono">
      ${[['TOTAL CAPEX',fmt$(C.total)],['EQUITY IN',fmt$(D.equity)],['NPV @'+S.site.discountRate+'%',fmt$(pj.npv)],['IRR',isNaN(pj.irr)?'n/a':(pj.irr*100).toFixed(1)+'%'],
        ['PAYBACK',pj.payback?pj.payback+' mo':'>60 mo'],['BREAK-EVEN',pj.breakeven?'month '+pj.breakeven:'—'],['DSCR (yr1)',pj.dscr===Infinity?'no debt':pj.dscr.toFixed(2)+'×'],['REV / m²',fmt$(rr.revDay*365/S.site.areaM2)+'/yr'],
        ['EBITDA MARGIN',((rr.revDay-rr.opexDay)/Math.max(1,rr.revDay)*100).toFixed(1)+'%'],['UPH (LABOR)',uphNow().toFixed(1)+' u/hr'],
        ['SLA ON-TIME (7d)',(slaOnTime()*100).toFixed(1)+'%'],['SLA CREDITS','−'+fmt$((1-slaOnTime())*rr.orders*D.pickFee*0.5)+'/day']]
        .map(([l,v])=>`<div class="card p-2"><div class="lbl">${l}</div><div class="num font-bold text-[14px] mt-0.5">${v}</div></div>`).join('')}
    </div>
    <div class="grid grid-cols-1 xl:grid-cols-2 gap-3 mb-3">
      <div class="card p-3"><div class="lbl mb-1">Cumulative cash flow ($, from −equity)</div><canvas id="chCash" class="w-full h-44"></canvas></div>
      <div class="card p-3"><div class="lbl mb-1">Cost per order — 60-day trend vs pick fee</div><canvas id="chCpo" class="w-full h-44"></canvas></div>
      <div class="card p-3"><div class="lbl mb-1">OpEx by category ($/day, trailing 30d)</div><canvas id="chOpex" class="w-full h-44"></canvas></div>
      <div class="card p-3"><div class="lbl mb-1">Sensitivity — Δ NPV, ±20% each driver (tornado)</div><canvas id="chTorn" class="w-full h-44"></canvas></div>
    </div>
    <div class="grid grid-cols-1 xl:grid-cols-2 gap-3">
      <div class="card p-3 overflow-x-auto"><div class="lbl mb-2">CapEx build-up</div><table class="w-full mono num">
        ${[['Land / entry',C.landOrEntry],['Fit-out & compliance CapEx (mix-driven)',C.fitout],['Racking ('+fmtN(D.palletCap)+' positions)',C.racking],['Equipment & automation',C.equipment],['Remediation / permits',C.compliance],['Less govt incentives',-S.loc.govtIncentive*1000]]
          .map(([l,v])=>`<tr class="border-b border-line/40"><td class="text-mut">${l}</td><td class="text-right">${fmt$(v)}</td></tr>`).join('')}
        <tr class="font-bold text-amber"><td>Total</td><td class="text-right">${fmt$(C.total)}</td></tr>
        <tr><td class="text-mut">Debt @ ${S.site.debtLVR}% LVR, ${S.site.debtRate}%, ${S.site.debtTermYr} yr</td><td class="text-right">${fmt$(D.debt)} (${fmt$(D.debtSvcMo)}/mo)</td></tr></table></div>
      <div class="card p-3 overflow-x-auto"><div class="lbl mb-2">Revenue by vertical ($/yr est.) & unit economics</div><table class="w-full mono num">
        ${Object.entries(D.shares).map(([k,s])=>{const v=VERTICALS[k];
          const palK=SIM.started?(SIM.inv[k]||0):D.basePallets*s;
          const stor=palK*S.loc.storageBench*v.storMult*52, hand=D.baseOrders*s*S.loc.pickBench*v.handMult*365;
          return `<tr class="border-b border-line/40"><td><span class="w-2 h-2 inline-block rounded-sm mr-1" style="background:${v.color}"></span>${v.name} <span class="text-mut">${(s*100).toFixed(0)}%</span></td><td class="text-right">${fmt$(stor+hand)}</td></tr>`}).join('')}
        <tr><td class="text-mut">Blended storage rate</td><td class="text-right">${fmt$(D.storRate)}/pallet/wk</td></tr>
        <tr><td class="text-mut">Blended pick fee</td><td class="text-right">${fmt$(D.pickFee)}/order</td></tr>
        <tr><td class="text-mut">Linehaul in / out</td><td class="text-right">${fmt$(D.linehaulIn)} / ${fmt$(D.linehaulOut)} per pallet</td></tr>
        <tr><td class="text-mut">Insurance</td><td class="text-right">${fmt$(D.insuranceYr)}/yr</td></tr></table></div>
    </div>
    <div class="card p-3 mt-3 overflow-x-auto">
      <div class="lbl mb-2">P&L drill-down by vertical — annualized contribution from live stock pools & rates</div>
      <table class="w-full mono num min-w-[720px]">
        <tr class="lbl"><th class="text-left">Vertical</th><th class="text-right">Pallets</th><th class="text-right">Storage rev</th><th class="text-right">Handling rev</th><th class="text-right">Labor alloc</th><th class="text-right">Energy</th><th class="text-right">Shrink</th><th class="text-right">Insurance</th><th class="text-right">Contribution</th><th class="text-right">CM%</th></tr>
        ${drill.map(d=>`<tr class="border-b border-line/40">
          <td><span class="w-2 h-2 inline-block rounded-sm mr-1" style="background:${d.v.color}"></span>${d.v.name}</td>
          <td class="text-right">${fmtN(Math.round(d.pal))}</td><td class="text-right">${fmt$(d.stor)}</td><td class="text-right">${fmt$(d.hand)}</td>
          <td class="text-right text-mut">−${fmt$(d.labor)}</td><td class="text-right text-mut">−${fmt$(d.energy)}</td>
          <td class="text-right text-mut">−${fmt$(d.shrink)}</td><td class="text-right text-mut">−${fmt$(d.ins)}</td>
          <td class="text-right font-bold ${d.contrib>=0?'text-ok':'text-warn'}">${fmt$(d.contrib)}</td>
          <td class="text-right ${d.cm>=.25?'text-ok':d.cm>=0?'text-amber':'text-warn'}">${(d.cm*100).toFixed(0)}%</td></tr>`).join('')}
        <tr class="font-bold text-amber"><td>Total contribution</td><td></td>
          <td class="text-right">${fmt$(dt.stor)}</td><td class="text-right">${fmt$(dt.hand)}</td>
          <td class="text-right">−${fmt$(dt.labor)}</td><td class="text-right">−${fmt$(dt.energy)}</td>
          <td class="text-right">−${fmt$(dt.shrink)}</td><td class="text-right">−${fmt$(dt.ins)}</td>
          <td class="text-right">${fmt$(dt.contrib)}</td><td></td></tr>
      </table>
      <div class="text-[10px] text-mut mt-1.5">Labor allocated by pick intensity (62% of the roster is pick/pack-facing); insurance by stock value at risk; energy by profile intensity. Facility fixed costs — lease ${fmt$(D.leaseDay*365)}/yr, maintenance, admin — sit below contribution.</div>
    </div>`;
  lineChart(el('chCash'),[{data:cumSeries(),color:'#B37400',fill:true}],{zero:true,fmt:fmt$});
  lineChart(el('chCpo'),[{data:SIM.cpoTrend.filter(x=>x>0),color:'#2F6E9E'}],{sla:D.pickFee,fmt:fmt$});
  const days=SIM.fin.days.slice(-30);
  const lab=days.length?days.reduce((a,d)=>a+d.labor,0)/days.length:D.laborDay;
  const en=days.length?days.reduce((a,d)=>a+d.energy,0)/days.length:(D.refrigKwhDay+D.lightKwhDay)*D.powerTariffEff;
  const oth=days.length?days.reduce((a,d)=>a+d.other,0)/days.length:D.leaseDay+D.maintDay+D.insuranceYr/365+D.adminDay;
  barChart(el('chOpex'),['labor','energy','lease','maint','insur','admin','other'],
    [lab,en,D.leaseDay,D.maintDay,D.insuranceYr/365,D.adminDay,Math.max(0,oth-D.leaseDay-D.maintDay-D.insuranceYr/365-D.adminDay)],
    ['#C58FCC','#B37400','#2F6E9E','#7A8798','#2FA898','#5D6C81','#5E6B7E'],fmt$);
  tornadoChart(el('chTorn'),sens);
}
function cumSeries(){ let c=-D.equity; const out=[c]; SIM.fin.days.forEach(d=>{c+=d.rev-d.opex-D.debtSvcMo/30.4; out.push(c);}); return out; }

    ['Score / verdict',c=>`<b class="${c.kpi.verdict==='GO'?'text-ok':c.kpi.verdict==='CONDITIONAL'?'text-amber':'text-warn'}">${c.kpi.score} ${c.kpi.verdict}</b>`,c=>c.kpi.score,'hi'],
  ];
  function cellCls(row,sc){ // best = green, worst = red — only when 2+ saved and values actually differ
    if(!row[3]||saved.length<2||!sc) return '';
    const vals=saved.map(row[2]); if(Math.max(...vals)===Math.min(...vals)) return '';
    const v=row[2](sc);
    const best = row[3]==='hi'? Math.max(...vals):Math.min(...vals);
    const worst= row[3]==='hi'? Math.min(...vals):Math.max(...vals);
    return v===best?'text-ok font-bold':v===worst?'text-warn':'';
  }
  // config diff: only fields where the saved scenarios disagree
  const cfgRows=[
    ['Location',c=>c.loc.name],['Area',c=>(c.site.areaM2/1000)+'k m²'],['Tenure',c=>c.site.tenure],
    ['Mix',c=>Object.entries(c.mix).filter(([k,v])=>v>0).map(([k,v])=>k+' '+v+'%').join(', ')||'—'],
    ['Sprinkler',c=>c.dd.sprinkler],['Dock doors',c=>String(c.dd.dockDoors+(c.autom.extraDocks||0))],
    ['Automation',c=>[c.autom.agv?c.autom.agv+' AGV':'',c.autom.sortation?'sortation':'',c.autom.conveyor?'conveyor':'',c.autom.solar?'solar':'',c.autom.slotting?'slotting':''].filter(Boolean).join(', ')||'—'],
    ['Debt',c=>c.site.debtLVR+'% @ '+c.site.debtRate+'%'],['SLA',c=>(c.site.slaHours||24)+' h'],
  ];
  const diffs=cfgRows.filter(([l,fn])=> saved.length>=2 && new Set(saved.map(sc=>fn(sc.cfg))).size>1);
  el('stage-scn').innerHTML=`
    <div class="lbl mb-3">Save the current location + configuration into a slot, then compare side-by-side — best per metric in green, worst in red</div>
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-4 max-w-3xl">${[0,1,2].map(i=>{const sc=S.scenarios[i];return `
      <div class="card p-3">
        <div class="lbl mb-1">Slot ${String.fromCharCode(65+i)}</div>
        ${sc?`<div class="text-[12px] font-bold mb-0.5">${esc(sc.name)}</div><div class="lbl normal-case mb-2">saved ${sc.saved}</div>
          <div class="flex gap-1.5"><button class="btn text-[11px] flex-1" onclick="loadScenario(${i})">Load</button>
          <button class="btn btn-amber text-[11px] flex-1" onclick="snapshotScenario(${i})">Overwrite</button></div>`
        :`<div class="text-[11px] text-mut mb-2">empty</div><button class="btn btn-amber text-[11px] w-full" onclick="snapshotScenario(${i})">Save current here</button>`}
      </div>`}).join('')}</div>
    ${saved.length?`<div class="card p-3 overflow-x-auto max-w-4xl mb-3"><table class="w-full mono num min-w-[420px]">
      <tr class="lbl"><th class="text-left">Metric</th>${S.scenarios.map((sc,i)=>`<th class="text-right">${sc?String.fromCharCode(65+i):''}</th>`).join('')}</tr>
      ${rows.map(row=>`<tr class="border-b border-line/40"><td class="text-mut">${row[0]}</td>
        ${S.scenarios.map(sc=>`<td class="text-right ${sc?cellCls(row,sc):''}">${sc?row[1](sc):'—'}</td>`).join('')}</tr>`).join('')}</table></div>`:''}
    ${diffs.length?`<div class="card p-3 overflow-x-auto max-w-4xl border-l-4 border-l-amber">
      <div class="lbl mb-2">Configuration differences — what actually varies between these scenarios</div>
      <table class="w-full mono min-w-[420px]"><tr class="lbl"><th class="text-left">Setting</th>${S.scenarios.map((sc,i)=>`<th class="text-left">${sc?String.fromCharCode(65+i):''}</th>`).join('')}</tr>
      ${diffs.map(([l,fn])=>{ const vals=S.scenarios.map(sc=>sc?fn(sc.cfg):null);
        const counts={}; vals.filter(v=>v!==null).forEach(v=>counts[v]=(counts[v]||0)+1);
        return `<tr class="border-b border-line/40"><td class="text-mut">${l}</td>
        ${vals.map(v=>`<td class="${v!==null&&counts[v]===1?'text-amber':''}">${v===null?'—':esc(v)}</td>`).join('')}</tr>`;}).join('')}</table></div>`
    : saved.length>=2?`<div class="text-[11px] text-mut max-w-4xl">Configurations are identical — differences will highlight here in amber once scenarios diverge.</div>`:''}`;
}

/* ═══════════════════════════════════════════════════════════════════
   §15 MERIDIAN — living department agents
   Nine department agents + hub orchestrator, embodied in the world.
   They act autonomously, narrate to a group channel, escalate to each
   other, and take direction when the human tags them.

   Determinism: agents read SIM/D and act through the same setters the
   human uses. They never write physics directly.
   Offline-first: every agent line is a deterministic heuristic. The
   LLM path only rephrases; it can never change a number or an action.
   ═══════════════════════════════════════════════════════════════════ */

const MER = {
  on: !/[?&]noagents=1/.test(location.search), chat:[], unread:0, lastEval:0, seq:0,
  pending:{},            // handle -> proposal awaiting human approval

  actors:[], booted:false,
  autoApproveCapex:0,    // human can raise this via @hub budget N
};

/* observation snapshot — read-only view the agents reason over */
function merCtx(){
  const cap=Math.max(1,D.palletCap||1);
  const occ=clamp((SIM.pallets||0)/cap,0,1);
  const sla=SIM.slaTrend&&SIM.slaTrend.length?SIM.slaTrend[SIM.slaTrend.length-1]:1;
  const rr=(typeof runRate==='function')?runRate():{revDay:0,opexDay:0};
  return {
    day:SIM.day, month:SIM.month, backlog:SIM.backlog||0, occ,
    otif:clamp(sla,0,1), cpo:lastCpo()||0, fee:D.pickFee||1,
    dockSat:dockSat()||0, docks:D.dockCount||1,
    heads:(S.staff&&S.staff.picking)||0,
    absent:SIM.absentToday||0, outage:!!SIM.outage,
    rain:!!(SIM.weather&&SIM.weather.rain), heat:!!(SIM.weather&&SIM.weather.heat),
    breakdowns:SIM.breakdowns||0,
    revDay:rr.revDay||0, opexDay:rr.opexDay||0,
    dscr: D.debtSvcMo>0 ? ((rr.revDay-rr.opexDay)*365)/(D.debtSvcMo*12) : Infinity,
  };
}

function merZoneXY(zone){
  const map={pick:'picking',pack:'packing',dock:'receiving',rack:null,forklift:'putaway',admin:'admin'};
  const zid=map[zone];
  if(zid && typeof zoneAnchor==='function'){ const a=zoneAnchor(zid); if(a) return a; }
  if(zone==='rack' && typeof rackAnchor==='function') return rackAnchor();
  return {x:(WORLD.W||34)/2, y:(WORLD.H||22)/2};
}
function merBoot(){
  MER.actors = MER_AGENTS.map((a,i)=>{
    const p=merZoneXY(a.zone);
    return { a, x:p.x+(i%3)*0.8, y:p.y+Math.floor(i/3)*0.6, hx:p.x, hy:p.y,
             ph:Math.random()*6, bubble:null, busy:0 };
  });
  MER.booted=true;
}

/* ── chat channel ────────────────────────────────────────────── */
function merPost(handle, text, kind, sev){
  const a = merBy(handle);
  const m = { id:++MER.seq, h:handle, name:a?a.name:handle,
    color:a?a.color:'#5D6C81', text, kind:kind||'say', sev:sev||'info',
    day:SIM.day, hr:Math.floor(hourOf()) };
  MER.chat.push(m);
  MER.stats[kind||'say'] = (MER.stats[kind||'say']||0)+1;
  // Ring-buffer the DOM too. Previously only the array was trimmed, so once
  // 200 messages had accrued childElementCount never fell back below
  // chat.length and the channel silently stopped rendering new lines.
  while(MER.chat.length>200){
    const old=MER.chat.shift();
    if(old && old._row && old._row.parentNode) old._row.parentNode.removeChild(old._row);
  }
  if(S.tab!=='comms'){ MER.unread++; }
  merRenderChat();
  const ac = MER.actors.find(x=>x.a.h===handle);
  if(ac && kind!=='human'){ ac.bubble={ text:text.length>64?text.slice(0,61)+'…':text, until:SIM.t+90 }; }
  return m;
}

/* Rewrite a message in place. This is the ONLY way the LLM ever touches the
   channel: the deterministic line is posted first and stands on its own, then
   the model's voicing replaces the words. No number, action or state changes. */
function merPatch(m, text, opt){
  if(!m) return;
  m.text=text; if(opt && opt.ai) m.ai=true;
  if(m._tx){ m._tx.textContent=text; m._tx.classList.remove('llm-think'); }
  if(m.ai && m._who && !m._aiChip){
    const b=document.createElement('span'); b.className='mer-tag mer-ai'; b.textContent='AI';
    m._who.appendChild(b); m._aiChip=b;
  }
  const ac=MER.actors.find(x=>x.a.h===m.h);
  if(ac && m.kind!=='human'){ ac.bubble={ text:text.length>64?text.slice(0,61)+'…':text, until:SIM.t+90 }; }
  const box=el('merChatLog'); if(box) box.scrollTop=box.scrollHeight;
}

/* A model may SUGGEST a command. It can never run one — the chip only loads
   the operator's input box, and the deterministic parser still owns execution. */
function merSuggest(m, cmd){
  if(!m || !m._row) return;
  const wrap=document.createElement('div');
  const s=document.createElement('span'); s.className='llm-sug'; s.textContent='▶ '+cmd;
  s.onclick=()=>{ const i=el('merInput'); if(i){ i.value=cmd; i.focus(); } };
  wrap.appendChild(s); m._row.appendChild(wrap);
  const box=el('merChatLog'); if(box) box.scrollTop=box.scrollHeight;
}

/* ── autonomous daily cycle ──────────────────────────────────── */
const merLast = {};
function merDay(){
  if(!MER.on || !SIM.started) return;
  if(!MER.booted) merBoot();
  const c = merCtx();

  for(const a of MER_AGENTS){
    if(a.h==='hub') continue;
    if(merLast[a.h]!==undefined && SIM.day-merLast[a.h] < a.cd) continue;

    const f = a.check(c);
    if(!f) continue;
    merLast[a.h]=SIM.day;
    merVoice(a.h, f.say, 'say', f.sev, c);

    // autonomous operational move
    if(a.act){ const did=a.act(c); if(did) merPost(a.h, `Actioned — ${did}.`, 'act', 'info'); }

    // capex needs a human, unless a budget was delegated
    if(a.propose){
      const p=a.propose(c);
      if(p && !MER.pending[a.h]){
        if(p.capex<=MER.autoApproveCapex){
          p.apply(); merPost(a.h, `Executed under delegated budget — ${p.what}, ${fmt$(p.capex)}.`, 'act', 'info');
        } else {
          MER.pending[a.h]=p;
          merPost(a.h, `Proposal: ${p.what} — ${fmt$(p.capex)} capex. Needs your call. Reply "@${a.h} yes" or "@${a.h} no".`, 'ask', 'warn');
        }
      }
    }

    // Escalation — one hop. It carries its OWN cooldown: gating it on the
    // target's spontaneous cooldown starves the hop entirely, because a
    // chatty target keeps firing on its own a beat earlier every cycle.
    if(a.esc){
      const t=merBy(a.esc);
      const key='esc:'+a.h+'>'+t.h;
      if(t && (merLast[key]===undefined || SIM.day-merLast[key]>=t.cd)){
        const tf=t.check(c);
        if(tf){ merLast[key]=SIM.day;
          merVoice(t.h, `↳ picking this up from @${a.h} — ${tf.say}`, 'esc', tf.sev, c); }
      }
    }
  }
}

/* ── human commands ──────────────────────────────────────────── */
function merCommand(raw){
  const text=raw.trim(); if(!text) return;
  merPost('you', text, 'human', 'info');
  const m=text.match(/^@(\w+)\s*(.*)$/);
  if(!m){ merPost('hub', 'Tag an agent to direct them — try "@ops status" or "@hub status".', 'say', 'info'); return; }
  const h=m[1].toLowerCase(), rest=(m[2]||'').trim().toLowerCase();
  const c=merCtx();

  if(h==='all'||h==='hub'){
    if(rest.startsWith('llm')){
      if(/\b(on|live|enable)\b/.test(rest)){
        if(!llmReady('voice')){ merPost('hub','No usable model configured. Open the ⚙ panel above the input and set a provider, key and model.','say','warn'); return; }
        LLM.on=true; LLM.fails=0; llmSave(); llmStatus();
        const c2=el('llmOn'); if(c2) c2.checked=true;
        const sv=llmSlot('voice');
        merPost('hub','Live model on — '+(LLM_PROV[sv.provider]||{}).label+' · '+(sv.model||'default')
          +'. My team now speaks in their own words. Every number still comes from the sim.','act','info');
      } else if(/\b(off|stop|disable)\b/.test(rest)){
        LLM.on=false; llmSave(); llmStatus();
        const c3=el('llmOn'); if(c3) c3.checked=false;
        merPost('hub','Live model off. Back to deterministic narration.','act','info');
      } else {
        const sv=llmSlot('voice'), sa=llmSlot('analyst');
        merPost('hub','Model bridge '+(LLM.on?'LIVE':'OFF')+'. Voice: '+(LLM_PROV[sv.provider]||{}).label+' · '
          +(sv.model||'default')+'. Analyst: '+(LLM_PROV[sa.provider]||{}).label+' · '+(sa.model||'default')
          +'. '+LLM.meter.calls+' calls, est $'+LLM.meter.cost.toFixed(4)+'.'
          +(LLM.meter.lastErr?(' Last error: '+LLM.meter.lastErr):''),'say','info');
      }
      return;
    }
    if(rest.startsWith('brief')){
      if(LLM.on && llmReady('analyst')){ llmBrief(c).catch(()=>{}); }
      else {
        const worst=MER_AGENTS.filter(a=>a.h!=='hub').map(a=>({a,f:a.check(c)})).filter(x=>x.f);
        merPost('hub', worst.length
          ? worst.length+' department'+(worst.length>1?'s':'')+' flagging: '+worst.map(x=>'@'+x.a.h).join(', ')
            +'. Binding constraint first — '+worst[0].f.say
          : 'Every department is inside tolerance. Backlog '+Math.round(c.backlog)+', OTIF '
            +(c.otif*100).toFixed(1)+'%, DSCR '+(isFinite(c.dscr)?c.dscr.toFixed(2):'n/a')+'.','say','info');
      }
      return;
    }
    if(rest.startsWith('budget')){
      const n=parseFloat(rest.replace(/[^\d.]/g,''))||0;
      MER.autoApproveCapex=n;
      merPost('hub', `Delegated budget set to ${fmt$(n)}. Proposals under that execute without asking.`, 'act', 'info');
      return;
    }
    merPost('hub', `Day ${c.day}. Backlog ${Math.round(c.backlog)}, OTIF ${(c.otif*100).toFixed(1)}%, occupancy ${(c.occ*100).toFixed(0)}%, CPO ${fmt$(c.cpo)}, DSCR ${isFinite(c.dscr)?c.dscr.toFixed(2):'n/a'}.`, 'say', 'info');
    if(h==='all'){ for(const a of MER_AGENTS){ if(a.h==='hub') continue; const f=a.check(c);
      merPost(a.h, f? f.say : 'Nothing from me — my numbers are inside tolerance.', 'say', f?f.sev:'info'); } }
    return;
  }

  const a=merBy(h);
  if(!a){ merPost('hub', `No agent on that handle. Roster: ${MER_AGENTS.map(x=>'@'+x.h).join(' ')}.`, 'say', 'info'); return; }

  // approval flow
  if(MER.pending[h] && /^(yes|y|approve|do it|go|ok)$/.test(rest)){
    const p=MER.pending[h]; delete MER.pending[h]; p.apply();
    merPost(h, `Approved — ${p.what} committed, ${fmt$(p.capex)} capex booked.`, 'act', 'info'); return;
  }
  if(MER.pending[h] && /^(no|n|deny|reject|hold)$/.test(rest)){
    const p=MER.pending[h]; delete MER.pending[h];
    merPost(h, `Understood, holding on ${p.what}. I'll re-raise it if the numbers get worse.`, 'say', 'info'); return;
  }

  if(rest.startsWith('hire')||rest.startsWith('add')){
    const n=parseInt(rest.replace(/[^\d]/g,''))||1;
    S.staff.picking=Math.min(80,(S.staff.picking||0)+n); uiChanged();
    merPost(h, `Done — ${n} added to the pick roster. Now ${S.staff.picking}.`, 'act', 'info'); return;
  }
  if(rest.startsWith('cut')||rest.startsWith('drop')){
    const n=parseInt(rest.replace(/[^\d]/g,''))||1;
    S.staff.picking=Math.max(1,(S.staff.picking||0)-n); uiChanged();
    merPost(h, `Done — ${n} off the roster. Now ${S.staff.picking}.`, 'act', 'info'); return;
  }
  // Bare keywords stay deterministic and free. Anything with a real sentence
  // after them ("why are we bleeding money") is a question, not a command --
  // matching on startsWith swallowed those into the canned reply.
  const showStatus=()=>{ const f=a.check(c);
    merVoice(h, f? f.say : 'All quiet on my side — nothing outside tolerance right now.', 'say', f?f.sev:'info', c); };
  if(rest===''||rest==='status'||rest==='status?'){ showStatus(); return; }
  if(rest==='why'||rest==='why?'){ merVoice(h, merWhy(a,c), 'say', 'info', c); return; }
  // Everything else goes to the model, if one is wired up.
  if(LLM.on && LLM.freeform && llmReady('voice')){
    llmAnswer(h, rest.replace(/^ask\s+/,''), c).catch(()=>{}); return;
  }
  // Offline, fall back to the nearest canned answer rather than a help line.
  if(rest.startsWith('status')){ showStatus(); return; }
  if(rest.startsWith('why')){ merVoice(h, merWhy(a,c), 'say', 'info', c); return; }
  merPost(h, `I understand: status · why · hire N · cut N · yes · no. Try "@${h} status". `
    + `(Wire a real model in the ⚙ panel and I can answer anything.)`, 'say', 'info');
}

function merWhy(a,c){
  switch(a.h){
    case 'ops': return `Backlog is ${Math.round(c.backlog)} because demand is outrunning the pick face. Capacity scales with pickers, not docks.`;
    case 'cust': return `OTIF is ${(c.otif*100).toFixed(1)}% — every line that misses the cut-off is a call I have to take.`;
    case 'transport': return `Dock saturation ${(c.dockSat*100).toFixed(0)}% on ${c.docks} doors. Above ~90% the yard queues and detention starts.`;
    case 'finance': return `DSCR is EBITDA over debt service. Day margin ${fmt$(c.revDay-c.opexDay)} against ${fmt$(D.debtSvcMo/30.4)} of daily service.`;
    case 'perf': return `CPO ${fmt$(c.cpo)} versus ${fmt$(c.fee)} billed. Labour per line is the driver; travel distance rises with occupancy.`;
    case 'gov': return `Occupancy ${(c.occ*100).toFixed(0)}%. Past ~92% the aisles narrow enough to matter for egress and DG separation.`;
    case 'legal': return `Standard 3PL contracts cure at 93% OTIF. Below it, sustained, the counterparty gets rights they don't currently have.`;
    case 'workforce': return `${c.absent} absent today against roster. Absence over ~8% forces overtime loading.`;
    case 'oem': return `${c.breakdowns} breakdowns logged. Availability drives effective pick rate more than nominal fleet size.`;
    default: return 'Ask me for status.';
  }
}

/* ── chat DOM — built once, appended to. No innerHTML in the loop. ── */
function merRenderChat(){
  const box=el('merChatLog'); if(!box) return;
  for(const m of MER.chat){
    if(m._row) continue;
    const row=document.createElement('div');
    row.className='mer-row'+(m.kind==='human'?' mer-human':'');
    const who=document.createElement('div'); who.className='mer-who';
    const dot=document.createElement('span'); dot.className='mer-dot';
    dot.style.background=m.kind==='human'?'#1C2634':m.color;
    const nm=document.createElement('span'); nm.textContent=m.kind==='human'?'YOU':m.name.toUpperCase();
    const tm=document.createElement('span'); tm.className='mer-time';
    tm.textContent='d'+m.day+' '+String(m.hr).padStart(2,'0')+':00';
    who.appendChild(dot); who.appendChild(nm); who.appendChild(tm);
    if(m.kind==='act'){ const b=document.createElement('span'); b.className='mer-tag mer-act'; b.textContent='ACTIONED'; who.appendChild(b); }
    if(m.kind==='ask'){ const b=document.createElement('span'); b.className='mer-tag mer-ask'; b.textContent='NEEDS YOU'; who.appendChild(b); }
    if(m.kind==='esc'){ const b=document.createElement('span'); b.className='mer-tag mer-esc'; b.textContent='ESCALATED'; who.appendChild(b); }
    if(m.ai){ const b=document.createElement('span'); b.className='mer-tag mer-ai'; b.textContent='AI'; who.appendChild(b); m._aiChip=b; }
    const tx=document.createElement('div'); tx.className='mer-text mer-'+m.sev; tx.textContent=m.text;
    row.appendChild(who); row.appendChild(tx);
    box.appendChild(row);
    m._row=row; m._who=who; m._tx=tx;
    box.scrollTop=box.scrollHeight;
  }
  const b=el('merBadge');
  if(b){ b.textContent=MER.unread; b.classList.toggle('hidden', MER.unread===0); }
  const d=el('merDockLog');
  if(d){ while(d.childElementCount<Math.min(MER.chat.length,60)){ d.appendChild(document.createElement('div')); } 
    const recent=MER.chat.slice(-6);
    for(let i=0;i<d.childElementCount;i++){
      const m=recent[i]; const n=d.children[i];
      if(!m){ n.textContent=''; continue; }
      n.textContent=(m.kind==='human'?'YOU':m.name)+': '+m.text;
      n.style.color=m.kind==='human'?'#1C2634':m.color;
      n.className='truncate';
    }
  }
}

/* ── avatars + speech bubbles in the isometric world ───────────── */
function merDrawAgents(ctx,nite){
  if(!MER.booted || !MER.on) return;
  for(const ac of MER.actors){
    // gentle idle drift around their zone anchor
    ac.ph+=0.004;
    ac.x=ac.hx+Math.cos(ac.ph)*0.7; ac.y=ac.hy+Math.sin(ac.ph*0.8)*0.5;
    const x=isoX(ac.x,ac.y), y=isoY(ac.x,ac.y);
    const c=ac.a.color;
    // body — taller than a worker, coloured coat
    ctx.fillStyle=shade(c,1-nite*0.25); ctx.fillRect(x-2.6,y-13,5.2,10);
    ctx.fillStyle='#e8c9a0'; ctx.beginPath(); ctx.arc(x,y-15.4,2.6,0,7); ctx.fill();
    // headset ring marks them as an agent, not a worker
    ctx.strokeStyle=shade(c,1.15); ctx.lineWidth=1.1;
    ctx.beginPath(); ctx.arc(x,y-15.4,4.1,Math.PI*1.05,Math.PI*1.95); ctx.stroke();
    // handle label
    ctx.fillStyle=nite>0.5?'#F4F6FA':'#1C2634';
    ctx.font='700 8px ui-monospace,monospace'; ctx.textAlign='center';
    ctx.fillText('@'+ac.a.h, x, y+7);
    // speech bubble
    if(ac.bubble && SIM.t<ac.bubble.until){
      const t=ac.bubble.text; ctx.font='9px Inter,system-ui,sans-serif';
      const w=Math.min(210, ctx.measureText(t).width+14);
      const bx=x-w/2, by=y-40;
      ctx.fillStyle='rgba(255,255,255,.96)'; ctx.strokeStyle=c; ctx.lineWidth=1.4;
      if(ctx.roundRect){ ctx.beginPath(); ctx.roundRect(bx,by,w,19,5); ctx.fill(); ctx.stroke(); }
      else { ctx.fillRect(bx,by,w,19); ctx.strokeRect(bx,by,w,19); }
      ctx.beginPath(); ctx.moveTo(x-4,by+19); ctx.lineTo(x,by+25); ctx.lineTo(x+4,by+19);
      ctx.fillStyle='rgba(255,255,255,.96)'; ctx.fill();
      ctx.fillStyle='#1C2634'; ctx.textAlign='center';
      ctx.fillText(t, x, by+13);
    } else if(ac.bubble){ ac.bubble=null; }
  }
  ctx.textAlign='left';
}



/* ═══════════════════════════════════════════════════════════════════
   §17 MERIDIAN ACCOUNT — hosted inference, credit ledger, export gate
   ───────────────────────────────────────────────────────────────────
   Turns a giveaway into a metered product without moving a single
   number out of the deterministic sim.

   THREE MODES, and the file must work in all of them:
     offline   no base URL      → exactly today. BYO keys, free tier,
                                  watermarked export. Nothing to sign in to.
     free      base URL, no key → hosted trial credits, watermarked export.
     licensed  base + licence   → clean export, larger balance, deep Scout.

   AUTHORITY. The server owns the balance. MTR.credits is a cached
   display value refreshed from whatever the server last said; the
   client never decides that a debit succeeded. A tampered client can
   at worst show itself a wrong number.

   FAILURE. Every call here is awaited only from operator-initiated
   paths, never from tick() or frame(). A dead server degrades to the
   free tier — it can never stall the simulation.
   ═══════════════════════════════════════════════════════════════════ */

const MTR = {
  base:'',            // Meridian API origin. Empty = offline mode.
  token:'',           // opaque session token, issued by the server
  email:'',
  plan:'free',        // free | studio | firm
  credits:0,          // cached; server-authoritative
  entitle:{ export:false, deepScout:false, hosted:false },
  online:false, lastErr:'', remember:false,
  /* display-only price list. The server sends the real one on hello and
     overwrites this; these are the fallbacks so the UI is never blank. */
  price:{ voice:1, analyst:4, deepScout:25, export:40 }
};

const MTR_STORE='wt.mtr.v1';
function mtrSave(){
  try{
    if(!MTR.remember){ localStorage.removeItem(MTR_STORE); return; }
    localStorage.setItem(MTR_STORE, JSON.stringify({
      base:MTR.base, token:MTR.token, email:MTR.email, remember:true }));
  }catch(e){}
}
function mtrLoad(){
  try{
    const raw=localStorage.getItem(MTR_STORE); if(!raw) return;
    const o=JSON.parse(raw)||{};
    MTR.remember=true;
    if(typeof o.base==='string')  MTR.base=o.base;
    if(typeof o.token==='string') MTR.token=o.token;
    if(typeof o.email==='string') MTR.email=o.email;
  }catch(e){}
}
mtrLoad();

function mtrOn(){ return !!(MTR.base && MTR.token); }
function mtrCan(k){ return !!(MTR.entitle && MTR.entitle[k]); }

/* Single fetch helper. Times out, never throws past the caller, and
   folds any {credits,plan,entitle,price} envelope back into MTR so the
   balance stays fresh on every round trip. */
async function mtrFetch(path, opts){
  opts=opts||{};
  if(!MTR.base) throw new Error('no Meridian server configured');
  const ctl=new AbortController();
  const timer=setTimeout(()=>{ try{ctl.abort();}catch(e){} }, opts.timeout||15000);
  try{
    const headers={'Content-Type':'application/json'};
    if(MTR.token) headers['Authorization']='Bearer '+MTR.token;
    const r=await fetch(MTR.base.replace(/\/+$/,'')+path, {
      method:opts.method||'POST', headers:headers,
      body:opts.body?JSON.stringify(opts.body):undefined, signal:ctl.signal });
    const j=await r.json().catch(()=>({}));
    if(!r.ok){
      const m=(j&&(j.error||j.message))||('HTTP '+r.status);
      if(r.status===401||r.status===403){ MTR.token=''; MTR.online=false; mtrSave(); }
      throw new Error(m);
    }
    if(typeof j.credits==='number') MTR.credits=j.credits;
    if(typeof j.plan==='string')    MTR.plan=j.plan;
    if(j.entitle && typeof j.entitle==='object') MTR.entitle=j.entitle;
    if(j.price   && typeof j.price==='object')   MTR.price=Object.assign(MTR.price,j.price);
    MTR.lastErr='';
    return j;
  }catch(e){
    let m=String((e&&e.message)||e);
    if(e&&e.name==='AbortError') m='timed out';
    else if(/Failed to fetch|NetworkError|Load failed/i.test(m)) m='server unreachable';
    MTR.lastErr=m.slice(0,180);
    throw e;
  }finally{ clearTimeout(timer); mtrChip(); }
}

/* hello — resolve who we are. Anonymous if no token: the server mints a
   trial session so a first-time visitor gets working hosted inference
   without an email box in the way. */
async function mtrHello(){
  if(!MTR.base) { MTR.online=false; mtrChip(); return null; }
  try{
    const j=await mtrFetch('/v1/session', { body:{ token:MTR.token||null } });
    if(j.token){ MTR.token=j.token; mtrSave(); }
    if(j.email) MTR.email=j.email;
    MTR.online=true; mtrChip(); mtrRenderAccount();
    return j;
  }catch(e){ MTR.online=false; mtrChip(); mtrRenderAccount(); return null; }
}

async function mtrRedeem(code){
  const j=await mtrFetch('/v1/licence/redeem', { body:{ code:String(code||'').trim() } });
  if(j.token){ MTR.token=j.token; mtrSave(); }
  MTR.online=true; mtrChip(); mtrRenderAccount();
  return j;
}
async function mtrRefresh(){ try{ await mtrHello(); }catch(e){} }

/* ── status chip ─────────────────────────────────────────────────── */
function mtrChip(){
  const e=el('mtrChip'); if(!e) return;
  if(!MTR.base){ e.className='mtr-chip'; e.textContent='LOCAL'; e.title='No Meridian server — BYO keys, watermarked export'; return; }
  if(!MTR.online){ e.className='mtr-chip mtr-err'; e.textContent='OFFLINE'; e.title=MTR.lastErr||'server unreachable'; return; }
  const lic=mtrCan('export');
  e.className='mtr-chip '+(lic?'mtr-lic':'mtr-free');
  e.textContent=(lic?MTR.plan.toUpperCase():'FREE')+' · '+fmtN(Math.max(0,Math.round(MTR.credits)))+' cr';
  e.title=(MTR.email||'anonymous session')+' — click for account';
}

/* ═══ export gate ════════════════════════════════════════════════════
   The IC paper is the deliverable, so it is the one thing that is
   actually gated. Free still prints — a watermarked paper is a sample,
   a blocked paper is a bounce. Licensed spends a credit, gets a
   reference number, and prints clean. */
let MTR_LASTREF='';
async function wtExport(){
  const btn=el('repExport');
  const clean = ()=>{
    document.querySelectorAll('.wt-wm').forEach(n=>n.remove());
    document.querySelectorAll('.wt-unl').forEach(n=>n.remove());
  };
  clean();
  let licensed=false, ref='';

  if(mtrOn() && mtrCan('export')){
    if(btn){ btn.disabled=true; btn.textContent='⎙ minting…'; }
    try{
      const j=await mtrFetch('/v1/entitlement/export', { body:{
        site:S.loc.name, area:S.site.areaM2, tenure:S.site.tenure,
        score:confidenceScore().score, verdict:confidenceScore().verdict }});
      licensed=!!j.ok; ref=j.ref||'';
      MTR_LASTREF=ref;

/* ═══════════════════════════════════════════════════════════════════
   §16 LLM BRIDGE — real models, bolted on without touching physics
   ───────────────────────────────────────────────────────────────────
   Three providers out of the box (Anthropic, DeepSeek, OpenRouter) plus
   any OpenAI-compatible endpoint. Two slots:
     voice   — agent chatter and replies. Cheap, fast, high frequency.
     analyst — Scout site profiling and the hub brief. Strong, rare.

   INVARIANT. The model is a mouth, never a brain:
     · every agent line is COMPUTED first and posted immediately;
     · the model only rewrites the wording, in place, afterwards;
     · a numeric guard rejects any rewrite that introduces a figure
       absent from the deterministic source line;
     · a model may SUGGEST a command, never execute one.
   So the sim stays deterministic and identical with the network pulled.

   FAILURE. Every call is fire-and-forget with a timeout. A throw can
   never reach the tick, the frame loop, or the render. Three straight
   failures auto-disable the bridge and say so in the channel.
   ═══════════════════════════════════════════════════════════════════ */

const LLM_PROV = {
  meridian:{
    label:'Meridian — hosted, no key', kind:'meridian',
    url:'', models:['auto','fast','deep'],
    keyHint:'signed in', price:{in:0,out:0},
    note:'Inference runs on the Meridian server against your credit balance — no key ever '
        +'touches this page, and DeepSeek/Claude/Gemini CORS limits stop applying because the '
        +'browser only ever talks to Meridian. Choose fast for agent chatter, deep for Scout '
        +'and the hub brief, or auto to let the server route by slot. Requires an account; '
        +'everything else on this page works without one.'
  },
  openrouter:{
    label:'OpenRouter', kind:'openai',
    url:'https://openrouter.ai/api/v1/chat/completions',
    models:['deepseek/deepseek-chat','anthropic/claude-sonnet-4.5','google/gemini-2.0-flash-001',
            'meta-llama/llama-3.3-70b-instruct','deepseek/deepseek-r1'],
    keyHint:'sk-or-v1-…', price:{in:0.30,out:1.20},
    note:'Browser-friendly by design — the safest default here. One key reaches DeepSeek, Claude, Gemini and Llama, so you can A/B voices without re-keying. Model ids carry a vendor prefix.'
  },
  claude:{
    label:'Anthropic — Claude', kind:'anthropic',
    url:'https://api.anthropic.com/v1/messages',
    models:['claude-sonnet-4-6','claude-opus-4-1','claude-haiku-4-5'],
    keyHint:'sk-ant-api03-…', price:{in:3,out:15},
    note:'Leave the key blank inside the Claude.ai artifact sandbox — it is injected for you, and web search works for Scout. Outside the sandbox paste a key: the call adds anthropic-dangerous-direct-browser-access, which Anthropic requires for direct browser use. Best analyst slot.'
  },
  deepseek:{
    label:'DeepSeek', kind:'openai',
    url:'https://api.deepseek.com/chat/completions',
    models:['deepseek-chat','deepseek-reasoner'],
    keyHint:'sk-…', price:{in:0.28,out:1.10},
    note:'Cheapest voice by a wide margin. DeepSeek does not publish browser CORS headers, so a direct call from a file:// page may be blocked — if the test returns a network error, run the same model through OpenRouter instead.'
  },
  custom:{
    label:'Custom — OpenAI-compatible', kind:'openai',
    url:'', models:[], keyHint:'optional', price:{in:0,out:0},
    note:'Anything that speaks POST /chat/completions: LM Studio, Ollama, vLLM, or your own Meridian proxy. Paste the full endpoint URL. A local endpoint keeps keys off the page entirely.'
  }
};

const LLM = {
  on:false, rewrite:true, freeform:true, remember:false,
  maxPerDay:6, dayCalls:0, dayMark:-1, inflight:0, maxInflight:2, fails:0,
  slot:{
    voice:  { provider:'openrouter', model:'', key:'', url:'' },
    analyst:{ provider:'claude',     model:'', key:'', url:'', same:true }
  },
  meter:{ calls:0, tin:0, tout:0, cost:0, rejects:0, last:'', lastErr:'' }
};

/* ── optional, opt-in persistence. Off by default: the file stays a
      self-contained artefact you can hand to anyone. localStorage can
      throw outright on file:// in some browsers, hence the guards. ── */
const LLM_STORE='wt.llm.v1';
function llmSave(){
  try{
    if(!LLM.remember){ localStorage.removeItem(LLM_STORE); return; }
    localStorage.setItem(LLM_STORE, JSON.stringify({
      on:LLM.on, rewrite:LLM.rewrite, freeform:LLM.freeform,
      maxPerDay:LLM.maxPerDay, slot:LLM.slot, remember:true,
      gmapKey:GMAP.key, scoutDeep:SC_DEEP }));
  }catch(e){}
}
function llmLoad(){
  try{
    const raw=localStorage.getItem(LLM_STORE); if(!raw) return;
    const o=JSON.parse(raw); if(!o) return;
    LLM.remember=true;
    if(o.slot){ for(const k of ['voice','analyst']) if(o.slot[k]) Object.assign(LLM.slot[k], o.slot[k]); }
    if(typeof o.rewrite==='boolean') LLM.rewrite=o.rewrite;
    if(typeof o.freeform==='boolean') LLM.freeform=o.freeform;
    if(typeof o.maxPerDay==='number') LLM.maxPerDay=o.maxPerDay;
    if(typeof o.on==='boolean') LLM.on=o.on;
    if(typeof o.gmapKey==='string') GMAP.key=o.gmapKey;
    if(typeof o.scoutDeep==='boolean') SC_DEEP=o.scoutDeep;
  }catch(e){}
}
llmLoad();

function llmSlot(name){
  if(name==='analyst' && LLM.slot.analyst.same) return LLM.slot.voice;
  return LLM.slot[name] || LLM.slot.voice;
}
function llmReady(name){
  const s=llmSlot(name||'voice'), P=LLM_PROV[s.provider];
  if(!P) return false;
  if(P.kind==='meridian') return mtrOn() && MTR.online;
  if(P.kind==='anthropic') return true;            // keyless sandbox path is valid
  if(s.provider==='custom') return !!(s.url||P.url);
  return !!s.key;
}
/* Autonomous rephrasing is rate-limited per SIM day. Operator-initiated
   calls (@ask, @hub brief, Test) are never blocked by that budget. */
function llmBudget(){
  if(SIM.day!==LLM.dayMark){ LLM.dayMark=SIM.day; LLM.dayCalls=0; }
  return LLM.on && LLM.dayCalls<LLM.maxPerDay && LLM.inflight<LLM.maxInflight;
}

async function llmCall(slotName, prompt, o){
  o=o||{};
  const s=llmSlot(slotName), P=LLM_PROV[s.provider];
  if(!P) throw new Error('no provider selected');

  /* hosted path — the browser never sees a vendor key or a vendor URL */
  if(P.kind==='meridian'){
    if(!mtrOn()) throw new Error('not signed in to Meridian');
    LLM.inflight++; if(o.auto) LLM.dayCalls++;
    try{
      const j=await mtrFetch('/v1/llm', { timeout:o.timeout||20000, body:{
        slot:(slotName||'voice'), tier:(s.model||'auto'),
        prompt:prompt, system:o.system||null,
        max:o.max||400, temp:(o.temp==null?0.6:o.temp), web:!!o.web }});
      const u=j.usage||{};
      LLM.meter.calls++; LLM.meter.tin+=(u.in||0); LLM.meter.tout+=(u.out||0);
      LLM.meter.cost += (j.charged||0);          // charged in credits, not dollars
      LLM.meter.last=j.model||('meridian/'+(s.model||'auto'));
      LLM.meter.lastErr=''; LLM.fails=0;
      llmStatus(); mtrRenderAccount();
      return String(j.text||'').trim();
    }catch(e){
      LLM.fails++;
      LLM.meter.lastErr=String((e&&e.message)||e).slice(0,200);
      if(/insufficient|balance|credit/i.test(LLM.meter.lastErr)){
        merSafeToast('Out of credits — agents are back on deterministic narration. '
          +'Top up in ⚙ MODEL to re-voice them.');
        LLM.on=false; try{ const c=el('llmOn'); if(c) c.checked=false; }catch(_){}
      }else if(LLM.fails>=3 && LLM.on){
        LLM.on=false; llmSave();
        merSafeToast('Live model switched off after three consecutive failures — '
          +LLM.meter.lastErr+'. Nothing in the sim changed.');
        try{ const c=el('llmOn'); if(c) c.checked=false; }catch(_){}
      }
      llmStatus(); throw e;
    }finally{ LLM.inflight--; }
  }

  const url=(s.url||P.url); if(!url) throw new Error('no endpoint URL set');
  const model=(s.model||P.models[0]||''); if(!model) throw new Error('no model name set');
  const ctl=new AbortController();
  const timer=setTimeout(()=>{ try{ctl.abort();}catch(e){} }, o.timeout||14000);
  LLM.inflight++; if(o.auto) LLM.dayCalls++;
  try{
    const headers={'Content-Type':'application/json'};
    let body;
    if(P.kind==='anthropic'){
      if(s.key){
        headers['x-api-key']=s.key;
        headers['anthropic-version']='2023-06-01';
        headers['anthropic-dangerous-direct-browser-access']='true';
      }
      body={ model:model, max_tokens:o.max||400, messages:[{role:'user',content:prompt}] };
      if(o.system) body.system=o.system;
      if(o.temp!=null) body.temperature=o.temp;
      if(o.web) body.tools=[{type:'web_search_20250305',name:'web_search'}];
    }else{
      if(s.key) headers['Authorization']='Bearer '+s.key;
      if(s.provider==='openrouter') headers['X-Title']='Warehouse Tycoon';
      const msgs=[];
      if(o.system) msgs.push({role:'system',content:o.system});
      msgs.push({role:'user',content:prompt});
      body={ model:model, max_tokens:o.max||400, messages:msgs,
             temperature:(o.temp==null?0.6:o.temp) };
    }
    const r=await fetch(url,{method:'POST',headers:headers,body:JSON.stringify(body),signal:ctl.signal});
    if(!r.ok){
      let d=''; try{ d=(await r.text()).slice(0,160); }catch(e){}
      throw new Error(P.label+' HTTP '+r.status+(d?' — '+d:''));
    }
    const j=await r.json();
    let txt='', ti=0, to=0;
    if(P.kind==='anthropic'){
      txt=(j.content||[]).filter(b=>b&&b.type==='text').map(b=>b.text).join('\n');
      if(j.usage){ ti=j.usage.input_tokens||0; to=j.usage.output_tokens||0; }
    }else{
      const ch=(j.choices&&j.choices[0])||null;
      txt=(ch&&ch.message&&ch.message.content)||'';
      if(j.usage){ ti=j.usage.prompt_tokens||0; to=j.usage.completion_tokens||0; }
    }
    LLM.meter.calls++; LLM.meter.tin+=ti; LLM.meter.tout+=to;
    LLM.meter.cost += (ti/1e6)*(P.price.in||0) + (to/1e6)*(P.price.out||0);
    LLM.meter.last=model; LLM.meter.lastErr=''; LLM.fails=0;
    llmStatus();
    return (txt||'').trim();
  }catch(e){
    LLM.fails++;
    let msg=String((e&&e.message)||e);
    if(e && e.name==='AbortError') msg='timed out after '+((o.timeout||14000)/1000)+'s';
    else if(/Failed to fetch|NetworkError|Load failed/i.test(msg))
      msg='blocked by the browser (CORS or no network) — '+((LLM_PROV[s.provider]||{}).label||'provider');
    LLM.meter.lastErr=msg.slice(0,200);
    if(LLM.fails>=3 && LLM.on){
      LLM.on=false; llmSave();
      try{ merPost('hub','Live model switched off after three consecutive failures — '+LLM.meter.lastErr
        +'. Agents are back on deterministic narration; nothing in the sim changed.','say','warn'); }catch(_){}
      try{ const c=el('llmOn'); if(c) c.checked=false; }catch(_){}
    }
    llmStatus();
    throw e;
  }finally{ clearTimeout(timer); LLM.inflight--; }
}

/* ── numeric guard. Any figure in the rewrite must already exist in the
      deterministic source line, or the rewrite is thrown away. This is what
      makes "the model can never change a number" enforceable rather than
      merely instructed. ── */
function llmNums(s){
  const out=[], re=/-?\d[\d,]*(?:\.\d+)?/g; let m;
  while((m=re.exec(s))){ const v=parseFloat(m[0].replace(/,/g,'')); if(isFinite(v)) out.push(v); }
  return out;
}
function llmNumSafe(srcTxt, outTxt){
  const a=llmNums(srcTxt), b=llmNums(outTxt);
  for(const v of b){
    const ok=a.some(x=> Math.abs(x-v)<0.02 || (x!==0 && Math.abs((x-v)/x)<0.005));
    if(!ok) return false;
  }
  return true;
}

const LLM_PERSONA = {
  ops:'the 3PL operations manager — blunt, floor-level, thinks in orders, pickers and shifts',
  cust:'the customer success lead — you carry the client into the room; warm but pointed',
  gov:'the regulatory officer — precise and cautious, always naming the consequence of a finding',
  transport:'the transport manager — yard and dock focused, impatient about detention',
  legal:'in-house counsel — measured and conditional, always naming the contractual consequence',
  finance:'the finance lead — cool and covenant-minded, thinks in margin and coverage',
  perf:'the performance analyst — analytical, unit-economics obsessed, unsentimental',
  workforce:'the workforce planner — people-first, practical about rosters and absence',
  oem:'the equipment and OEM liaison — mechanical, fixated on fleet availability',
  hub:'the orchestrator — terse, synthesises across departments, assigns ownership'
};

function llmCtxLine(c){
  return 'day '+c.day+', backlog '+Math.round(c.backlog)+' orders, OTIF '+(c.otif*100).toFixed(1)
    +'%, occupancy '+(c.occ*100).toFixed(0)+'%, dock saturation '+(c.dockSat*100).toFixed(0)
    +'% across '+c.docks+' doors, '+c.heads+' pickers rostered ('+c.absent+' absent), CPO '+fmt$(c.cpo)
    +' against a '+fmt$(c.fee)+' pick fee, day revenue '+fmt$(c.revDay)+' vs opex '+fmt$(c.opexDay)
    +', DSCR '+(isFinite(c.dscr)?c.dscr.toFixed(2):'n/a')
    +(c.outage?', power outage today':'')+(c.rain?', rain':'')+(c.heat?', heat':'')
    +(c.breakdowns?', '+c.breakdowns+' MHE breakdowns':'');
}

/* strips a trailing "RUN: @handle cmd" suggestion out of a model reply */
function llmSplitRun(txt){
  let run=null;
  const m=(txt||'').match(/RUN:\s*(@[a-z]+[^\n]*)/i);
  if(m){ run=m[1].trim().replace(/[."']+$/,''); txt=txt.replace(m[0],''); }
  return { txt:(txt||'').replace(/\s*\n\s*/g,' ').replace(/^["'\s]+|["'\s]+$/g,'').trim(), run:run };
}

/* ── post a computed line, then let the model re-voice it in place ── */
function merVoice(h, text, kind, sev, c){
  const m = merPost(h, text, kind, sev);
  if(LLM.on && LLM.rewrite && llmReady('voice') && llmBudget()){
    llmRephrase(m, h, text, c).catch(()=>{});   // deterministic line simply stands
  }
  return m;
}
async function llmRephrase(m, h, srcTxt, c){
  const a=merBy(h);
  const sys='You are '+(a?a.name:h)+', '+(LLM_PERSONA[h]||'a department lead')
    +', speaking in a warehouse operations group channel. You speak in one or two sentences.';
  const p='Rewrite this status line in your own voice.\n\nLINE: '+srcTxt
    +'\n\nSHIFT CONTEXT (background only — do not read it back): '+llmCtxLine(c||merCtx())
    +'\n\nHARD RULES:\n'
    +'- Reuse the numbers from LINE exactly. Never introduce a number that is not in LINE.\n'
    +'- Do not invent facts, actions already taken, names or dates.\n'
    +'- 40 words maximum. No preamble, no quotation marks, no markdown, no emoji.\n'
    +'- Output only the rewritten line.';
  const out=await llmCall('voice', p, {system:sys, max:170, temp:0.75, timeout:14000, auto:true});
  const clean=(out||'').replace(/^["'\s]+|["'\s]+$/g,'').replace(/\s+/g,' ');
  if(!clean || clean.length>320 || !llmNumSafe(srcTxt, clean)){
    LLM.meter.rejects++; llmStatus(); return;      // guard tripped — keep the computed line
  }
  merPatch(m, clean, {ai:true});
}

/* ── free-form reply to whatever the operator typed ── */
async function llmAnswer(h, question, c){
  const a=merBy(h);
  const m=merPost(h,'… thinking','say','info');
  if(m._tx) m._tx.classList.add('llm-think');
  try{
    const flag=(a&&a.check&&a.check(c));
    const sys='You are '+(a?a.name:h)+', '+(LLM_PERSONA[h]||'a department lead')
      +' in a 3PL warehouse operations team. You are answering your operator in the group channel.';
    const p='OPERATOR ASKED: '+question
      +'\n\nLIVE SITE STATE: '+llmCtxLine(c)
      +'\nYOUR CURRENT FLAG: '+(flag?flag.say:'nothing on my numbers is outside tolerance')
      +'\n\nRULES:\n'
      +'- Use only numbers that appear in LIVE SITE STATE or YOUR CURRENT FLAG. Never invent a figure.\n'
      +'- 60 words maximum. Conversational. No markdown, no bullet points, no headings.\n'
      +'- Never claim you have already done something — you can only advise.\n'
      +'- If one concrete move would help, finish with a final line exactly of the form:\n'
      +'  RUN: @handle command\n'
      +'  Valid commands: status, why, hire N, cut N, yes, no. Valid handles: '
      +MER_AGENTS.map(x=>x.h).join(', ')+'.';
    const raw=await llmCall('voice', p, {system:sys, max:280, temp:0.75, timeout:20000});
    const r=llmSplitRun(raw);
    if(!r.txt) throw new Error('empty reply');
    merPatch(m, r.txt, {ai:true});
    if(r.run) merSuggest(m, r.run);
  }catch(e){
    merPatch(m, 'I can take: status · why · hire N · cut N · yes · no. (Live model unreachable — '
      +String((e&&e.message)||e).slice(0,90)+')');
  }
}

/* ── hub shift brief, on the analyst slot ── */
async function llmBrief(c){
  const m=merPost('hub','… compiling the shift brief','say','info');
  if(m._tx) m._tx.classList.add('llm-think');
  try{
    const flags=MER_AGENTS.filter(a=>a.h!=='hub').map(a=>{
      const f=a.check(c); return '- @'+a.h+' ('+a.name+'): '+(f?f.say:'inside tolerance');
    }).join('\n');
    const p='You are the hub orchestrator of a 3PL warehouse operations team. Write the operator a shift brief.'
      +'\n\nSITE STATE: '+llmCtxLine(c)
      +'\n\nDEPARTMENT FLAGS:\n'+flags
      +'\n\nRULES:\n'
      +'- Use only numbers that appear above. Never invent a figure.\n'
      +'- Name the single binding constraint first, then what it is costing, then which department owns the fix.\n'
      +'- 110 words maximum. Plain prose. No markdown, no headings, no bullet lists.\n'
      +'- Finish with a final line exactly of the form: RUN: @handle command\n'
      +'  Valid commands: status, why, hire N, cut N.';
    const raw=await llmCall('analyst', p, {max:460, temp:0.6, timeout:35000});
    const r=llmSplitRun(raw);
    if(!r.txt) throw new Error('empty reply');
    merPatch(m, r.txt, {ai:true});
    if(r.run) merSuggest(m, r.run);
  }catch(e){
    const worst=MER_AGENTS.filter(a=>a.h!=='hub').map(a=>({a,f:a.check(c)})).filter(x=>x.f);
    merPatch(m, worst.length
      ? 'Deterministic brief — '+worst.length+' department'+(worst.length>1?'s':'')+' flagging: '
        +worst.map(x=>'@'+x.a.h).join(', ')+'. '+worst[0].f.say
      : 'Deterministic brief — every department is inside tolerance. '
        +'Backlog '+Math.round(c.backlog)+', OTIF '+(c.otif*100).toFixed(1)+'%, DSCR '
        +(isFinite(c.dscr)?c.dscr.toFixed(2):'n/a')+'.');
  }
}

/* ── connection test ── */
async function llmTest(slotName){
  const s=llmSlot(slotName), P=LLM_PROV[s.provider]||{};
  const st=el('llmTestOut');
  if(st){ st.textContent='testing '+(P.label||'?')+' · '+(s.model||(P.models&&P.models[0])||'?')+' …'; st.className='mono text-[10px] text-mut mt-2'; }
  const t0=performance.now();
  try{
    const out=await llmCall(slotName,'Reply with exactly the two characters: OK',{max:24,temp:0,timeout:20000});
    const ms=Math.round(performance.now()-t0);
    if(st){ st.textContent='✓ '+slotName+' slot live — '+(P.label||'')+' · '+(s.model||P.models[0])+' · '+ms+'ms · replied "'+out.slice(0,24)+'"';
            st.className='mono text-[10px] text-ok mt-2'; }
  }catch(e){
    if(st){ st.textContent='✗ '+slotName+' slot — '+String((e&&e.message)||e).slice(0,220);
            st.className='mono text-[10px] text-warn mt-2'; }
  }
  llmStatus();
}

/* ── status chip + meter ── */
function llmStatus(){
  const s=llmSlot('voice'), P=LLM_PROV[s.provider]||{};
  const e=el('llmStatus');
  if(e){
    if(!LLM.on){ e.className='llm-chip llm-off'; e.textContent='LLM OFF'; }
    else if(LLM.fails>0 && LLM.meter.lastErr){ e.className='llm-chip llm-err'; e.textContent='LLM ERR'; }
    else { e.className='llm-chip llm-live';
      e.textContent='LLM LIVE · '+(s.model||(P.models&&P.models[0])||'?').split('/').pop()
        +' · '+LLM.meter.calls+' · $'+LLM.meter.cost.toFixed(4); }
  }
  const mt=el('llmMeter');
  if(mt){
    mt.textContent='metered: '+LLM.meter.calls+' calls · '+LLM.meter.tin+' in / '+LLM.meter.tout
      +' out tokens · est '+('$'+LLM.meter.cost.toFixed(4))+' · '+LLM.meter.rejects+' rewrite'
      +(LLM.meter.rejects===1?'':'s')+' rejected by the number guard · autonomous budget '
      +LLM.dayCalls+'/'+LLM.maxPerDay+' this sim-day'
      +(LLM.meter.lastErr?(' · last error: '+LLM.meter.lastErr):'');
  }
}

/* ── model settings panel ─────────────────────────────────────────── */
function llmSlotHTML(name, s){

    '<option value="'+k+'"'+(s.provider===k?' selected':'')+'>'+LLM_PROV[k].label+'</option>').join('');
  const P=LLM_PROV[s.provider]||{};
  return ''
  + '<div class="llm-grid mb-1">'
  + '  <span class="lbl">provider</span>'
  + '  <select id="llm_'+name+'_prov">'+provOpts+'</select>'
  + '  <span class="lbl">api key</span>'
  + '  <input id="llm_'+name+'_key" type="password" class="mono text-[11px]" autocomplete="off" '
  + '     placeholder="'+(P.keyHint||'')+'" value="'+(s.key||'').replace(/"/g,'&quot;')+'">'
  + '  <span class="lbl">model</span>'
  + '  <input id="llm_'+name+'_model" type="text" class="mono text-[11px]" list="llm_'+name+'_models" '
  + '     placeholder="'+((P.models&&P.models[0])||'model id')+'" value="'+(s.model||'').replace(/"/g,'&quot;')+'">'
  + '  <datalist id="llm_'+name+'_models">'+((P.models||[]).map(m=>'<option value="'+m+'">').join(''))+'</datalist>'
  + '  <span class="lbl">endpoint</span>'
  + '  <input id="llm_'+name+'_url" type="text" class="mono text-[11px]" '
  + '     placeholder="'+(P.url||'https://…/chat/completions')+'" value="'+(s.url||'').replace(/"/g,'&quot;')+'">'
  + '</div>'
  + '<div class="llm-note mb-2" id="llm_'+name+'_note">'+(P.note||'')+'</div>';

function llmPanelHTML(){
  return ''
  + '<div id="llmPanel" class="llm-panel p-3 hidden">'
  + '  <div class="flex items-center gap-3 flex-wrap mb-2">'
  + '    <label class="lbl flex items-center gap-1.5 cursor-pointer"><input type="checkbox" id="llmOn"'+(LLM.on?' checked':'')+'> live model</label>'
  + '    <label class="lbl flex items-center gap-1.5 cursor-pointer"><input type="checkbox" id="llmRw"'+(LLM.rewrite?' checked':'')+'> re-voice agent lines</label>'
  + '    <label class="lbl flex items-center gap-1.5 cursor-pointer"><input type="checkbox" id="llmFf"'+(LLM.freeform?' checked':'')+'> free-form replies</label>'
  + '    <label class="lbl flex items-center gap-1.5 cursor-pointer"><input type="checkbox" id="llmRem"'+(LLM.remember?' checked':'')+'> remember on this device</label>'
  + '  </div>'
  + '  <div class="lbl mb-1" style="color:#B37400">Voice slot — agent chatter, replies, escalations</div>'
  + llmSlotHTML('voice', LLM.slot.voice)
  + '  <div class="lbl mb-1" style="color:#B37400">Analyst slot — Scout site profiling, @hub brief</div>'
  + '  <label class="lbl flex items-center gap-1.5 cursor-pointer mb-1"><input type="checkbox" id="llmSame"'+(LLM.slot.analyst.same?' checked':'')+'> same as voice slot</label>'
  + '  <div id="llmAnalystBox"'+(LLM.slot.analyst.same?' class="hidden"':'')+'>'
  + llmSlotHTML('analyst', LLM.slot.analyst)
  + '  </div>'
  + '  <div class="flex gap-2 items-center flex-wrap mt-2">'
  + '    <button class="btn mono text-[10px]" id="llmTestV">TEST VOICE</button>'
  + '    <button class="btn mono text-[10px]" id="llmTestA">TEST ANALYST</button>'
  + '    <span class="lbl">auto calls / sim-day</span>'
  + '    <input id="llmCap" type="number" min="0" max="60" value="'+LLM.maxPerDay+'" class="mono text-[11px]" style="width:62px">'
  + '    <button class="btn mono text-[10px]" id="llmReset">RESET METER</button>'
  + '  </div>'
  + '  <div id="llmTestOut" class="mono text-[10px] text-mut mt-2"></div>'
  + '  <div id="llmMeter" class="mono text-[10px] text-mut mt-1"></div>'
  + mtrAccountHTML()
  + '  <div class="llm-note mt-2" style="border-top:1px dashed #D4DCE7;padding-top:6px">'
  + '    Keys live in memory only unless you tick <b>remember on this device</b>. The model never computes: '
  + '    every figure is produced by the sim, posted first, then re-worded. A numeric guard discards any '
  + '    rewrite that introduces a number the sim did not produce. Pull the network and the channel keeps running.'

function llmWirePanel(){
  const bind=(id,fn)=>{ const e=el(id); if(e) fn(e); };
  bind('llmOn', e=>e.onchange=()=>{
    if(e.checked && !llmReady('voice')){
      e.checked=false;
      const o=el('llmTestOut'); if(o){ o.textContent='✗ set a provider, key and model first'; o.className='mono text-[10px] text-warn mt-2'; }
      return;
    }
    LLM.on=e.checked; LLM.fails=0; LLM.meter.lastErr=''; llmSave(); llmStatus();
  });
  bind('llmRw', e=>e.onchange=()=>{ LLM.rewrite=e.checked; llmSave(); });
  bind('llmFf', e=>e.onchange=()=>{ LLM.freeform=e.checked; llmSave(); });
  bind('llmRem',e=>e.onchange=()=>{ LLM.remember=e.checked; llmSave(); });
  bind('llmCap',e=>e.onchange=()=>{ LLM.maxPerDay=Math.max(0,Math.min(60,+e.value||0)); llmSave(); llmStatus(); });
  bind('llmSame',e=>e.onchange=()=>{
    LLM.slot.analyst.same=e.checked;
    const b=el('llmAnalystBox'); if(b) b.classList.toggle('hidden', e.checked);
    llmSave(); llmStatus();
  });
  bind('llmTestV', e=>e.onclick=()=>llmTest('voice'));
  bind('llmTestA', e=>e.onclick=()=>llmTest('analyst'));
  bind('llmReset', e=>e.onclick=()=>{
    LLM.meter={calls:0,tin:0,tout:0,cost:0,rejects:0,last:'',lastErr:''};
    LLM.dayCalls=0; LLM.fails=0; llmStatus();
  });
  for(const name of ['voice','analyst']){
    const s=LLM.slot[name];
    bind('llm_'+name+'_prov', e=>e.onchange=()=>{
      s.provider=e.value; s.model=''; s.url='';
      const P=LLM_PROV[s.provider]||{};
      const mi=el('llm_'+name+'_model'); if(mi){ mi.value=''; mi.placeholder=(P.models&&P.models[0])||'model id'; }
      const dl=el('llm_'+name+'_models'); if(dl) dl.innerHTML=(P.models||[]).map(m=>'<option value="'+m+'">').join('');
      const ui=el('llm_'+name+'_url'); if(ui){ ui.value=''; ui.placeholder=P.url||'https://…/chat/completions'; }
      const ki=el('llm_'+name+'_key'); if(ki) ki.placeholder=P.keyHint||'';
      const nt=el('llm_'+name+'_note'); if(nt) nt.innerHTML=P.note||'';
      llmSave(); llmStatus();
    });
    bind('llm_'+name+'_key',  e=>e.oninput=()=>{ s.key=e.value.trim(); llmSave(); llmStatus(); });
    bind('llm_'+name+'_model',e=>e.oninput=()=>{ s.model=e.value.trim(); llmSave(); llmStatus(); });
    bind('llm_'+name+'_url',  e=>e.oninput=()=>{ s.url=e.value.trim(); llmSave(); llmStatus(); });
  }
  llmStatus();
  try{ mtrWire(); }catch(e){}
}

let uiTimer=0, lastFrame=performance.now();
/* Loop-safety. requestAnimationFrame MUST always be re-armed. Previously it
   was the last statement, so any throw anywhere above it ended the loop for
   good and froze the entire app -- tab bar included -- not just the sim view.
   Each stage is now isolated and the first fault per stage is surfaced
   instead of silently killing the session. */
const FRAME_ERR = {};
function guard(label, fn){
  try{ fn(); }
  catch(e){
    if(!FRAME_ERR[label]){
      FRAME_ERR[label]=String((e&&e.message)||e);
      console.error('[frame:'+label+']', e);
      try{ showFrameError(label, FRAME_ERR[label]); }catch(_){}
    }
  }
}
function showFrameError(label,msg){
  let b=el('frameErr');
  if(!b){
    b=document.createElement('div'); b.id='frameErr';
    b.style.cssText='position:fixed;left:8px;right:8px;bottom:8px;z-index:9999;background:#FDECEC;'
      +'border:1px solid #D33036;color:#8E1F24;border-radius:8px;padding:8px 10px;'
      +'font:11px ui-monospace,monospace;line-height:1.45;box-shadow:0 4px 14px rgba(0,0,0,.12)';
    const x=document.createElement('button');
    x.textContent='dismiss';
    x.style.cssText='float:right;border:0;background:#D33036;color:#fff;border-radius:5px;'
      +'padding:2px 8px;cursor:pointer;font:11px ui-monospace,monospace';
    x.onclick=function(){ b.remove(); };
    b.appendChild(x);
    const t=document.createElement('div'); t.id='frameErrTxt'; b.appendChild(t);
    document.body.appendChild(b);
  }
  el('frameErrTxt').textContent='Render fault in "'+label+'": '+msg
    +'  -- the simulation kept running. Please report this line.';
}
const PERF={worst:0, stage:'', shed:false, samples:0};
function timed(label, fn){
  const t0=performance.now();
  guard(label, fn);
  const ms=performance.now()-t0;
  if(ms>PERF.worst){ PERF.worst=ms; PERF.stage=label; }
}
/* If the Tailwind CDN did not load, say so once. The fallback above keeps the
   app usable, but spacing and colour will look plainer than intended. */
function checkStyles(){
  const probe=document.createElement('div');
  probe.className='hidden'; document.body.appendChild(probe);
  const dead=getComputedStyle(probe).display!=='none';
  probe.remove();
  const probe2=document.createElement('div');
  probe2.className='flex-1'; document.body.appendChild(probe2);
  const noTw=getComputedStyle(probe2).flexGrow!=='1';
  probe2.remove();
  if(dead){
    try{ showFrameError('layout','CRITICAL: the .hidden class is missing, tabs cannot switch.'); }catch(_){}
  } else if(noTw){
    console.warn('[meridian] Tailwind CDN unavailable - running on the offline style fallback.');
  }
}
setTimeout(function(){ try{ checkStyles(); }catch(e){} }, 1200);

function frame(now){
  try{
    const dt=Math.min(100,now-lastFrame); lastFrame=now;
    const frameStart=performance.now();
    if(SIM.started && !SIM.paused){
      let n=Math.round(SIM.speed*(dt/16.7));
      n=Math.min(n, SIM.speed>=1000?4000:SIM.speed>=100?500:SIM.speed);
      timed('tick', function(){ for(let i=0;i<n;i++) tick(); });
    }
    if(S.tab==='sim'){
      timed('renderWorld', renderWorld);
      timed('renderSimUi', renderSimUi);
    }
    uiTimer+=dt;
    if(uiTimer>800){ uiTimer=0;
      guard('kpiRibbon', kpiRibbon);
      guard('updateHeader', updateHeader);
      if(S.tab==='sim') guard('renderLeft', renderLeft);
      if(S.tab==='adv') guard('renderAdv', renderAdv);
    }
    const cost=performance.now()-frameStart;
    PERF.samples++;
    if(cost>400 && !PERF.shed){
      PERF.shed=true;
      if(SIM.speed>1){ SIM.speed=1; }
      MER.on=false; ENV.fx=false;   // shadows, scenery and glare go first
      try{ showFrameError('watchdog',
        'a frame took '+cost.toFixed(0)+'ms (slowest stage: '+PERF.stage+' at '
        +PERF.worst.toFixed(0)+'ms). Speed dropped to 1x and agents switched off to keep '
        +'the page responsive. Press A to re-enable agents, P to profile.'); }catch(_){}
    }
  } finally {
    requestAnimationFrame(frame);   // the loop can never die
  }
}
document.addEventListener('keydown',e=>{
  if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName)) return;
  if(e.code==='Space'){ e.preventDefault(); SIM.paused=!SIM.paused; renderSimUi(); }
  if(['1','2','3','4','5'].includes(e.key)){ SIM.speed=SIM.speeds[+e.key-1]; renderSimUi(); }
  if(e.key==='a'||e.key==='A'){
    MER.on=!MER.on; PERF.shed=false;
    try{ showFrameError('agents','agent layer '+(MER.on?'ENABLED':'DISABLED')+' by keypress.'); }catch(_){}
  }
  if(e.key==='p'||e.key==='P'){
    try{ showFrameError('profile',
      'slowest stage '+PERF.stage+' at '+PERF.worst.toFixed(0)+'ms over '+PERF.samples
      +' frames. agents='+(MER.on?'on':'off')+' speed='+SIM.speed
      +' workers='+SIM.workers.length+' chat='+MER.chat.length); }catch(_){}
  }
});
el('btnPause').onclick=()=>{ SIM.paused=!SIM.paused; renderSimUi(); };
function openDrawer(){ const p=el('leftPanel'); p.classList.remove('hidden'); p.classList.add('drawer-open');
  if(!el('drawerBg')){ const b=document.createElement('div'); b.id='drawerBg'; b.onclick=closeDrawer; document.body.appendChild(b); } }
function closeDrawer(){ const p=el('leftPanel'); if(!p||!p.classList.contains('drawer-open')) return;
  p.classList.remove('drawer-open'); p.classList.add('hidden'); const b=el('drawerBg'); if(b) b.remove(); }
el('btnDrawer').onclick=()=>{ el('leftPanel').classList.contains('drawer-open')? closeDrawer() : openDrawer(); };
document.querySelectorAll('.tab-btn').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
el('seedToggle').onchange=()=>RNG.reset(); el('seedVal').onchange=()=>RNG.reset();

/* onboarding (5 steps) */
const OB=[
 ['Pick your battlefield','Start in SETUP: choose one of 8 market presets — or open every parameter with Build My Location. Land, labor, linehaul distances, climate risk, tariffs, demand benchmarks: all of it drives the model.'],
 ['Walk the site before you sign','DUE DILIGENCE scores '+DD_ITEMS.length+' real inspection items 0–100. Red items are not cosmetic: no ESFR caps your racks at 6 m and locks cold-chain; a shallow truck court adds 40% to every dock turn.'],
 ['Choose what you store','Blend up to 12 product verticals with share sliders. Frozen food, DG chemicals and pharma will redraw the floor — freezer shells, cages, GOH rails — and reprice energy, insurance and rates.'],
 ['Run the living floor','FLOOR SIM is a real discrete-event engine at 1-second resolution. Watch trucks queue at the gatehouse, racks fill, plumbobs sour under backlog. Space pauses; keys 1–5 set speed up to 1000× to fast-forward a year.'],
 ['Get the verdict','FINANCIALS tracks NPV, IRR, DSCR and CPO live; the AI ADVISOR posts paybacked upgrade cards; INVESTOR REPORT compiles a printable committee paper with a GO / CONDITIONAL / NO-GO score — and the three conditions that would flip it.'],
];
let obI=0;
function showOb(i){ obI=clamp(i,0,4); el('obStep').textContent=obI+1; el('obTitle').textContent=OB[obI][0]; el('obBody').textContent=OB[obI][1];
  el('obPrev').style.visibility=obI===0?'hidden':'visible'; el('obNext').textContent=obI===4?'Start building →':'Next →';
  el('onboard').classList.remove('hidden'); el('onboard').classList.add('flex'); }
function hideOb(){ el('onboard').classList.add('hidden'); el('onboard').classList.remove('flex'); S.onboardSeen=true; }
el('obNext').onclick=()=>obI===4?hideOb():showOb(obI+1);
el('obPrev').onclick=()=>showOb(obI-1);
el('obSkip').onclick=hideOb;
el('btnHelp').onclick=()=>showOb(0);

/* init */
recompute();
rollRoster();
spawnWorld();
resetSim();          // world is alive immediately; SETUP changes re-seed via ▶ button
setTab('setup');
kpiRibbon();
bindCanvas();
showOb(0);
requestAnimationFrame(frame);
/* session resolves after first paint; the sim never waits on it */
setTimeout(()=>{ try{ if(MTR.base) mtrHello(); else mtrChip(); }catch(e){} }, 400);
</script>
