<script src="https://cdn.tailwindcss.com"></script>
<!-- OFFLINE FALLBACK. The app depended entirely on the Tailwind CDN for .hidden
     and its core layout classes. With no network (mobile data off, restricted
     egress, file:// with no connection) every tab pane rendered at once and the
     tab bar stopped working. These rules keep the app structurally usable with
     zero network. They match Tailwind's own values, so they are harmless when
     the CDN does load. -->
<style id="offlineFallback">
  .hidden{display:none}
  .block{display:block} .inline-block{display:inline-block}
  .flex{display:flex} .grid{display:grid}
  .flex-col{flex-direction:column} .flex-wrap{flex-wrap:wrap}
  .flex-1{flex:1 1 0%} .flex-none{flex:none}
  .min-h-0{min-height:0} .min-w-0{min-width:0}
  .w-full{width:100%} .h-full{height:100%} .h-screen{height:100vh}
  .relative{position:relative} .absolute{position:absolute} .fixed{position:fixed}
  .overflow-y-auto{overflow-y:auto} .overflow-x-auto{overflow-x:auto}
  .overflow-hidden{overflow:hidden}
  .items-center{align-items:center} .items-baseline{align-items:baseline}
  .justify-between{justify-content:space-between}
  .text-center{text-align:center} .truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .space-y-1>*+*{margin-top:.25rem} .space-y-2>*+*{margin-top:.5rem}
  .space-y-3>*+*{margin-top:.75rem}
  .gap-1{gap:.25rem} .gap-2{gap:.5rem} .gap-3{gap:.75rem}
  .p-2{padding:.5rem} .p-3{padding:.75rem} .p-4{padding:1rem}
  .mb-1{margin-bottom:.25rem} .mb-2{margin-bottom:.5rem} .mt-2{margin-top:.5rem}
  /* Tab bar and stage must survive with no framework at all. */
  #tabbar{display:flex;overflow-x:auto;flex:none}
  #stage{flex:1 1 0%;min-width:0;overflow-y:auto;position:relative}
  #stage-sim{height:100%;position:relative}
  #simCanvas{width:100%;height:100%;display:block;min-height:320px}
  /* Never let the sim view trap the user: the tab bar always stays on top. */
  #tabbar{position:sticky;top:0;z-index:40;background:#FFFFFF}
</style>

<body class="h-[100dvh] flex flex-col overflow-hidden text-sm">

<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════════
   §1 UTILITIES & SEEDED RNG
   ═══════════════════════════════════════════════════════════════════ */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const RNG = { fn: Math.random, seeded:false,
  reset(){ this.seeded = el('seedToggle')?.checked; this.fn = this.seeded ? mulberry32(+el('seedVal').value||42) : Math.random; },
  r(){ return this.fn(); },
  range(a,b){ return a + this.r()*(b-a); },
  gauss(mu=0,sd=1){ let u=0,v=0; while(!u)u=this.r(); while(!v)v=this.r(); return mu+sd*Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); },
  poisson(l){ const L=Math.exp(-l); let k=0,p=1; do{k++;p*=this.r()}while(p>L); return k-1; }
};
const el = id => document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const fmt$=v=>{const n=Math.abs(v);const s=v<0?'-$':'$';if(n>=1e6)return s+(n/1e6).toFixed(2)+'M';if(n>=1e3)return s+(n/1e3).toFixed(1)+'k';return s+n.toFixed(0)};
const fmtN=v=>{const n=Math.abs(v);if(n>=1e6)return (v/1e6).toFixed(2)+'M';if(n>=1e3)return (v/1e3).toFixed(1)+'k';return (Math.round(v*10)/10).toString()};
const pct=v=>(v*100).toFixed(1)+'%';
const sgn$=v=>(v>=0?'+':'−')+fmt$(Math.abs(v));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

/* ═══════════════════════════════════════════════════════════════════
   §2 DATA — LOCATION PRESETS  (§1 of spec)
   Every field is displayed and editable via Build My Location.
   ═══════════════════════════════════════════════════════════════════ */
const LOC_FIELDS = [
 // [key, label, unit, min, max, step, group]
 ['landPrice','Land price','$/m²',50,8000,10,'Property'],
 ['leaseRate','Prime lease rate','$/m²/yr',30,400,1,'Property'],
 ['outgoings','Outgoings','$/m²/yr',5,60,1,'Property'],
 ['incentivePct','Lease incentives / abatement','% yr1',0,30,1,'Property'],
 ['wage','Base warehouse wage','$/hr',6,50,0.5,'Labor'],
 ['forkPrem','Forklift-licensed premium','$/hr',0,8,0.5,'Labor'],
 ['supSalary','Supervisor salary','$k/yr',40,160,1,'Labor'],
 ['laborAvail','Labor availability index','0–1',0.2,0.95,0.01,'Labor'],
 ['unionLoad','Union / penalty-rate loading','×',1,1.6,0.01,'Labor'],
 ['kmPort','Distance to seaport','km',1,500,1,'Access'],
 ['kmAir','Distance to airport','km',1,120,1,'Access'],
 ['kmRail','Distance to intermodal rail','km',1,120,1,'Access'],
 ['kmMwy','Distance to motorway ramp','km',0.5,30,0.5,'Access'],
 ['powerTariff','Power tariff','$/kWh',0.05,0.5,0.01,'Utilities'],
 ['gridOutage','Grid outages','hrs/yr',0,40,1,'Utilities'],
 ['waterRate','Water','$/kL',0.5,6,0.1,'Utilities'],
 ['gasRate','Gas','$/GJ',5,30,0.5,'Utilities'],
 ['solarIdx','Solar feasibility index','0–1',0.2,1,0.01,'Utilities'],
 ['tSummer','Ambient — summer avg','°C',5,45,1,'Climate'],
 ['tAutumn','Ambient — autumn avg','°C',0,40,1,'Climate'],
 ['tWinter','Ambient — winter avg','°C',-10,35,1,'Climate'],

/* ═══════════════════════════════════════════════════════════════════
   §2b-1  GOOGLE MAPS PLATFORM  (optional — keyed, never required)
   The Maps JavaScript API is loaded by script injection, which is the
   only Google surface that speaks CORS from a browser: the Geocoding
   and Distance Matrix *web services* reject browser origins outright,
   so this path is the correct one, not a workaround.

   Enable on the key: Maps JavaScript API · Places API · Distance Matrix
   API · Geocoding API. With no key the scout falls straight back to
   Photon → Nominatim exactly as before.
   ═══════════════════════════════════════════════════════════════════ */
const GMAP = { key:'', on:true, loaded:false, loading:null, err:'', calls:0, keyUsed:'' };
let SC_DEEP = false;   // deep scout = 4 focused research passes instead of 1
function gmapOn(){ return !!(GMAP.key && GMAP.on); }

function gmapLoad(){
  if(!GMAP.key) return Promise.reject(new Error('no Google Maps key set'));
  if(GMAP.loaded && GMAP.keyUsed===GMAP.key && window.google && window.google.maps)
    return Promise.resolve(window.google);
  if(GMAP.loaded && GMAP.keyUsed!==GMAP.key)
    return Promise.reject(new Error('Google Maps was already loaded with a different key — reload the page to switch keys'));
  if(GMAP.loading) return GMAP.loading;
  GMAP.loading = new Promise((res,rej)=>{
    const cb='__gmapCb'+Math.floor(Math.random()*1e9);
    let done=false;
    const fin=()=>{ done=true; clearTimeout(to); try{ delete window[cb]; }catch(e){} };
    const to=setTimeout(()=>{ if(done) return; fin(); GMAP.loading=null;
      rej(new Error('Google Maps did not load in 15s — network blocked, or the key is restricted to another referrer')); },15000);
    // Google reports key/billing rejection only through this global.
    window.gm_authFailure=function(){ if(done) return; fin(); GMAP.loading=null;
      GMAP.err='Google rejected the key — check billing is enabled, the four APIs are switched on, and the HTTP-referrer restriction allows this page';
      rej(new Error(GMAP.err)); };
    window[cb]=function(){ if(done) return; fin();
      GMAP.loaded=true; GMAP.keyUsed=GMAP.key; GMAP.err=''; res(window.google); };
    const s=document.createElement('script');
    s.async=true;
    s.src='https://maps.googleapis.com/maps/api/js?key='+encodeURIComponent(GMAP.key)
        + '&libraries=places&loading=async&callback='+cb;
    s.onerror=()=>{ if(done) return; fin(); GMAP.loading=null;
      rej(new Error('Google Maps script was blocked by the browser or network')); };
    document.head.appendChild(s);
  });
  return GMAP.loading;
}

/* Places moved to a new object model in 2025 while the old one still ships.
   Feature-detect rather than pick a side, so this keeps working either way. */
async function gSuggest(q){
  const g=await gmapLoad(); GMAP.calls++;
  const pl=g.maps.places;
  if(pl.AutocompleteSuggestion && pl.AutocompleteSuggestion.fetchAutocompleteSuggestions){
    const r=await pl.AutocompleteSuggestion.fetchAutocompleteSuggestions({input:q});
    return (r.suggestions||[]).map(s=>{ const p=s.placePrediction; if(!p) return null;
      return { label:String(p.text&&p.text.text||p.text||''), placeId:p.placeId, src:'google' }; }).filter(Boolean);
  }
  return new Promise((res,rej)=>{
    new pl.AutocompleteService().getPlacePredictions({input:q},(r,st)=>{
      if(st!=='OK'||!r) return rej(new Error('Places autocomplete: '+st));
      res(r.map(x=>({ label:x.description, placeId:x.place_id, src:'google' })));
    });
  });
}
async function gDetails(placeId){
  const g=await gmapLoad(); GMAP.calls++;
  const pl=g.maps.places;
  if(pl.Place){
    const p=new pl.Place({id:placeId});
    await p.fetchFields({fields:['location','formattedAddress','addressComponents','displayName']});
    const comp=p.addressComponents||[];
    const pick=t=>{ const c=comp.find(x=>(x.types||[]).indexOf(t)>-1); return c?(c.shortText||c.longText||''):''; };
    return { lat:p.location.lat(), lon:p.location.lng(),
             label:p.formattedAddress||String(p.displayName||''), cc:(pick('country')||'').toUpperCase(),
             admin:pick('administrative_area_level_1'), city:pick('locality'), placeId, src:'google' };
  }
  return new Promise((res,rej)=>{
    new pl.PlacesService(document.createElement('div'))
      .getDetails({placeId,fields:['geometry','formatted_address','address_components','name']},(r,st)=>{
        if(st!=='OK'||!r) return rej(new Error('Place details: '+st));
        const comp=r.address_components||[];
        const pick=t=>{ const c=comp.find(x=>(x.types||[]).indexOf(t)>-1); return c?c.short_name:''; };
        res({ lat:r.geometry.location.lat(), lon:r.geometry.location.lng(),
              label:r.formatted_address||r.name, cc:(pick('country')||'').toUpperCase(),
              admin:pick('administrative_area_level_1'), city:pick('locality'), placeId, src:'google' });
      });
  });
}
async function gGeocode(q){
  const g=await gmapLoad(); GMAP.calls++;
  const r=await new g.maps.Geocoder().geocode({address:q});
  const hit=(r.results||[])[0]; if(!hit) throw new Error('Google could not geocode that');
  const comp=hit.address_components||[];
  const pick=t=>{ const c=comp.find(x=>(x.types||[]).indexOf(t)>-1); return c?c.short_name:''; };
  return { lat:hit.geometry.location.lat(), lon:hit.geometry.location.lng(),
           label:hit.formatted_address, cc:(pick('country')||'').toUpperCase(),
           admin:pick('administrative_area_level_1'), city:pick('locality'),
           placeId:hit.place_id, src:'google' };
}
/* nearest facility of a kind, ranked by true distance */
async function gNearest(geo, query, type){
  const g=await gmapLoad(); GMAP.calls++;
  const pl=g.maps.places;
  if(pl.Place && pl.Place.searchByText){
    const r=await pl.Place.searchByText({
      textQuery:query, fields:['location','displayName'], maxResultCount:1,
      rankPreference:(pl.SearchByTextRankPreference&&pl.SearchByTextRankPreference.DISTANCE)||'DISTANCE',
      locationBias:{ center:{lat:geo.lat,lng:geo.lon}, radius:50000 } });
    const p=(r.places||[])[0]; if(!p) return null;
    return { name:String(p.displayName||query), lat:p.location.lat(), lon:p.location.lng() };
  }
  return new Promise(res=>{
    const req={ location:new g.maps.LatLng(geo.lat,geo.lon), rankBy:pl.RankBy.DISTANCE, keyword:query };
    if(type) req.type=type;
    new pl.PlacesService(document.createElement('div')).nearbySearch(req,(r,st)=>{
      if(st!=='OK'||!r||!r.length) return res(null);
      const p=r[0];
      res({ name:p.name, lat:p.geometry.location.lat(), lon:p.geometry.location.lng() });
    });
  });
}
/* real ROAD distance, and free-flow vs peak duration for congestion */
async function gRoadKm(a,b,departAt){
  const g=await gmapLoad(); GMAP.calls++;
  const req={ origins:[new g.maps.LatLng(a.lat,a.lon)], destinations:[new g.maps.LatLng(b.lat,b.lon)],
              travelMode:'DRIVING', unitSystem:g.maps.UnitSystem.METRIC };
  if(departAt) req.drivingOptions={ departureTime:departAt, trafficModel:'pessimistic' };
  return new Promise(res=>{
    new g.maps.DistanceMatrixService().getDistanceMatrix(req,(r,st)=>{
      if(st!=='OK'||!r||!r.rows||!r.rows[0]) return res(null);
      const e=r.rows[0].elements&&r.rows[0].elements[0];
      if(!e||e.status!=='OK') return res(null);
      res({ km:e.distance.value/1000, min:e.duration.value/60,
            minPeak:e.duration_in_traffic? e.duration_in_traffic.value/60 : null });
    });
  });
}
function scHaversine(a,b){
  const R=6371, rad=x=>x*Math.PI/180;
  const dLat=rad(b.lat-a.lat), dLon=rad(b.lon-a.lon);
  const s=Math.sin(dLat/2)**2 + Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(s));
}
/* next weekday 08:00 local — the honest peak for a truck movement */
function scPeakDate(){
  const d=new Date(); d.setDate(d.getDate()+1); d.setHours(8,0,0,0);
  while(d.getDay()===0||d.getDay()===6) d.setDate(d.getDate()+1);
  return d;
}

/* ═══════════════════════════════════════════════════════════════════
   §2b-2  LOCATE — Google when keyed, Photon → Nominatim otherwise
   ═══════════════════════════════════════════════════════════════════ */
async function scGeoSearch(q,limit,signal){
  if(gmapOn()){
    try{ const g=await gSuggest(q); if(g.length) return g.slice(0,limit); }
    catch(e){ GMAP.err=String((e&&e.message)||e); }
  }
  try{
    const r=await fetch('https://photon.komoot.io/api/?limit='+limit+'&q='+encodeURIComponent(q),{signal});
    if(r.ok){ const j=await r.json();
      const out=(j.features||[]).map(f=>{ const p=f.properties||{}, c=f.geometry.coordinates;
        const label=[[p.housenumber,p.name||p.street].filter(Boolean).join(' '),p.city||p.county,p.state,p.country].filter(Boolean).join(', ');
        return { label, lat:c[1], lon:c[0], cc:(p.countrycode||'').toUpperCase(), src:'photon' }; });
      if(out.length) return out;
    }
  }catch(e){ if(e.name==='AbortError') throw e; }
  const r2=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit='+limit+'&q='+encodeURIComponent(q),{signal,headers:{'Accept':'application/json'}});
  if(!r2.ok) throw new Error('geo-unreachable');
  const j2=await r2.json();
  return j2.map(o=>({ label:o.display_name, lat:+o.lat, lon:+o.lon,
                      cc:((o.address&&o.address.country_code)||'').toUpperCase(), src:'nominatim' }));
}
/* a Google suggestion carries no coordinates — resolve it on pick */
async function scResolve(pick,q){
  if(pick && pick.lat!=null) return pick;
  if(pick && pick.placeId) return await gDetails(pick.placeId);
  if(gmapOn()){ try{ return await gGeocode(q); }catch(e){ GMAP.err=String((e&&e.message)||e); } }
  const res=await scGeoSearch(q,1);
  return res[0]||null;
}

/* ═══════════════════════════════════════════════════════════════════
   §2b-3  MEASURE — access distances become facts, not guesses
   Nearest facility by Places, then true road km by Distance Matrix.
   Peak-vs-free-flow duration on the port leg gives congestMin for real.
   ═══════════════════════════════════════════════════════════════════ */
const SC_TARGETS=[
  { k:'kmPort', label:'seaport',            type:null,      q:['seaport container terminal','shipping port','port'] },
  { k:'kmAir',  label:'airport',            type:'airport', q:['international airport','airport'] },
  { k:'kmRail', label:'intermodal rail',    type:null,      q:['intermodal freight rail terminal','freight rail terminal','railway freight depot'] },
  { k:'kmMwy',  label:'motorway ramp',      type:null,      q:['motorway junction','highway interchange','freeway on ramp'] },
];
async function scMeasureAccess(geo, log){
  const out={ values:{}, detail:{} };
  if(!gmapOn()) return out;
  await gmapLoad();
  const peak=scPeakDate();
  for(const t of SC_TARGETS){
    let found=null;
    for(const q of t.q){ try{ found=await gNearest(geo,q,t.type); }catch(e){} if(found) break; }
    if(!found){ log('· nearest '+t.label+' — not found by Places, leaving it to the AI'); continue; }
    let rd=null; try{ rd=await gRoadKm(geo,found,t.k==='kmPort'?peak:null); }catch(e){}
    const km=rd? rd.km : scHaversine(geo,found);
    const r=FIELD_RANGE[t.k];
    out.values[t.k]=clamp(Math.round(km*10)/10, r[0], r[1]);
    out.detail[t.k]=(rd?'road':'straight-line')+' '+(Math.round(km*10)/10)+' km → '+found.name;
    log('· '+t.label+': '+out.detail[t.k]);
    if(t.k==='kmPort' && rd && rd.minPeak!=null){
      const delay=clamp(Math.round(rd.minPeak-rd.min),0,60);
      out.values.congestMin=delay;
      out.detail.congestMin='peak vs free-flow on the port leg: +'+delay+' min';
      log('· peak-hour truck delay: +'+delay+' min on the port run');
    }
  }
  return out;
}

/* ── measured climate (Open-Meteo ERA5, last 12 months) ── */
async function scClimate(lat,lon){
  const end=new Date(Date.now()-6*864e5), start=new Date(end.getTime()-365*864e5);
  const d=x=>x.toISOString().slice(0,10);
  const u='https://archive-api.open-meteo.com/v1/archive?latitude='+lat+'&longitude='+lon
    +'&start_date='+d(start)+'&end_date='+d(end)
    +'&daily=temperature_2m_mean,relative_humidity_2m_mean&timezone=auto';
  const r=await fetch(u); if(!r.ok) throw new Error('climate-unreachable');
  const j=await r.json(); const dd=j.daily||{};
  const times=dd.time||[], temps=dd.temperature_2m_mean||[], hums=dd.relative_humidity_2m_mean||[];
  if(!times.length) throw new Error('climate-empty');
  const bins=[[],[],[],[]], hb=[];
  for(let i=0;i<times.length;i++){
    const m=+times[i].slice(5,7), t=temps[i], h=hums[i];
    if(t==null) continue;
    const b=(m===12||m<=2)?0:(m<=5)?1:(m<=8)?2:3;
    bins[b].push(t); if(h!=null) hb.push(h);
  }
  const avg=a=>a.length? a.reduce((x,y)=>x+y,0)/a.length : null;
  return { tSummer:Math.round(avg(bins[0])), tAutumn:Math.round(avg(bins[1])),
           tWinter:Math.round(avg(bins[2])), tSpring:Math.round(avg(bins[3])),
           humidity:Math.round((avg(hb)||60))/100, tz:j.timezone||'' };
}

/* ═══════════════════════════════════════════════════════════════════
   §2b-4  ESTIMATE — domain-split AI passes
   One shot across 38 unrelated fields produces shallow answers on all of
   them. Four focused passes, each with its own web-search brief, let the
   model actually go and look at rent evidence, wage awards, tariff
   schedules and hazard mapping separately. Each pass returns only its own
   keys, plus the sources it used and its own confidence.
   ═══════════════════════════════════════════════════════════════════ */
const SC_DOMAINS=[
  { id:'prop', title:'property & 3PL market',
    keys:['landPrice','leaseRate','outgoings','incentivePct','vacancyRate','storageBench','pickBench','parcelDensity','b2bIndex'],
    ask:'Industrial land sale values per m², prime warehouse face rents and outgoings, typical lease incentive/abatement in year one, current industrial vacancy rate in this submarket, prevailing 3PL storage and pick-pack rate cards, and the e-commerce parcel and B2B freight demand intensity of this catchment.' },
  { id:'labour', title:'labour & utilities',
    keys:['wage','forkPrem','supSalary','laborAvail','unionLoad','powerTariff','gridOutage','waterRate','gasRate','solarIdx'],
    ask:'Warehouse operative market/award hourly wage, forklift-licence premium, warehouse supervisor salary, labour availability and turnover in this catchment, union density and penalty-rate loading, and commercial electricity, water and gas tariffs, grid reliability, and solar yield.' },
  { id:'reg', title:'regulation & access',
    keys:['approvalWeeks','propTax','payrollTax','govtIncentive','kmPort','kmAir','kmRail','kmMwy','congestMin'],
    extra:'  "zoning": <string>, "curfew": <boolean>, "hazmatOK": <boolean>, "coldOK": <boolean>,',
    ask:'Planning/council approval lead time for an industrial warehouse fitout, property tax rate, payroll tax rate and threshold, available state or national logistics investment incentives, the zoning of this parcel, any night curfew on truck movements, and whether dangerous goods and cold-chain uses are permissible.' },
  { id:'risk', title:'natural hazard',
    keys:['riskCyclone','riskFlood','riskSeismic','riskBushfire'],
    ask:'Cyclone/severe-storm exposure, riverine and flash-flood exposure, seismic hazard, and bushfire/wildfire exposure at this exact parcel — cite published hazard mapping or insurance catastrophe zoning where you can.' }
];
function scFieldSpec(keys){
  return LOC_FIELDS.filter(f=>keys.indexOf(f[0])>-1)
    .map(([k,lbl,unit,mn,mx])=>'  "'+k+'": <number>   // '+lbl+', unit: '+unit+', must be within '+mn+'..'+mx)
    .join('\n');
}
function scWhere(geo,place){
  return geo
    ? place+' — lat '+geo.lat.toFixed(4)+', lon '+geo.lon.toFixed(4)
      +(geo.cc?', country '+geo.cc:'')+(geo.admin?', '+geo.admin:'')+(geo.city?', '+geo.city:'')
    : '"'+place+'" — identify exactly where this is first';
}
async function scAiDomain(dom, place, geo, known, web){
  const keys=dom.keys.filter(k=>!(k in known));
  if(!keys.length && !dom.extra) return { values:{}, skipped:true };
  const prompt='You are a warehouse site-selection analyst valuing an industrial/logistics site at:\n'
    +scWhere(geo,place)+'\n\n'
    +'FOCUS OF THIS PASS — '+dom.title+'.\n'+dom.ask+'\n\n'
    +(Object.keys(known).length? 'ALREADY ESTABLISHED (do not contradict, do not re-output): '
        +Object.keys(known).map(k=>k+'='+known[k]).join(', ')+'\n\n' : '')
    +'All money in USD equivalents. Distances are road km from this exact point to the NEAREST facility of that type. '
    +'Risk indices 0..1. Never omit a key — where evidence is thin, give the best defensible regional estimate and say so in "note".\n\n'
    +'Respond with ONLY a raw JSON object, no markdown fences and no prose:\n{\n'
    +'  "values": {\n'+scFieldSpec(keys)+'\n'+(dom.extra?dom.extra+'\n':'')+'  },\n'
    +'  "confidence": <number 0..1>,\n'
    +'  "sources": [<up to 4 short strings naming what you actually relied on>],\n'
    +'  "note": <string, max 25 words>\n}';
  const txt=await llmCall('analyst', prompt, {max:1400, temp:0.2, timeout:90000, web:web});
  const a=txt.indexOf('{'), b=txt.lastIndexOf('}');
  if(a<0||b<a) throw new Error(dom.id+': no JSON returned');
  const o=JSON.parse(txt.slice(a,b+1).replace(/```json|```/g,''));
  const flat=Object.assign({}, o.values||{});
  for(const k of ['zoning','curfew','hazmatOK','coldOK']) if(o[k]!==undefined && flat[k]===undefined) flat[k]=o[k];
  return { values:flat, confidence:(typeof o.confidence==='number'?o.confidence:0.6),
           sources:o.sources||[], note:o.note||'', skipped:false };
}

/* single-shot fallback: no analyst model wired, or deep mode declined */
async function scAiEstimate(place,geo,clim){
  const fields=LOC_FIELDS.filter(f=>!CLIMATE_KEYS.includes(f[0]));
  let spec=fields.map(([k,lbl,unit,mn,mx])=>'  "'+k+'": <number>   // '+lbl+', unit: '+unit+', must be within '+mn+'..'+mx).join('\n');
  if(!geo) spec+='\n  "lat": <number>, "lon": <number>, "cc": <string>,   // resolve the address/place yourself; cc = ISO-2 country code';
  if(!clim) spec+='\n  "tSummer": <number>, "tAutumn": <number>, "tWinter": <number>, "tSpring": <number>, "humidity": <number>, "tz": <string>,\n  // °C means: tSummer=Dec-Feb, tAutumn=Mar-May, tWinter=Jun-Aug, tSpring=Sep-Nov (calendar months, NOT local season names); humidity 0..1; tz = IANA timezone';
  const where = geo? scWhere(geo,place) : '"'+place+'" — first identify exactly where this address/place is (use web search if needed)';
  const climLine = clim? 'Known measured climate (context only, do NOT output): DJF '+clim.tSummer+'°C, MAM '+clim.tAutumn+'°C, JJA '+clim.tWinter+'°C, SON '+clim.tSpring+'°C, humidity '+clim.humidity+'.' : '';
  const prompt='You are a warehouse site-selection analyst. Estimate a realistic profile for an industrial/logistics warehouse site at: '+where+'.\n'
    +climLine+'\n'
    +'Use web search where helpful (industrial lease rates, warehouse wages, payroll/property tax, port distances). All money in USD equivalents. Distance fields = road km from this point to the NEAREST facility of that type. Risk indices 0..1. Never omit a key — if unsure, give the best defensible regional estimate.\n'
    +'Respond with ONLY a raw JSON object (no markdown fences, no prose) with exactly these keys:\n{\n'
    +spec+',\n'
    +'  "curfew": <boolean>, "hazmatOK": <boolean>, "coldOK": <boolean>,\n'
    +'  "zoning": <string>, "tag": <string>, "note": <string>   // tag ≤6 words; note ≤25 words on confidence\n}';
  let txt;
  if(typeof LLM!=='undefined' && LLM.on && typeof llmReady==='function' && llmReady('analyst')){
    const sl=llmSlot('analyst');
    const web=((LLM_PROV[sl.provider]||{}).kind==='anthropic');
    txt=await llmCall('analyst', prompt+(web?'':'\nYou have no web access here — rely on your own knowledge of regional industrial property, wage and tax markets, and say so in "note".'),
      {max:1600, temp:0.2, timeout:90000, web:web});
  }else{
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ model:'claude-sonnet-4-6', max_tokens:1000,
        messages:[{role:'user',content:prompt}],
        tools:[{type:'web_search_20250305',name:'web_search'}] })});
    if(!r.ok) throw new Error('AI estimator unavailable ('+r.status+')');
    const data=await r.json();
    txt=(data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');
  }
  const a=txt.indexOf('{'), b=txt.lastIndexOf('}');
  if(a<0||b<a) throw new Error('AI returned no JSON');
  return JSON.parse(txt.slice(a,b+1).replace(/```json|```/g,''));
}

/* ═══════════════════════════════════════════════════════════════════
   §2b-5  MERGE — later layers win, and every field records where it
   came from. Nothing is silently guessed: a field the pipeline could
   not resolve stays visibly on the global median baseline.
   ═══════════════════════════════════════════════════════════════════ */
const SC_SRC = {
  measured:{ lbl:'MEASURED', cls:'sc-measured', hint:'Google Maps road distance / traffic' },
  climate: { lbl:'CLIMATE',  cls:'sc-climate',  hint:'Open-Meteo ERA5, last 12 months' },
  ai:      { lbl:'AI',       cls:'sc-ai',       hint:'model estimate with web research' },
  baseline:{ lbl:'BASELINE', cls:'sc-base',     hint:'global median of the eight presets — unresolved' },
};
function scMerge(layers){
  const out={}, prov={};
  for(const L of layers){
    const v=L.values||{};
    for(const k in v){
      const val=v[k];
      if(val==null) continue;
      if(typeof val==='number' && !isFinite(val)) continue;
      out[k]=val;
      prov[k]={ src:L.src, conf:L.conf==null?null:L.conf, detail:(L.detail&&L.detail[k])||L.label||'' };
    }
  }
  return { values:out, prov };
}
function scStatus(msg,cls){ S.scout=Object.assign(S.scout||{},{status:msg,statusCls:cls||'text-mut'});
  const e=el('scoutStatus'); if(e){ e.textContent=msg; e.className='mono text-[11px] '+(cls||'text-mut'); } }
function scLog(line){
  const s=S.scout||{}; s.log=(s.log||[]).concat([line]); S.scout=s;
  const box=el('scoutLog');
  if(box){ const d=document.createElement('div'); d.textContent=line; box.appendChild(d);
           box.scrollTop=box.scrollHeight; box.classList.remove('hidden'); }
}

window.scoutLocation=async function(){
  const q=(S.scout&&S.scout.q||'').trim(); if(!q){ scStatus('Type a place first','text-warn'); return; }
  const btn=el('scoutBtn'); if(btn){btn.disabled=true;btn.textContent='SCOUTING…';}
  const b0=el('scoutAc'); if(b0) b0.classList.add('hidden');
  let deep = SC_DEEP && typeof LLM!=='undefined' && LLM.on && llmReady('analyst');
  /* deep scout is four research passes — metered when hosted, free when
     the operator is burning their own key. */
  if(deep && typeof MTR!=='undefined' && mtrOn() && !mtrCan('deepScout')){
    deep=false;
    merSafeToast('Deep scout is a licensed pass — running the single-shot estimate instead. '
      +'Four-domain research unlocks on Studio.');
  }
  S.scout=Object.assign(S.scout||{},{done:false,err:null,log:[],prov:null,sources:[]});
  const lg=el('scoutLog'); if(lg){ lg.innerHTML=''; lg.classList.remove('hidden'); }
  const gmapWanted=gmapOn();

  try{
    /* 1 ── locate */
    scStatus('▸ Locating "'+q+'"…');
    let geo=null;
    try{ geo=await scResolve(S.scout.pick||null, q); }catch(e){ scLog('· locate: '+e.message); }
    if(geo) scLog('· located via '+(geo.src||'geocoder')+': '+geo.label+'  ['+geo.lat.toFixed(4)+', '+geo.lon.toFixed(4)+']');
    else scLog('· no geocoder reachable — the AI will locate it');
    if(gmapWanted && (!geo||geo.src!=='google') && GMAP.err) scLog('· Google Maps unavailable: '+GMAP.err);

    /* 2 ── measure access with Google */
    let meas={values:{},detail:{}};
    if(geo && gmapOn()){
      scStatus('▸ Measuring road distances to port, airport, rail and motorway…');
      try{ meas=await scMeasureAccess(geo,scLog); }
      catch(e){ scLog('· measurement unavailable: '+String((e&&e.message)||e)); }
    }

    /* 3 ── measured climate */
    let clim=null;
    if(geo){
      scStatus('▸ Pulling 12 months of climate for '+geo.lat.toFixed(2)+', '+geo.lon.toFixed(2)+'…');
      try{ clim=await scClimate(geo.lat,geo.lon); scLog('· climate measured: summer '+clim.tSummer+'°C, winter '+clim.tWinter+'°C, humidity '+Math.round(clim.humidity*100)+'%'); }
      catch(e){ clim=null; scLog('· climate service unreachable — the AI will estimate it'); }
    }

    /* 4 ── AI estimation */
    const known=Object.assign({}, meas.values);
    if(clim) for(const k of CLIMATE_KEYS) known[k]=clim[k];
    let aiLayers=[], aiOk=true, note='', tag='', sources=[], est={};

    if(deep){
      const sl=llmSlot('analyst');
      const web=((LLM_PROV[sl.provider]||{}).kind==='anthropic');
      scStatus('▸ Deep scout — '+SC_DOMAINS.length+' focused research passes…');
      const results=await Promise.all(SC_DOMAINS.map(async d=>{
        try{
          scLog('· pass "'+d.title+'" running…');
          const r=await scAiDomain(d,(geo&&geo.label)||q,geo,known,web);
          scLog('· pass "'+d.title+'" → '+Object.keys(r.values||{}).length+' fields, confidence '
                +(r.confidence!=null?Math.round(r.confidence*100)+'%':'n/a')
                +(r.sources&&r.sources.length?' · '+r.sources.slice(0,2).join('; '):''));
          return {d,r};
        }catch(e){ scLog('· pass "'+d.title+'" failed: '+String((e&&e.message)||e)); return {d,r:null}; }
      }));
      for(const {d,r} of results){
        if(!r) continue;
        aiLayers.push({ src:'ai', conf:r.confidence, label:d.title, values:r.values });
        if(r.note) note+=(note?' ':'')+r.note;
        (r.sources||[]).forEach(s=>{ if(sources.indexOf(s)<0) sources.push(s); });
      }
      if(!aiLayers.length) aiOk=false;
      if(!aiOk) scLog('· every deep pass failed — falling back to a single-shot estimate');
    }
    if(!deep || !aiOk){
      scStatus(geo? '▸ AI estimating economics, labor, access & regulation…'
                  : '▸ Location services blocked here — AI locating & profiling the site…');
      try{
        est=await scAiEstimate(geo?(geo.label||q):q, geo, clim);
        aiOk=true; note=est.note||''; tag=est.tag||'';
        aiLayers=[{ src:'ai', conf:0.55, label:'single-shot estimate', values:est }];
        scLog('· single-shot estimate returned '+Object.keys(est).length+' fields');
      }catch(e){ aiOk=false; scLog('· AI estimator unreachable: '+String((e&&e.message)||e)); }
    }
    if(!aiOk && !geo) throw new Error('Could not reach location services or the AI — check your connection and try again');

    /* the AI may have located the site itself when geocoders were blocked */
    if(!geo && est && est.lat!=null){
      geo={lat:+est.lat,lon:+est.lon,cc:(est.cc||'—'),label:q,src:'ai'};
      scLog('· AI placed the site at '+geo.lat.toFixed(3)+', '+geo.lon.toFixed(3));
      if(!clim){ try{ clim=await scClimate(geo.lat,geo.lon); }catch(e){} }
    }

    /* 5 ── merge, lowest precedence first */
    const layers=[{ src:'baseline', conf:null, label:'global median of the eight presets', values:medianBaseline() }]
      .concat(aiLayers)
      .concat(clim? [{ src:'climate', conf:1, label:'Open-Meteo ERA5', values:{
        tSummer:clim.tSummer,tAutumn:clim.tAutumn,tWinter:clim.tWinter,tSpring:clim.tSpring,humidity:clim.humidity } }] : [])
      .concat([{ src:'measured', conf:1, label:'Google Maps', values:meas.values, detail:meas.detail }]);
    const merged=scMerge(layers);

    const shortName=q.split(',').slice(0,2).map(s=>s.trim()).join(' — ');
    const loc=clampLoc(mkLoc(Object.assign({}, merged.values, {
      name:shortName, country:(geo&&geo.cc)||'—', tag:(tag||'scouted site'),
      lat:geo?geo.lat:null, lon:geo?geo.lon:null,
      zoning:merged.values.zoning||'Industrial', curfew:!!merged.values.curfew,
      hazmatOK:merged.values.hazmatOK!==false, coldOK:merged.values.coldOK!==false })));

    const resolved=LOC_FIELDS.filter(f=>merged.prov[f[0]] && merged.prov[f[0]].src!=='baseline').length;
    scLog('· merged: '+resolved+'/'+LOC_FIELDS.length+' fields resolved from real sources');

    S.loc=loc; S.custom=true; S.locKey=null; S.startMonth=new Date().getMonth();
    S.scout=Object.assign(S.scout,{ done:true, aiOk, deep, prov:merged.prov, sources,
      resolved, total:LOC_FIELDS.length,
      climSrc: clim?'measured':'estimated',
      geoSrc: (geo&&geo.src)||'none',
      measured: Object.keys(meas.values).length,
      place:(geo&&geo.label)||q, lat:geo?geo.lat:null, lon:geo?geo.lon:null,
      tz:(clim&&clim.tz)||est.tz||'',
      note: aiOk? note : 'AI estimator unreachable — unresolved fields sit on a global median baseline. Edit them below.'});
    scStatus('✓ Site profile ready — '+resolved+'/'+LOC_FIELDS.length+' fields from real sources','text-ok');
    uiChanged(); if(S.tab==='setup') renderSetup();
  }catch(e){
    S.scout=Object.assign(S.scout||{},{done:false,err:e.message});
    scStatus('✗ '+e.message,'text-warn');
    if(S.tab==='setup') renderSetup();
  }finally{ const b2=el('scoutBtn'); if(b2){b2.disabled=false;b2.textContent='SCOUT SITE';} }
};
