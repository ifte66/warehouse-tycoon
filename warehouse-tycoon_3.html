/* ═══════════════════════════════════════════════════════════════════
   §6 DERIVED MODEL — recompute() runs on every input change.
   All penalties (PEN), capacity, CapEx, OpEx rates trace to inputs.
   ═══════════════════════════════════════════════════════════════════ */
let D = {};      // derived snapshot
function mixShares(){ const t=Object.values(S.mix).reduce((a,b)=>a+b,0)||1; const o={}; for(const k in S.mix) if(S.mix[k]>0) o[k]=S.mix[k]/t; return o; }
function mixBlend(fn){ const sh=mixShares(); let v=0; for(const k in sh) v+=sh[k]*fn(VERTICALS[k],k); return v; }
function vertLocked(k){
  const v=VERTICALS[k], dd=S.dd, L=S.loc, reasons=[];
  if(v.needsESFR && dd.sprinkler!=='ESFR') reasons.push('needs ESFR sprinklers');
  if(v.needsCold && !L.coldOK) reasons.push('cold store not permitted (zoning)');
  if(v.needsFood && !dd.foodGrade) reasons.push('needs food-grade certification');
  if(v.needsGDP && !dd.gdpCert) reasons.push('needs TGA/GDP capability');
  if(v.needsDG && (!dd.dgLicense || !L.hazmatOK)) reasons.push('needs DG license + hazmat zoning');
  return reasons;
}
function recompute(){
  const L=S.loc, dd=S.dd, sh=mixShares(), area=S.site.areaM2;
  // remove locked verticals from active mix (visible in UI as locked)
  for(const k in S.mix) if(vertLocked(k).length) delete sh[k];
  const shT=Object.values(sh).reduce((a,b)=>a+b,0)||1; for(const k in sh) sh[k]/=shT;
  D.shares = sh;

  // ── DD scoring (needs reqKva → 2-pass)
  const coldShare=(sh.chilled||0)+(sh.frozen||0);
  D.reqKva = area*0.012 + area*coldShare*0.09 + (S.autom.agv*6) + (S.autom.sortation?140:0) + (S.autom.conveyor?60:0);
  let wSum=0, sSum=0; D.ddScores={};
  DD_ITEMS.forEach(i=>{ const s=clamp(i.score(dd[i.k],D),0,1); D.ddScores[i.k]=s; wSum+=i.w; sSum+=i.w*s; });
  D.ddScore = Math.round(100*sSum/wSum);

  // ── Penalties  (§2: missing items impose concrete effects)
  const P = {};
  P.maxLevels = Math.max(1, Math.floor((dd.clearHeight-1.5)/1.7));
  if(dd.sprinkler!=='ESFR') P.maxLevels = Math.min(P.maxLevels, 3);           // 6 m cap
  P.unloadMult   = (dd.levellers?1:1.3) * (dd.courtDepth<32?1.4:1);
  P.arrivalVar   = dd.gatehouse?1:1.5;
  P.shrinkAdd    = (dd.gatehouse?0:.002) + (dd.cctv?0:.003);
  P.pickMult     = (dd.lux<300?0.93:1) * (dd.dockWifi?1:0.95) * (dd.fiber?1:0.96);
  P.vnaOk        = dd.flatness==='FM1 / superflat';
  P.linehaulMult = dd.bDouble?1:1.18;
  P.absentAdd    = ({'Far':.03,'Moderate':.01,'Near':0})[dd.ptProx] + (dd.amenities?0:.01) + (dd.carPark<S_totalHeads()*0.7?.005:0);
  P.wageMult     = (dd.ptProx==='Far'?1.04:1);
  P.powerShort   = dd.supplyKva < D.reqKva && !S.autom.substation;
  P.canOccupy    = dd.egress && dd.occCert && dd.zoningOk;
  P.outageHrs    = dd.genset?0:L.gridOutage;
  P.roofRisk     = ({'Poor':.004,'Fair':.001,'Good':0})[dd.roof];             // stock damage %/mo
  D.pen = P;

  // ── Capacity
  const rackable = area * 0.55;                                               // aisles/staging/offices excluded
  const fpBlend = mixBlend(v=>v.footprint) || 1.15;
  D.palletCap = Math.floor(rackable/(fpBlend*2.2)) * P.maxLevels;   // footprint × aisle-share factor
  // demand
  const demandIdx = L.parcelDensity*(sh.ecom||0)*1.6 + L.b2bIndex*(1-(sh.ecom||0));
  D.baseOrders = S.site.targetOrders * demandIdx * (1 - L.vacancyRate/100*.8);
  D.basePallets = clamp(D.palletCap*0.78, 0, D.palletCap);                    // steady-state target fill

  // ── Rates (blended, all from location benchmarks × vertical multipliers)
  D.storRate = L.storageBench * (Object.entries(sh).reduce((a,[k,s])=>a+s*VERTICALS[k].storMult,0)||1);
  D.pickFee  = L.pickBench   * (Object.entries(sh).reduce((a,[k,s])=>a+s*VERTICALS[k].handMult,0)||1);
  if(sh.fmcg && !dd.foodGrade) D.storRate*= (1 - .05*sh.fmcg);
  D.picksPerOrder = mixBlend(v=>v.picks)||6;

  // ── Linehaul $/pallet from access distances (§1)
  D.linehaulIn  = (2.1 + L.kmPort*0.011 + L.kmRail*0.04 + L.kmMwy*0.35) * P.linehaulMult;
  D.linehaulOut = (1.6 + L.kmMwy*0.4 + L.kmAir*0.008) * P.linehaulMult;
  D.truckTurnVar = 1 + L.congestMin/60*.8;

  // ── CapEx  (§5)
  const C = {};
  C.landOrEntry = S.site.tenure==='buy' ? L.landPrice*area*1.45 : 0;          // land + build premium if buying
  C.fitout   = area * (55 + mixBlend(v=>v.compCapexM2));
  C.racking  = D.palletCap * (Object.entries(sh).reduce((a,[k,s])=>a+s*MODE_RACK_COST[VERTICALS[k].modeKey],0)||165);
  C.equipment= 42000*Math.ceil(S.staff.forklift*0.8) + S.autom.agv*68000 + (S.autom.conveyor?480000:0) + (S.autom.sortation?1350000:0) + (S.autom.solar?area*38*L.solarIdx:0) + (S.autom.substation?520000:0) + S.autom.extraDocks*185000 + (S.autom.slotting?35000:0);
  C.compliance = (dd.contam==='Flagged'?450000:0) + (dd.permits==='Pending'? L.approvalWeeks*week$():0) + (dd.roof==='Poor'?area*12:0);
  C.total = C.landOrEntry + C.fitout + C.racking + C.equipment + C.compliance - L.govtIncentive*1000;
  D.capex = C;
  function week$(){ return (L.leaseRate*area/52)*0.6; }                       // holding cost of delay

  // ── Debt package (§5)
  const debt = C.total * S.site.debtLVR/100;
  const r = S.site.debtRate/100/12, n = S.site.debtTermYr*12;
  D.debt = debt; D.debtSvcMo = debt>0 ? debt*r/(1-Math.pow(1+r,-n)) : 0;
  D.equity = C.total - debt;

  // ── OpEx rates (per day unless noted)
  const hrs=8, days=1;
  const wage = L.wage*P.wageMult, prem=L.forkPrem, load=L.unionLoad*(1+L.payrollTax/100);
  const heads=S.staff;
  D.laborDay = (
    (heads.receiving+heads.putaway+heads.picking+heads.packing+heads.dispatch+heads.qc+heads.cleaning)*wage*hrs*load +
    (heads.forklift)*(wage+prem)*hrs*load +
    (heads.maintenance)*(wage+2)*hrs*load +
    (heads.security)*(wage+1)*hrs*load*1.4 +                                  // 24/7 coverage
    (heads.supervisor)*(L.supSalary*1000/260) +
    (heads.admin)*(wage*0.95)*hrs*load
  );
  // energy: lighting + HVAC(climate) + refrigeration(vertical energyInt × volume)
  const vol = area*Math.min(dd.clearHeight,12);
  D.refrigKwhDay = Object.entries(sh).reduce((a,[k,s])=>a+s*VERTICALS[k].energyInt*vol,0);
  D.lightKwhDay  = area*0.011*(dd.lux/350)*16;
  D.energyDay = 0; // finalized per-tick with season/heatwave; base stored:
  D.powerTariffEff = L.powerTariff * (S.autom.solar? (1-0.32*L.solarIdx):1);
  D.leaseDay = S.site.tenure==='lease' ? (L.leaseRate+L.outgoings)*area/365 * (1-L.incentivePct/100*0.2) : (L.outgoings*area/365 + L.landPrice*area*L.propTax/100/365);
  D.maintDay = (C.racking+C.equipment)*0.045/365 + area*0.9/365;
  // insurance: value at risk × base × climate multiplier × security credit
  const invValue = D.basePallets * mixBlend(v=>v.valueDensity);
  const riskMult = 1 + L.riskCyclone*.9 + L.riskFlood*.6 + L.riskSeismic*.3 + L.riskBushfire*.3;
  const secCred = (dd.cctv?0.94:1)*(dd.fencing?0.97:1)*(dd.hydrants?0.95:1)*(dd.insQuote?1:1.1)*(S.autom.insBundle?0.86:1);
  D.insuranceYr = (invValue*0.0045 + area*4.2) * riskMult * secCred;
  D.securityDay = heads.security>0? 0 : 220;                                  // contract patrol if unstaffed
  D.adminDay = 380 + area*0.02;
  D.shrinkRate = mixBlend(v=>v.shrink) + P.shrinkAdd;
  D.invValue = invValue;
  D.dockCount = dd.dockDoors + S.autom.extraDocks;
  updateHeader();
}
function S_totalHeads(){ return Object.values(S.staff).reduce((a,b)=>a+b,0); }


/* ═══════════════════════════════════════════════════════════════════
   §6b SITE ENVIRONMENT — the floor derives from where the site IS
   Latitude and calendar day give real solar geometry, so day length,
   sun angle, dusk and shadow direction are the site's own, not a
   generic cosine. Temperature and humidity give a biome, which drives
   ground colour, vegetation and whether precipitation falls as snow.
   Everything here is a pure function of S.loc + the clock: same site,
   same day, same result. No agent writes to it.
   ═══════════════════════════════════════════════════════════════════ */
const ENV = { fx: !/[?&]nofx=1/.test(location.search) };
const DEG = Math.PI/180;

function siteLat(){ const v=S.loc.lat; return (typeof v==='number'&&isFinite(v))? clamp(v,-89.5,89.5) : -37.81; }
function dayOfYear(){
  const m=(typeof SIM.month==='number'? SIM.month : (S.startMonth||0));
  const d=((SIM.day-1)%30);
  return clamp(Math.round(((m*30+d)/360)*365)+1, 1, 365);
}
/* Cooper's declination + the standard hour-angle solution. Clock noon is
   treated as solar noon: the equation of time is worth ±15 min, which is
   below the resolution anything on this floor reacts to. */
function solarEnv(){
  const lat=siteLat()*DEG, n=dayOfYear();
  const dec=23.44*DEG*Math.sin(2*Math.PI*(284+n)/365);
  const H=(hourOf()-12)*15*DEG;
  const sinEl=Math.sin(lat)*Math.sin(dec)+Math.cos(lat)*Math.cos(dec)*Math.cos(H);
  const el=Math.asin(clamp(sinEl,-1,1))/DEG;
  const cosAz=(Math.sin(dec)-Math.sin(lat)*sinEl)/((Math.cos(lat)*Math.cos(el*DEG))||1e-6);
  let az=Math.acos(clamp(cosAz,-1,1))/DEG;
  if(H>0) az=360-az;                       // degrees clockwise from north
  const cosH0=-Math.tan(lat)*Math.tan(dec);
  let dayLen, rise, set;
  if(cosH0<=-1){ dayLen=24; rise=0; set=24; }        // polar day
  else if(cosH0>=1){ dayLen=0; rise=12; set=12; }    // polar night
  else { const H0=Math.acos(cosH0)/DEG/15; dayLen=2*H0; rise=12-H0; set=12+H0; }
  // 1 at astronomical dark, 0 in full sun; civil twilight sits at el = −6°
  const nite=clamp(1-(el+6)/18,0,1);
  // dusk/dawn weight peaks as the sun crosses the horizon
  const dusk=clamp(1-Math.abs(el)/9,0,1);
  return { el, az, dayLen, rise, set, nite, dusk, up:el>0 };
}
function hemisphere(){ return siteLat()>=0 ? 'N' : 'S'; }
/* the four scouted temperatures are calendar quarters, not season names —
   label them by month so a northern site does not read "summer 4 °C" */
const QUARTER_MONTHS={ tSummer:'Dec–Feb', tAutumn:'Mar–May', tWinter:'Jun–Aug', tSpring:'Sep–Nov' };
function fieldLabel(k,lbl){
  if(!QUARTER_MONTHS[k]) return lbl;
  const north=hemisphere()==='N';
  const seasonN={ tSummer:'winter', tAutumn:'spring', tWinter:'summer', tSpring:'autumn' };
  const seasonS={ tSummer:'summer', tAutumn:'autumn', tWinter:'winter', tSpring:'spring' };
  return 'Ambient — '+QUARTER_MONTHS[k]+' ('+(north?seasonN[k]:seasonS[k])+')';
}

const BIOME={
  arid:     { name:'arid',      ground:'#D9CBAA', yard:'#CDBE9C', veg:'#9AA86B', vegN:4,  vegKind:'scrub', haze:[214,180,124] },
  tropical: { name:'tropical',  ground:'#B7C6A6', yard:'#AEBB9E', veg:'#3F8347', vegN:14, vegKind:'palm',  haze:[196,214,196] },
  temperate:{ name:'temperate', ground:'#C6CFDC', yard:'#BCC5D3', veg:'#7FA05E', vegN:9,  vegKind:'tree',  haze:[204,214,228] },
  cold:     { name:'cold',      ground:'#C7CED6', yard:'#BDC4CD', veg:'#65806A', vegN:6,  vegKind:'pine',  haze:[216,224,234] },
};
function meanTemp(){ const L=S.loc; return (L.tSummer+L.tAutumn+L.tWinter+L.tSpring)/4; }
function coldestQuarter(){ const L=S.loc; return Math.min(L.tSummer,L.tAutumn,L.tWinter,L.tSpring); }
function siteBiome(){
  const L=S.loc, t=meanTemp(), h=L.humidity;
  if(t<9 || coldestQuarter()<6) return BIOME.cold;
  if(h<0.52 && t>17) return BIOME.arid;
  if(h>0.68 && t>21) return BIOME.tropical;
  return BIOME.temperate;
}
/* ambient right now — the same expression the energy model uses */
function ambientNow(){
  return seasonTemp() + (SIM.weather.heat?6:0) + Math.sin((hourOf()-14)/24*2*Math.PI)*-4;
}
function snowSeason(){ return seasonTemp()<2; }
/* the tick runs up to 86,400 times a simulated day — sample the sun at
   five-minute resolution there and leave the fresh call to the renderer */
let _sunMemo={k:-1,v:null};
function solarEnvCached(){
  const k=Math.floor(SIM.t/300);
  if(_sunMemo.k!==k) _sunMemo={k:k, v:solarEnv()};
  return _sunMemo.v;
}
/* yard and dock penalties by weather. Snow costs more than rain: aprons
   need clearing and trailers need chaining before they move. */
function wxYard(){ return SIM.weather.snow?1.55 : SIM.weather.rain?1.25 : 1; }
function wxUnload(){ return SIM.weather.snow?1.35 : SIM.weather.rain?1.15 : 1; }
function wxLabel(){
  if(SIM.outage) return '⚡ OUTAGE';
  if(SIM.weather.snow) return '❄ snow';
  if(SIM.weather.smoke) return '🔥 smoke haze';
  if(SIM.weather.rain) return '🌧 rain';
  if(SIM.weather.heat) return '🔥 heatwave';
  return 'clear';
}

/* ═══════════════════════════════════════════════════════════════════
   §18 SITE & ENVELOPE GENERATOR — the brief becomes a building
   ───────────────────────────────────────────────────────────────────
   Everything a draughtsman would set out before drawing a single rack:
   lot, coverage, footprint, structural grid, roof, dock face, apron,
   parking, egress. Pure function of (S.site, S.dd, S.loc, D.dockCount).
   Same brief, same building, every time. No agent writes to it.

   AUTHORITY. This module owns geometry the way sim-core owns NPV. It
   produces metres and counts; the renderer consumes them; the model is
   allowed to describe them and never to author them.

   WHY IT IS NOT COSMETIC. siteGrid() used to guess a footprint from
   sqrt(area * 1.55). That constant is now a derived aspect ratio bounded
   by the one thing that actually governs a DC's plan — the dock face has
   to be long enough to carry the doors. A 40-door cross-dock cannot be
   the same shape as a 12-door regional shed, and now it is not.
   ═══════════════════════════════════════════════════════════════════ */
const BUILD = { id:'wt-2026.08.23-p1', part:'§18 site & envelope generator' };

/* Dimensions are industry-standard AU industrial. Where a range exists the
   nominal is the module a portal-frame fabricator quotes off the shelf. */
const GEO = {
  BAY_W_NOM:11.7, BAY_W_MIN:10.5, BAY_W_MAX:13.0,   // cross-fall / dock-face module
  BAY_D_NOM:23.4, BAY_D_MIN:20.0, BAY_D_MAX:26.0,   // portal span
  DOOR_PITCH:4.2, DOOR_W:3.0, DOOR_H:4.2, DOCK_END_MARGIN:6.0,
  APRON_SEMI:30, APRON_BDBL:35,                      // 19 m semi / 26 m B-double swing
  SETBACK_SIDE:5, SETBACK_REAR:6, CIRC_LANE:12,      // one-way heavy-vehicle loop
  COVER_PLANNING:0.50, COVER_MAX:0.55,
  PARK_WHSE_M2:300, PARK_OFFICE_M2:30,               // 1 space per, AU industrial norm
  OFFICE_PCT:0.03, OFFICE_MIN_M2:250,
  EGRESS_DTS:40, EGRESS_SPRINKLERED:60,              // deemed-to-satisfy vs concession
  HAUNCH:1.8, ROOF_PITCH_DEG:2, ESFR_MAX_H:13.7,
  CROSSDOCK_DOORS_PER_1000:1.2,
};

/* Snap a length to a whole number of bays without losing the length.
   The bay module flexes inside its range instead of the GFA moving —
   a real fabricator does exactly this rather than hand back 9% more shed
   than the brief asked for. */
function snapBays(len, nom, lo, hi){
  let n = Math.max(1, Math.round(len/nom));
  while(len/n > hi && n < 400) n++;
  while(len/n < lo && n > 1)   n--;
  return { n, bay: len/n };
}

/* AS 1170.2 wind region, inferred from the scouted cyclone risk. Carried
   as metadata now; it is what will drive the steel rate when structure
   reaches the cost model. */
function windRegion(){
  const c = S.loc.riskCyclone||0;
  return c<0.15?'A' : c<0.40?'B' : c<0.70?'C' : 'D';
}

let _siteMemo = { k:'', v:null };
function siteSpecKey(){
  const d=S.dd;
  return [S.site.areaM2, d.clearHeight, d.courtDepth, d.dockDoors, d.bDouble,
          d.sprinkler, S.autom.extraDocks, S.loc.lat, S.loc.riskCyclone].join('|');
}
function siteSpec(){
  const k = siteSpecKey();
  if(_siteMemo.k === k && _siteMemo.v) return _siteMemo.v;
  const v = computeSiteSpec();
  _siteMemo = { k, v };
  return v;
}
window.wtSite = siteSpec;   // console handle: wtSite() prints the setout

/* Read-only inspection handle. Top-level const does not reach window in a
   classic script, so the headless suites and the browser console have no
   way to see state that is otherwise correctly private. Getters only —
   nothing here can be assigned through, so this stays an observation
   window and never becomes a second, writable path into the model. */
window.WT = {
  get BUILD(){ return BUILD; },  get GEO(){ return GEO; },
  get S(){ return S; },          get D(){ return D; },
  get WORLD(){ return WORLD; },  get SIM(){ return SIM; },
  siteSpec, siteSetoutLines, siteGrid, snapBays, windRegion,
  get VIEW(){ return VIEW; }, get GEOH(){ return HATCH; },
  planLayout, plotScale, bubbleLetter, renderPlan, fitPlan,
};

function computeSiteSpec(){
  /* Warnings carry a tier. A hard warning is a thing that will not build or
     will not pass — it stops a drawing being issued. An advisory is a thing
     a developer chooses, not a thing that fails. Mixing the two is how a
     feasibility tool trains people to ignore it. */
  const dd=S.dd, warn=[];
  const hard=m=>warn.push({level:'hard', msg:m});
  const adv =m=>warn.push({level:'advisory', msg:m});
  const gfa   = Math.max(2000, S.site.areaM2||20000);
  const doors = Math.max(1, (dd.dockDoors||12) + (S.autom.extraDocks||0));

  /* ── aspect. Large sheds square up (span economics); small ones run long
     (racking wants length). A high door count per 1000 m² is a cross-dock
     brief, and cross-docks are long and shallow by definition. */
  const doorDensity = doors/(gfa/1000);
  const crossDock = doorDensity > GEO.CROSSDOCK_DOORS_PER_1000;
  let aspect = crossDock ? 2.60 : clamp(1.90 - gfa/120000, 1.30, 1.90);

  /* ── the dock face governs. Doors at 4.2 m centres plus an end margin
     each side is a hard minimum on the face length; if the shape implied
     by the aspect cannot carry them, the face wins and the shed gets
     longer and shallower. This is the constraint that makes the plan real. */
  let wM = Math.sqrt(gfa*aspect);
  const faceReq = doors*GEO.DOOR_PITCH + 2*GEO.DOCK_END_MARGIN;
  let faceGoverns = false;
  if(wM < faceReq){ wM = faceReq; faceGoverns = true; }
  let dM = gfa/wM;
  if(dM < 40){ hard(doors+' doors force a '+wM.toFixed(0)+' m face — only '
      +dM.toFixed(0)+' m deep. Consider a double-sided dock face.'); }
  aspect = wM/dM;

  /* ── structural grid */
  const bx = snapBays(wM, GEO.BAY_W_NOM, GEO.BAY_W_MIN, GEO.BAY_W_MAX);
  const by = snapBays(dM, GEO.BAY_D_NOM, GEO.BAY_D_MIN, GEO.BAY_D_MAX);

  /* ── roof. Haunch above clear height, then the pitch rise to the ridge. */
  const clearH = dd.clearHeight||10.5;
  const rise   = (wM/2)*Math.tan(GEO.ROOF_PITCH_DEG*Math.PI/180);
  const ridgeH = clearH + GEO.HAUNCH + rise;
  if(clearH > GEO.ESFR_MAX_H)
    hard('Clear height '+clearH.toFixed(1)+' m is above the '+GEO.ESFR_MAX_H
      +' m ceiling-only ESFR limit — in-rack sprinklers required.');
  else if(clearH > 12.2 && dd.sprinkler !== 'ESFR')
    adv('Above 12.2 m without ESFR — storage height will be capped by the sprinkler design.');

  /* ── apron. B-double is 26 m; it needs 35 m to swing off a 90° dock. */
  const apronReq = dd.bDouble ? GEO.APRON_BDBL : GEO.APRON_SEMI;
  const apron    = dd.courtDepth||36;
  if(apron < apronReq)
    hard('Truck court '+apron+' m is under the '+apronReq+' m a '
      +(dd.bDouble?'B-double':'semi')+' needs to square up to the dock.');

  /* ── lot. This is the minimum parcel the building and its yard occupy;
     the planning parcel is the larger one that satisfies site cover. */
  const lotW    = wM + 2*GEO.SETBACK_SIDE + GEO.CIRC_LANE;
  const lotD    = dM + apron + GEO.SETBACK_REAR;
  const lotMin  = lotW*lotD;
  const coverMin= gfa/lotMin;
  const lotPlan = gfa/GEO.COVER_PLANNING;
  if(coverMin > GEO.COVER_MAX)
    adv('Minimum parcel sits at '+(coverMin*100).toFixed(0)+'% site cover — over the '
      +(GEO.COVER_MAX*100).toFixed(0)+'% norm. Allow '+(lotPlan/1e4).toFixed(2)+' ha.');

  /* ── ancillary */
  const officeM2 = Math.max(GEO.OFFICE_MIN_M2, gfa*GEO.OFFICE_PCT);
  const spaces   = Math.ceil(gfa/GEO.PARK_WHSE_M2 + officeM2/GEO.PARK_OFFICE_M2);

  /* ── egress. Worst case is the point furthest from any perimeter exit:
     mid-depth, midway between two exits. Sprinklered sheds get the
     concession; past that it is a performance solution, not a fail. */
  const limit = dd.sprinkler==='ESFR' ? GEO.EGRESS_SPRINKLERED : GEO.EGRESS_DTS;
  const halfD = dM/2;
  let spacing, worst, egressOK;
  if(halfD >= limit){ spacing = 0; worst = halfD; egressOK = false; }
  else { spacing = 2*Math.sqrt(limit*limit - halfD*halfD);
         worst = limit; egressOK = true; }
  const exits = Math.max(2, spacing>0 ? Math.ceil(2*wM/spacing)+2 : 0);
  if(!egressOK)
    hard('Building depth '+dM.toFixed(0)+' m puts the centreline '+halfD.toFixed(0)
      +' m from any external wall, past the '+limit+' m limit — needs a performance solution.');

  /* ── orientation. Dock face turned away from the equator: the apron sits
     in the building's own shadow through the middle of the day, which is
     why AU sheds dock south and northern-hemisphere sheds dock north. */
  const lat = siteLat();
  const dockBearing = lat >= 0 ? 0 : 180;
  const longAxis    = 90;

  return {
    brief:{ gfaM2:gfa, doors, crossDock, faceGoverns },
    bldg:{ wM, dM, aspect, gfaM2:wM*dM, clearH, ridgeH, rise,
           pitchDeg:GEO.ROOF_PITCH_DEG, wallHM:clearH+GEO.HAUNCH },
    grid:{ colsX:bx.n+1, colsY:by.n+1, baysX:bx.n, baysY:by.n,
           bayW:bx.bay, bayD:by.bay, spanM:by.bay },
    dock:{ doors, pitchM:GEO.DOOR_PITCH, doorW:GEO.DOOR_W, doorH:GEO.DOOR_H,
           faceReqM:faceReq, faceM:wM, apronM:apron, apronReqM:apronReq,
           apronOK:apron>=apronReq, bearing:dockBearing },
    lot:{ wM:lotW, dM:lotD, minM2:lotMin, planningM2:lotPlan,
          coverMin, coverPlanning:GEO.COVER_PLANNING },
    ancillary:{ officeM2, carSpaces:spaces },
    egress:{ limitM:limit, worstM:worst, exitSpacingM:spacing, exits, ok:egressOK },
    site:{ lat, longAxis, windRegion:windRegion(), biome:siteBiome().name },
    cells:{ W: clamp(Math.round(wM/CELL_M),22,56), H: clamp(Math.round(dM/CELL_M),14,36) },
    warnings: warn,
    hardCount: warn.filter(x=>x.level==='hard').length,
    issuable: warn.every(x=>x.level!=='hard'),
  };
}

/* Human-readable setout — used by the legend now, by the title block in Part 2. */
function siteSetoutLines(){
  const s=siteSpec(), b=s.bldg, g=s.grid;
  return [
    ['Footprint',  b.wM.toFixed(1)+' × '+b.dM.toFixed(1)+' m'],
    ['GFA',        Math.round(b.gfaM2).toLocaleString()+' m²  ·  '+b.aspect.toFixed(2)+':1 (W:D)'],
    ['Grid',       g.baysX+' × '+g.baysY+' bays @ '+g.bayW.toFixed(2)+' × '+g.bayD.toFixed(2)+' m'],
    ['Clear / ridge', b.clearH.toFixed(1)+' m / '+b.ridgeH.toFixed(1)+' m'],
    ['Dock face',  s.dock.doors+' doors @ '+s.dock.pitchM+' m  ('+s.dock.faceReqM.toFixed(1)+' m req)'],
    ['Apron',      s.dock.apronM+' m'+(s.dock.apronOK?'':' ⚠ '+s.dock.apronReqM+' m req')],
    ['Min lot',    (s.lot.minM2/1e4).toFixed(2)+' ha @ '+(s.lot.coverMin*100).toFixed(0)+'% cover'],
    ['Car park',   s.ancillary.carSpaces+' spaces'],
    ['Wind region', s.site.windRegion+'  ·  egress '+(s.egress.ok?'OK':'perf. solution')],
  ];
}

/* ═══════════════════════════════════════════════════════════════════
   §19 PLAN VIEW — the same building, drawn instead of played
   ───────────────────────────────────────────────────────────────────
   Orthographic top-down at true scale, with the conventions a reviewer
   expects: lot boundary and setbacks, hatched hardstand and landscape,
   column grid with bubbles, chained dimension strings, north arrow,
   scale bar and a title block.

   This is a second VIEW of §18, never a second SOURCE. Every dimension
   printed here is read from siteSpec(); nothing is measured off the
   canvas and nothing is rounded for looks. If the plan and the ISO
   world ever disagree, the bug is in the renderer, not the geometry.

   The plot scale in the title block is deliberately independent of
   screen zoom — it is the scale this drawing would print at on A3, so
   it does not change when the operator pinches.
   ═══════════════════════════════════════════════════════════════════ */
const VIEW = { mode:'iso', base:1, saved:{} };
const HATCH = {
  hardstand:{ step:9,  ang:45,  col:'rgba(120,132,148,.34)', w:1 },
  landscape:{ step:11, ang:-45, col:'rgba(122,152,96,.42)',  w:1 },
  carpark:  { step:7,  ang:90,  col:'rgba(120,132,148,.26)', w:1 },
  apron:    { step:14, ang:45,  col:'rgba(120,132,148,.22)', w:1 },
};
const PAPER = { A3:{ w:420, h:297, margin:22 } };
const STD_SCALES = [50,100,150,200,250,500,750,1000,1250,2000,2500,5000];

/* Column bubbles run A..Z then AA.. — the same way a drawing sheet does. */
function bubbleLetter(i){
  let s=''; i=Math.floor(i);
  do { s = String.fromCharCode(65 + (i%26)) + s; i = Math.floor(i/26)-1; } while(i>=0);
  return s;
}
/* Scale this drawing would plot at on A3, snapped to a standard ratio. */
function plotScale(){
  const s=siteSpec(), pg=PAPER.A3, avail=Math.min(pg.w,pg.h*1.4)-2*pg.margin;
  const raw=(Math.max(s.lot.wM, s.lot.dM)*1000)/avail;
  return STD_SCALES.find(v=>v>=raw) || Math.ceil(raw/1000)*1000;
}
/* Where the building sits inside the lot: circulation lane to the west,
   apron to the dock side, setbacks elsewhere. Matches the lot arithmetic
   in §18 exactly — same constants, same order. */
function planLayout(){
  const s=siteSpec();
  return {
    s,
    lotW:s.lot.wM, lotD:s.lot.dM,
    bx:GEO.SETBACK_SIDE+GEO.CIRC_LANE, by:GEO.SETBACK_REAR,
    bw:s.bldg.wM, bd:s.bldg.dM, apron:s.dock.apronM,
  };
}
/* The drawing is not the whole canvas. Dimension strings and bubbles stack
   above and left of the lot, the title block owns the bottom-right, and the
   scale bar owns the bottom-left. Framing to the raw canvas pushed the
   outermost dimension off the top edge, so the margins are explicit. */
const PLAN_MARGIN = { left:132, right:56, top:126, bottom:84 };
function fitPlan(){
  const cv=el('simCanvas'); if(!cv) return;
  const r=cv.getBoundingClientRect(); if(!r.width||!r.height) return;
  const M=PLAN_MARGIN, L=planLayout();
  const availW=Math.max(60, r.width-M.left-M.right);
  const availH=Math.max(60, r.height-M.top-M.bottom);
  VIEW.base=Math.max(0.02, Math.min(availW/L.lotW, availH/L.lotD));
  CAM.z=1;
  /* Re-centre into the usable band rather than the geometric centre. */
  CAM.x=(M.left-M.right)/2; CAM.y=(M.top-M.bottom)/2;
}
window.setView=function(m){
  if(m===VIEW.mode) return;
  VIEW.saved[VIEW.mode]={x:CAM.x,y:CAM.y,z:CAM.z,touched:CAM.touched};
  VIEW.mode=m;
  const sv=VIEW.saved[m];
  if(sv){ CAM.x=sv.x; CAM.y=sv.y; CAM.z=sv.z; CAM.touched=sv.touched; }
  else if(m==='plan'){ CAM.touched=false; fitPlan(); }
  else { CAM.touched=false; fitCamera(); }
  try{ renderSimUi(); }catch(e){}
};

/* ── drafting primitives, all in screen px ── */
function hatchRect(ctx,x,y,w,h,spec){
  if(w<=0||h<=0) return;
  ctx.save(); ctx.beginPath(); ctx.rect(x,y,w,h); ctx.clip();
  ctx.strokeStyle=spec.col; ctx.lineWidth=spec.w;
  const a=spec.ang*Math.PI/180, dx=Math.cos(a), dy=Math.sin(a);
  const len=Math.hypot(w,h)*1.5, n=Math.ceil(len/spec.step);
  const cx=x+w/2, cy=y+h/2;
  for(let i=-n;i<=n;i++){
    const ox=-dy*i*spec.step, oy=dx*i*spec.step;
    ctx.beginPath();
    ctx.moveTo(cx+ox-dx*len/2, cy+oy-dy*len/2);
    ctx.lineTo(cx+ox+dx*len/2, cy+oy+dy*len/2);
    ctx.stroke();
  }
  ctx.restore();
}
/* A dimension string: witness lines, a run line, 45° ticks and the value.
   Horizontal when dir='h', vertical when dir='v'. */
function dimLine(ctx,x1,y1,x2,y2,label,dir,off){
  const ink='rgba(40,52,68,.78)';
  ctx.save(); ctx.strokeStyle=ink; ctx.fillStyle=ink; ctx.lineWidth=1;
  let ax,ay,bx,by;
  if(dir==='h'){ ay=by=y1+off; ax=x1; bx=x2;
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x1,ay+(off>0?4:-4));
    ctx.moveTo(x2,y2); ctx.lineTo(x2,by+(off>0?4:-4)); ctx.stroke(); }
  else { ax=bx=x1+off; ay=y1; by=y2;
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(ax+(off>0?4:-4),y1);
    ctx.moveTo(x2,y2); ctx.lineTo(bx+(off>0?4:-4),y2); ctx.stroke(); }
  ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx,by); ctx.stroke();
  const tick=3.2;
  [[ax,ay],[bx,by]].forEach(([px,py])=>{
    ctx.beginPath(); ctx.moveTo(px-tick,py+tick); ctx.lineTo(px+tick,py-tick); ctx.stroke(); });
  const mx=(ax+bx)/2, my=(ay+by)/2;
  ctx.font='600 9px ui-monospace,monospace'; ctx.textAlign='center'; ctx.textBaseline='middle';
  const tw=ctx.measureText(label).width+6;
  ctx.save(); ctx.translate(mx,my); if(dir==='v') ctx.rotate(-Math.PI/2);
  ctx.fillStyle='rgba(244,246,250,.92)'; ctx.fillRect(-tw/2,-6,tw,12);
  ctx.fillStyle=ink; ctx.fillText(label,0,0); ctx.restore();
  ctx.restore();
}
function northArrow(ctx,cx,cy,r,dockBearing){
  /* North is up when the dock faces south, down when it faces north —
     the drawing is oriented by the building, the arrow tells the truth. */
  const up = dockBearing===180;
  ctx.save(); ctx.translate(cx,cy); if(!up) ctx.rotate(Math.PI);
  ctx.strokeStyle='rgba(40,52,68,.8)'; ctx.lineWidth=1.2;
  ctx.beginPath(); ctx.arc(0,0,r,0,7); ctx.stroke();
  ctx.fillStyle='rgba(40,52,68,.85)';
  ctx.beginPath(); ctx.moveTo(0,-r*0.88); ctx.lineTo(r*0.34,r*0.5); ctx.lineTo(0,r*0.2);
  ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(0,-r*0.88); ctx.lineTo(-r*0.34,r*0.5); ctx.lineTo(0,r*0.2);
  ctx.closePath(); ctx.strokeStyle='rgba(40,52,68,.85)'; ctx.stroke();
  ctx.restore();
  ctx.save(); ctx.fillStyle='rgba(40,52,68,.85)';
  ctx.font='700 9px ui-monospace,monospace'; ctx.textAlign='center';
  ctx.fillText('N', cx, cy - r - 4); ctx.restore();
}
function scaleBar(ctx,x,y,pxPerM){
  const targets=[5,10,20,25,50,100,200,250,500];
  const want=110/pxPerM;
  const m=targets.find(v=>v>=want)||500, w=m*pxPerM;
  ctx.save(); ctx.strokeStyle='rgba(40,52,68,.8)'; ctx.lineWidth=1;
  ctx.strokeRect(x,y,w,5);
  ctx.fillStyle='rgba(40,52,68,.8)'; ctx.fillRect(x,y,w/2,5);
  ctx.font='600 8.5px ui-monospace,monospace'; ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.fillText('0',x,y+7); ctx.textAlign='right'; ctx.fillText(m+' m',x+w,y+7);
  ctx.restore();
}
function titleBlock(ctx,rw,rh){
  const s=siteSpec();
  const W=Math.min(302, rw-16), H=134, x=rw-W-10, y=rh-H-10;
  ctx.save();
  ctx.fillStyle='rgba(244,246,250,.96)'; ctx.strokeStyle='rgba(40,52,68,.85)'; ctx.lineWidth=1.4;
  ctx.fillRect(x,y,W,H); ctx.strokeRect(x,y,W,H);
  ctx.lineWidth=0.8; ctx.strokeStyle='rgba(40,52,68,.35)';
  ctx.beginPath(); ctx.moveTo(x,y+22); ctx.lineTo(x+W,y+22);
  ctx.moveTo(x,y+H-46); ctx.lineTo(x+W,y+H-46);
  ctx.moveTo(x,y+H-26); ctx.lineTo(x+W,y+H-26); ctx.stroke();
  ctx.fillStyle='#28323F'; ctx.textBaseline='middle'; ctx.textAlign='left';
  ctx.font='700 11px ui-monospace,monospace';
  ctx.fillText('MERIDIAN', x+8, y+11);
  ctx.font='600 7.5px ui-monospace,monospace'; ctx.fillStyle='#5D6C81'; ctx.textAlign='right';
  ctx.fillText('SITE PLAN — GENERAL ARRANGEMENT', x+W-8, y+11);
  const d=new Date();
  const rows=[
    ['PROJECT', S.loc.name],
    ['SITE',    (S.loc.tag||'—')],
    ['GFA',     Math.round(s.bldg.gfaM2).toLocaleString()+' m²   '+s.bldg.wM.toFixed(1)+' × '+s.bldg.dM.toFixed(1)+' m'],
    ['GRID',    s.grid.baysX+' × '+s.grid.baysY+' @ '+s.grid.bayW.toFixed(2)+' × '+s.grid.bayD.toFixed(2)+' m'],
    ['CLEAR',   s.bldg.clearH.toFixed(1)+' m   RIDGE '+s.bldg.ridgeH.toFixed(1)+' m   WIND '+s.site.windRegion],
  ];
  let ry=y+33;
  rows.forEach(([k,v])=>{
    ctx.textAlign='left'; ctx.font='600 8px ui-monospace,monospace'; ctx.fillStyle='#8593A6';
    ctx.fillText(k, x+8, ry);
    ctx.font='600 9px ui-monospace,monospace'; ctx.fillStyle='#28323F';
    let t=String(v); while(ctx.measureText(t).width > W-70 && t.length>4) t=t.slice(0,-2);
    ctx.fillText(t, x+54, ry);
    ry+=13;
  });
  /* Issuability is the §18 verdict, on its own strip because a reviewer
     looks for it before anything else on the sheet. */
  ctx.textAlign='left'; ctx.font='700 8.5px ui-monospace,monospace';
  ctx.fillStyle = s.issuable ? '#1E8E42' : '#C0392B';
  ctx.fillText(s.issuable?'● NO HARD CONSTRAINTS':'● '+s.hardCount+' HARD CONSTRAINT'+(s.hardCount>1?'S':''),
    x+8, y+H-36);
  if(!s.issuable){
    const first=s.warnings.find(t=>t.level==='hard');
    if(first){ ctx.textAlign='right'; ctx.font='600 7.5px ui-monospace,monospace';
      ctx.fillStyle='#C0392B';
      let t=first.msg; while(ctx.measureText(t).width > W-160 && t.length>8) t=t.slice(0,-2);
      ctx.fillText(t+(t!==first.msg?'…':''), x+W-8, y+H-36); }
  }
  const foot=[['SCALE','1:'+plotScale()+' @ A3'],
              ['DATE', d.toISOString().slice(0,10)],
              ['REV',  BUILD.id.split('-').pop().toUpperCase()]];
  let fx=x+8;
  foot.forEach(([k,v])=>{
    ctx.textAlign='left'; ctx.font='600 7px ui-monospace,monospace'; ctx.fillStyle='#8593A6';
    ctx.fillText(k, fx, y+H-19);
    ctx.font='700 9px ui-monospace,monospace'; ctx.fillStyle='#28323F';
    ctx.fillText(v, fx, y+H-8);
    fx += 104;
  });
  ctx.restore();
}

function renderPlan(){
  const cv=el('simCanvas'); if(!cv) return;
  const dpr=window.devicePixelRatio||1, rect=cv.getBoundingClientRect();
  if(cv.width!==rect.width*dpr){ cv.width=rect.width*dpr; cv.height=rect.height*dpr; }
  const ctx=cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle='#F4F6FA'; ctx.fillRect(0,0,rect.width,rect.height);
  if(!VIEW.base || !isFinite(VIEW.base) || VIEW.base<=0) fitPlan();

  const L=planLayout(), s=L.s;
  const p=VIEW.base*CAM.z;                       // px per metre
  const ox=rect.width/2+CAM.x-(L.lotW/2)*p;
  const oy=rect.height/2+CAM.y-(L.lotD/2)*p;
  const X=m=>ox+m*p, Y=m=>oy+m*p;
  const ink='rgba(40,52,68,';

  /* ── lot: landscape setback ring, then the hardstand inside it ── */
  hatchRect(ctx, X(0),Y(0), L.lotW*p, L.lotD*p, HATCH.landscape);
  ctx.strokeStyle=ink+'.9)'; ctx.lineWidth=2;
  ctx.strokeRect(X(0),Y(0),L.lotW*p,L.lotD*p);
  const inW=L.lotW-2*GEO.SETBACK_SIDE, inD=L.lotD-GEO.SETBACK_REAR;
  ctx.fillStyle='#E9EDF3';
  ctx.fillRect(X(GEO.SETBACK_SIDE),Y(GEO.SETBACK_REAR),inW*p,(inD-GEO.SETBACK_REAR)*p);
  hatchRect(ctx, X(GEO.SETBACK_SIDE),Y(GEO.SETBACK_REAR), inW*p,(inD-GEO.SETBACK_REAR)*p, HATCH.hardstand);
  ctx.setLineDash([6,4]); ctx.lineWidth=1; ctx.strokeStyle=ink+'.4)';
  ctx.strokeRect(X(GEO.SETBACK_SIDE),Y(GEO.SETBACK_REAR),inW*p,(inD-GEO.SETBACK_REAR)*p);
  ctx.setLineDash([]);

  /* ── apron in front of the dock face ── */
  const apY=L.by+L.bd;
  ctx.fillStyle='#DFE5ED';
  ctx.fillRect(X(L.bx),Y(apY),L.bw*p,L.apron*p);
  hatchRect(ctx, X(L.bx),Y(apY), L.bw*p, L.apron*p, HATCH.apron);
  ctx.strokeStyle=ink+'.35)'; ctx.lineWidth=1;
  ctx.strokeRect(X(L.bx),Y(apY),L.bw*p,L.apron*p);
  if(p>0.5){
    ctx.save(); ctx.fillStyle=ink+'.55)'; ctx.font='600 9px ui-monospace,monospace';
    ctx.textAlign='left'; ctx.textBaseline='top';
    ctx.fillText('TRUCK COURT  '+L.apron+' m', X(L.bx)+6, Y(apY)+5);
    ctx.restore();
  }

  /* ── circulation lane and car park ── */
  ctx.strokeStyle=ink+'.28)'; ctx.setLineDash([10,6]); ctx.lineWidth=1.2;
  ctx.beginPath();
  ctx.moveTo(X(GEO.SETBACK_SIDE+GEO.CIRC_LANE/2),Y(GEO.SETBACK_REAR));
  ctx.lineTo(X(GEO.SETBACK_SIDE+GEO.CIRC_LANE/2),Y(inD));
  ctx.stroke(); ctx.setLineDash([]);
  const cpH=Math.min(GEO.SETBACK_REAR+L.bd*0.42, L.bd*0.5);
  hatchRect(ctx, X(GEO.SETBACK_SIDE),Y(GEO.SETBACK_REAR), GEO.CIRC_LANE*p, cpH*p, HATCH.carpark);

  /* ── building floor slab. Painted before the internals, because the
     envelope is drawn as a stroked wall at the end rather than punched
     out of a filled rectangle — punching it out erased the fitout. ── */
  ctx.fillStyle='#FBFCFD';
  ctx.fillRect(X(L.bx),Y(L.by),L.bw*p,L.bd*p);

  /* ── zones, mapped from the sim grid into true metres ── */
  const cw=L.bw/(WORLD.W||36), ch=L.bd/(WORLD.H||21);
  const clipY=L.by+L.bd+L.apron;
  for(const z of (WORLD.zones||[])){
    const zx=L.bx+z.gx*cw, zy=L.by+z.gy*ch;
    const zw=z.w*cw, zh=Math.min(z.h*ch, Math.max(0,clipY-zy));
    if(zh<=0) continue;
    ctx.fillStyle=z.color; ctx.globalAlpha=0.45;
    ctx.fillRect(X(zx),Y(zy),zw*p,zh*p); ctx.globalAlpha=1;
    ctx.strokeStyle=ink+'.3)'; ctx.lineWidth=0.8;
    ctx.strokeRect(X(zx),Y(zy),zw*p,zh*p);
    if(p*zw>52 && p*zh>13){
      ctx.save(); ctx.fillStyle=ink+'.72)'; ctx.font='600 8px ui-monospace,monospace';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(z.name.toUpperCase(), X(zx+zw/2), Y(zy+zh/2)); ctx.restore();
    }
  }

  /* ── racking runs ── */
  for(const r of (WORLD.rackBlocks||[])){
    const rx=L.bx+r.gx*cw, rw=r.w*cw;
    for(let row=0; row<(r.rows||3); row++){
      const ry=L.by+(r.gy+row*4)*ch, rh=1.2*ch;
      ctx.fillStyle=r.color; ctx.globalAlpha=0.62;
      ctx.fillRect(X(rx),Y(ry),rw*p,rh*p); ctx.globalAlpha=1;
      ctx.strokeStyle=ink+'.45)'; ctx.lineWidth=0.7;
      ctx.strokeRect(X(rx),Y(ry),rw*p,rh*p);
    }
  }

  /* ── column grid: dash-dot lines, then bubbles ── */
  const g=s.grid;
  /* Bubble ring sits at a fixed pixel offset, not a metric one, so it keeps
     clear of the dimension stack at every zoom instead of colliding at some. */
  const bubOff=54;
  ctx.save(); ctx.strokeStyle='rgba(179,116,0,.34)'; ctx.lineWidth=0.7;
  ctx.setLineDash([9,3,2,3]);
  for(let i=0;i<=g.baysX;i++){ const mx=L.bx+i*g.bayW;
    ctx.beginPath(); ctx.moveTo(X(mx),Y(L.by)-bubOff); ctx.lineTo(X(mx),Y(L.by+L.bd)+10); ctx.stroke(); }
  for(let j=0;j<=g.baysY;j++){ const my=L.by+j*g.bayD;
    ctx.beginPath(); ctx.moveTo(X(L.bx)-bubOff,Y(my)); ctx.lineTo(X(L.bx+L.bw)+10,Y(my)); ctx.stroke(); }
  ctx.restore();

  /* ── building envelope: 300 mm wall, stroked at true thickness so the
     fitout underneath survives ── */
  const wall=0.3;
  ctx.save();
  ctx.strokeStyle='rgba(40,52,68,.88)';
  ctx.lineWidth=Math.max(1.6, wall*p);
  ctx.strokeRect(X(L.bx),Y(L.by),L.bw*p,L.bd*p);
  ctx.restore();

  /* ── columns ── */
  if(p>0.9){
    ctx.fillStyle='rgba(40,52,68,.86)';
    const cs=Math.max(2, 0.5*p);
    for(let i=0;i<=g.baysX;i++) for(let j=0;j<=g.baysY;j++){
      ctx.fillRect(X(L.bx+i*g.bayW)-cs/2, Y(L.by+j*g.bayD)-cs/2, cs, cs); }
  }

  /* ── dock doors on the dock face ── */
  const face=s.dock, dy=L.by+L.bd;
  const runW=(face.doors-1)*face.pitchM;
  const d0=L.bx+(L.bw-runW)/2;
  for(let i=0;i<face.doors;i++){
    const dx=d0+i*face.pitchM-face.doorW/2;
    ctx.fillStyle='#B37400';
    ctx.fillRect(X(dx),Y(dy-0.35),face.doorW*p,0.7*p);
    if(p>2.2){ ctx.save(); ctx.fillStyle=ink+'.6)'; ctx.font='600 7px ui-monospace,monospace';
      ctx.textAlign='center'; ctx.fillText('D'+(i+1), X(dx+face.doorW/2), Y(dy)+13); ctx.restore(); }
  }

  /* ── grid bubbles ── */
  const br=Math.max(6, Math.min(11, 0.9*p*2));
  ctx.save(); ctx.font='700 '+Math.max(6,br*0.95).toFixed(0)+'px ui-monospace,monospace';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  for(let i=0;i<=g.baysX;i++){ const bx=X(L.bx+i*g.bayW), by=Y(L.by)-bubOff;
    ctx.beginPath(); ctx.arc(bx,by,br,0,7);
    ctx.fillStyle='#F4F6FA'; ctx.fill(); ctx.strokeStyle=ink+'.7)'; ctx.lineWidth=1; ctx.stroke();
    ctx.fillStyle=ink+'.85)'; ctx.fillText(bubbleLetter(i),bx,by); }
  for(let j=0;j<=g.baysY;j++){ const bx=X(L.bx)-bubOff, by=Y(L.by+j*g.bayD);
    ctx.beginPath(); ctx.arc(bx,by,br,0,7);
    ctx.fillStyle='#F4F6FA'; ctx.fill(); ctx.strokeStyle=ink+'.7)'; ctx.lineWidth=1; ctx.stroke();
    ctx.fillStyle=ink+'.85)'; ctx.fillText(String(j+1),bx,by); }
  ctx.restore();

  /* ── dimension strings: overall, then the bay chain ── */
  dimLine(ctx, X(L.bx),Y(L.by), X(L.bx+L.bw),Y(L.by), L.bw.toFixed(1)+' m', 'h', -(bubOff+24));
  dimLine(ctx, X(L.bx),Y(L.by), X(L.bx),Y(L.by+L.bd), L.bd.toFixed(1)+' m', 'v', -(bubOff+24));
  dimLine(ctx, X(0),Y(0), X(L.lotW),Y(0), 'LOT '+L.lotW.toFixed(1)+' m', 'h', -(bubOff+48));
  dimLine(ctx, X(0),Y(0), X(0),Y(L.lotD), 'LOT '+L.lotD.toFixed(1)+' m', 'v', -(bubOff+48));
  if(g.bayW*p>34){
    for(let i=0;i<g.baysX;i++)
      dimLine(ctx, X(L.bx+i*g.bayW),Y(L.by), X(L.bx+(i+1)*g.bayW),Y(L.by), g.bayW.toFixed(2), 'h', -26);
  }
  if(g.bayD*p>34){
    for(let j=0;j<g.baysY;j++)
      dimLine(ctx, X(L.bx),Y(L.by+j*g.bayD), X(L.bx),Y(L.by+(j+1)*g.bayD), g.bayD.toFixed(2), 'v', -26);
  }
  dimLine(ctx, X(L.bx+L.bw),Y(apY), X(L.bx+L.bw),Y(apY+L.apron), L.apron+' m', 'v', 34);

  /* ── sheet furniture ── */
  northArrow(ctx, rect.width-42, 44, 15, s.dock.bearing);
  scaleBar(ctx, 14, rect.height-30, p);
  titleBlock(ctx, rect.width, rect.height);
}

/* ═══════════════════════════════════════════════════════════════════
   §7 SIMULATION ENGINE — discrete-event, 1-s resolution  (§4)
   ═══════════════════════════════════════════════════════════════════ */
const SIM = {
  t:0, day:1, month:0, paused:false, speed:1, speeds:[1,5,25,100,1000],
  pallets:0, inv:{}, promo:1, bestDay:0, backlog:0, staged:0, packQ:0, shippedToday:0, receivedToday:0,
  ordersToday:0, pickedToday:0, cohorts:[], lateToday:0, slaTrend:[],
  trucks:[], workers:[], vehicles:[], events:[],
  weather:{rain:false, heat:false, snow:false, smoke:false, until:0},
  outage:false, outageUntil:0,
  fin:{ revToday:0, laborToday:0, energyToday:0, otherToday:0, days:[], months:[], cum:0, kwhToday:0 },
  cpoTrend:[], utilEMA:.5, dockBusy:0, dockSamples:1, dockBusySum:0,
  breakdowns:0, absentToday:0, rosterToday:0,
  started:false,
};
function totalInv(){ let t=0; for(const k in SIM.inv) t+=SIM.inv[k]; return t; }
function hourOf(){ return (SIM.t/3600)%24; }
function seasonTemp(){
  const m = SIM.month, L=S.loc;
  const seq=[L.tSummer,L.tSummer,L.tAutumn,L.tAutumn,L.tAutumn,L.tWinter,L.tWinter,L.tWinter,L.tSpring,L.tSpring,L.tSpring,L.tSummer]; // southern-hemisphere style; harmless generic cycle
  return seq[m];
}
function seasonMult(){ const m=SIM.month; return Object.entries(D.shares).reduce((a,[k,s])=>a+s*VERTICALS[k].season[m],0)||1; }

function resetSim(){
  RNG.reset(); recompute();
  Object.assign(SIM,{ t:6*3600, day:1, month:(S.startMonth||0), pallets:0, backlog:0, staged:0, packQ:0,
    shippedToday:0, receivedToday:0, ordersToday:0, pickedToday:0, trucks:[], workers:[], vehicles:[], events:[],
    weather:{rain:false,heat:false,snow:false,smoke:false,until:0}, outage:false, outageUntil:0,
    fin:{revToday:0,laborToday:0,energyToday:0,otherToday:0,days:[],months:[],cum:-D.equity,kwhToday:0},
    cpoTrend:[], utilEMA:.5, dockBusySum:0, dockSamples:1, breakdowns:0, absentToday:0, rosterToday:0, started:true });
  SIM.inv={}; SIM.promo=1; SIM.bestDay=0; SIM.cohorts=[]; SIM.lateToday=0; SIM.slaTrend=[];
  for(const k in D.shares) SIM.inv[k]=Math.floor(D.basePallets*D.shares[k]*0.55);   // commissioning stock 55%
  SIM.pallets=totalInv();
  spawnWorld(); logEvent('Site commissioned — simulation started at '+S.loc.name,'ok');
}
function rollRoster(){
  const total=S_totalHeads();
  const absent = clamp((1-S.loc.laborAvail)*.12 + D.pen.absentAdd + RNG.gauss(0,.01), 0, .35);
  SIM.absentToday = Math.round(total*absent);
  SIM.rosterToday = total - SIM.absentToday;
  // rebuild worker entities to the rostered count (visual population)
  buildWorkers();
}
function newDay(){
  const f=SIM.fin;
  const dayRec={ day:SIM.day, rev:f.revToday, labor:f.laborToday, energy:f.energyToday, other:f.otherToday,
    orders:SIM.shippedToday, kwh:f.kwhToday, late:SIM.lateToday };
  dayRec.opex = dayRec.labor+dayRec.energy+dayRec.other;
  dayRec.cpo = SIM.shippedToday>0 ? dayRec.opex/SIM.shippedToday : 0;
  f.days.push(dayRec); if(f.days.length>400) f.days.shift();
  SIM.cpoTrend.push(dayRec.cpo); if(SIM.cpoTrend.length>60) SIM.cpoTrend.shift();
  if(SIM.shippedToday>SIM.bestDay && SIM.day>3){ SIM.bestDay=SIM.shippedToday; logEvent('Record dispatch — '+Math.round(SIM.shippedToday)+' orders shipped in a day','ok'); }
  const onTime = SIM.pickedToday>0? clamp(1-SIM.lateToday/Math.max(1,SIM.pickedToday),0,1) : 1;
  SIM.slaTrend.push(onTime); if(SIM.slaTrend.length>60) SIM.slaTrend.shift();
  if(onTime<0.95 && SIM.pickedToday>50) logEvent('SLA breach — '+((1-onTime)*100).toFixed(0)+'% shipped outside the '+(S.site.slaHours||24)+' h window; '+fmt$(SIM.lateToday*D.pickFee*0.5)+' service credits issued','warn');
  SIM.lateToday=0;
  f.cum += dayRec.rev - dayRec.opex - D.debtSvcMo/30.4;
  if(SIM.day%30===0){ closeMonth(); }
  SIM.day++; SIM.month = ((S.startMonth||0) + Math.floor((SIM.day-1)/30))%12;
  try{ merDay(); }catch(e){ /* agents must never break the sim */ }
  f.revToday=f.laborToday=f.energyToday=f.otherToday=f.kwhToday=0;
  SIM.shippedToday=SIM.receivedToday=SIM.ordersToday=SIM.pickedToday=0;
  rollRoster();
  // weather roll (climate-driven)
  const L=S.loc;
  if(RNG.r() < .06 + L.humidity*.1 + L.riskCyclone*.06){
    if(snowSeason()){ SIM.weather.snow=true; SIM.weather.until=SIM.t+RNG.range(4,11)*3600;
      logEvent('Snowfall — aprons need clearing, yard moves and turnarounds slowed','warn'); }
    else { SIM.weather.rain=true; SIM.weather.until=SIM.t+RNG.range(3,9)*3600;
      logEvent('Weather: rain front — yard moves slowed','warn'); }
  }
  if(seasonTemp()>=30 && RNG.r()<.25){ SIM.weather.heat=true; SIM.weather.until=SIM.t+RNG.range(6,12)*3600; logEvent('Heatwave — refrigeration load up','warn'); }
  if(L.riskBushfire>0.2 && seasonTemp()>=25 && RNG.r() < L.riskBushfire*0.014){
    SIM.weather.smoke=true; SIM.weather.until=SIM.t+RNG.range(6,14)*3600;
    logEvent('Regional bushfire smoke — intake filters loading, outdoor visibility down','warn'); }
  if(!S.dd.genset && RNG.r() < L.gridOutage/365){ SIM.outage=true; SIM.outageUntil=SIM.t+RNG.range(1,4)*3600; logEvent('Grid outage — operations halted (no backup generator)','bad'); }
  if(RNG.r() < L.riskCyclone*0.004){ SIM.outage=true; SIM.outageUntil=SIM.t+RNG.range(5,9)*3600;
    const excess=D.invValue*0.0004; SIM.fin.otherToday+=excess;
    logEvent('SEVERE STORM — site shut for the day-shift, insurance excess '+fmt$(excess)+' booked','bad'); }
  if(SIM.absentToday > S_totalHeads()*0.15) logEvent('Absenteeism spike — '+SIM.absentToday+' no-shows (labor index '+L.laborAvail+(S.dd.ptProx==='Far'?', PT far':'')+')','warn');
  if(RNG.r()<.05){ SIM.promo=1.3; logEvent('Client promo surge — order intake +30% today','warn'); } else SIM.promo=1;
}
function closeMonth(){
  const f=SIM.fin, last=f.days.slice(-30);
  const m={ month:f.months.length, rev:0,opex:0,orders:0 };
  last.forEach(d=>{m.rev+=d.rev;m.opex+=d.opex;m.orders+=d.orders});
  m.debtSvc=D.debtSvcMo; m.ebitda=m.rev-m.opex; m.cash=m.ebitda-m.debtSvc;
  f.months.push(m);
  const first = m.ebitda>0 && f.months.filter(x=>x.ebitda>0).length===1;
  logEvent('Month '+(m.month+1)+' close — EBITDA '+fmt$(m.ebitda)+(first?' · first profitable month':''), m.ebitda>0?'ok':'warn');
}
function logEvent(msg,cls){ SIM.events.unshift({t:SIM.day+'d '+String(Math.floor(hourOf())).padStart(2,'0')+':00', msg, cls}); if(SIM.events.length>40)SIM.events.pop(); }

/* ── per-second economic + flow tick ── */
function tick(){
  SIM.t++;
  const h=hourOf(), L=S.loc, P=D.pen, f=SIM.fin;
  if(SIM.t % 86400 < 1) newDay();
  if(SIM.weather.until && SIM.t>SIM.weather.until){ SIM.weather.rain=false; SIM.weather.heat=false; SIM.weather.snow=false; SIM.weather.smoke=false; SIM.weather.until=0; }
  if(SIM.outage && SIM.t>SIM.outageUntil){ SIM.outage=false; logEvent('Grid restored','ok'); }
  const opsOpen = !SIM.outage && P.canOccupy && (!L.curfew || (h>=6&&h<22));

  // ORDERS — stochastic demand w/ seasonality + intraday curve
  const intraday = h>=8&&h<20 ? 1.72 : (h>=6&&h<8?0.74:0.18);   // integrates to ≈1.0/24h
  const perSec = D.baseOrders*seasonMult()*(SIM.promo||1)*intraday/86400 * (1+RNG.gauss(0,.15));
  if(RNG.r()<perSec){ SIM.backlog++; SIM.ordersToday++;
    let c=SIM.cohorts[SIM.cohorts.length-1];
    if(!c || SIM.t-c.born>1800){ c={born:SIM.t,n:0}; SIM.cohorts.push(c); }
    c.n++;
    if(SIM.cohorts.length>120){ const a=SIM.cohorts.shift(); SIM.cohorts[0].n+=a.n; SIM.cohorts[0].born=a.born; }
  }

  // TRUCK ARRIVAL WAVES (inbound) — waves at 06/10/14/18 ± congestion noise
  if(opsOpen && [6,10,14,18].includes(Math.floor(h)) && SIM.t%3600<1){
    // steady-state supply ≈ consumption at target fill; deficit adds proportional boost
    const defFac = clamp(1 + (D.basePallets-SIM.pallets)/Math.max(1,D.basePallets)*1.5, .4, 2.2);
    const n = Math.max(1, RNG.poisson(2.5*P.arrivalVar*seasonMult()*defFac));
    for(let i=0;i<n;i++) spawnTruck('in', RNG.range(0, L.congestMin*60*P.arrivalVar));
  }
  // outbound trucks summoned when packQ builds
  if(opsOpen && SIM.packQ>=26 && SIM.trucks.filter(t=>t.kind==='out'&&t.state!=='depart').length<3 && SIM.t%600<1) spawnTruck('out',0);

  // FLOW: staged → putaway → racking
  if(opsOpen){
    const putRate = (S.staff.putaway+S.staff.forklift*.5)*(SIM.rosterToday/Math.max(1,S_totalHeads()))* 22/3600; // pallets/s
    const mv = Math.min(SIM.staged, putRate*(SIM.weather.snow?0.97:SIM.weather.rain?0.99:1));
    if(mv>0 && SIM.pallets<D.palletCap){
      // deficit-weighted allocation across active verticals
      let defs={}, defT=0;
      for(const k in D.shares){ const d=Math.max(0, D.basePallets*D.shares[k]-(SIM.inv[k]||0)); defs[k]=d; defT+=d; }
      if(defT>0){ for(const k in defs) SIM.inv[k]=(SIM.inv[k]||0)+mv*defs[k]/defT; SIM.staged-=mv; }
    }
    // PICK: backlog → packQ, drawing real stock per vertical (picks ÷ 48 cartons/pallet)
    const pickersEff = pickersEffective();
    const pickRate = pickersEff * 20/3600 * P.pickMult / (D.picksPerOrder/6);   // orders/s
    let servable=0; for(const k in D.shares) if((SIM.inv[k]||0)>0.5) servable+=D.shares[k];
    if(SIM.backlog>0 && servable>0){
      const done = Math.min(SIM.backlog, pickRate*servable);
      SIM.backlog-=done; SIM.packQ+=done; SIM.pickedToday+=done;
      // SLA: consume oldest cohorts first (FIFO); late shipments earn the client a 50% pick-fee credit
      let rem=done, late=0; const slaS=(S.site.slaHours||24)*3600;
      while(rem>1e-6 && SIM.cohorts.length){ const c0=SIM.cohorts[0]; const take=Math.min(rem,c0.n);
        if(SIM.t-c0.born>slaS) late+=take;
        c0.n-=take; rem-=take; if(c0.n<=1e-6) SIM.cohorts.shift(); }
      if(late>0){ SIM.lateToday+=late; f.otherToday += late*D.pickFee*0.5; }
      for(const k in D.shares) if((SIM.inv[k]||0)>0.5)
        SIM.inv[k]=Math.max(0, SIM.inv[k]-done*(D.shares[k]/servable)*(VERTICALS[k].picks/48));
    }
    // PACK+DISPATCH via docked outbound trucks
    const packRate = S.staff.packing*26/3600*(S.autom.conveyor?1.25:1)*(S.autom.sortation?1.35:1);
    const outDocked = SIM.trucks.find(t=>t.kind==='out'&&t.state==='dock');
    if(SIM.packQ>0 && outDocked){
      const done=Math.min(SIM.packQ, packRate);
      SIM.packQ-=done; outDocked.load+=done;
      SIM.shippedToday+=done;
      f.revToday += done*D.pickFee;                                            // handling revenue
      if(outDocked.load>=outDocked.capacity) outDocked.state='departPrep';
    }
    // equipment breakdown events
    if(RNG.r()< (S.staff.forklift+S.autom.agv)*1.1e-6 ){ SIM.breakdowns++; logEvent('Equipment breakdown — maintenance dispatched (forklift #'+Math.ceil(RNG.r()*9)+')','warn'); f.otherToday+=380; }
  }
  // replenishment: keep inventory drifting toward target via inbound truck contents (handled in truck logic)
  // storage revenue & shrinkage — exact per-vertical rates on real stock pools
  for(const k in SIM.inv){ const v=VERTICALS[k];
    f.revToday   += SIM.inv[k]*S.loc.storageBench*v.storMult/7/86400;
    f.otherToday += SIM.inv[k]*v.valueDensity*(v.shrink+P.shrinkAdd)/365/86400; }
  SIM.pallets = totalInv();
  // labor cost accrues across the day
  f.laborToday += D.laborDay*(SIM.rosterToday/Math.max(1,S_totalHeads()))/86400 * (h>=22||h<6?0.35:1);
  // ENERGY: lighting(occupied hrs) + refrigeration(ambient-linked) + HVAC
  const amb = seasonTemp() + (SIM.weather.heat?6:0) + Math.sin((h-14)/24*2*Math.PI)*-4;
  const refrig = D.refrigKwhDay/86400 * (1 + Math.max(0,(amb-18))*0.028);
  const hvac = S.site.areaM2*0.004/86400 * Math.abs(amb-21)/10 *3600/3600;
  /* LIGHTING — daylight harvesting against the site's real sun. A 52°N shed
     burns lighting through most of its Jun–Aug quarter; a site on the equator
     never does. LIGHT_REF normalises the mix so a mid-latitude reference site
     keeps the annual lighting energy this model was calibrated on — latitude
     moves it from there, it does not rebase it. */
  const daylit = solarEnvCached().el > 10;
  const light = (h>=5&&h<23)
    ? D.lightKwhDay/64800 * (daylit?0.55:1) / LIGHT_REF
    : D.lightKwhDay/64800*.15;
  const kwh = (refrig+hvac+light)*(SIM.outage?0:1);
  f.kwhToday+=kwh;
  f.energyToday += kwh*D.powerTariffEff*(SIM.weather.heat?1.12:1)*(SIM.weather.smoke?1.04:1);
  // fixed dailies
  f.otherToday += (D.leaseDay + D.maintDay + D.insuranceYr/365 + D.securityDay + D.adminDay)/86400;
  // dock saturation sampling
  const busy=SIM.trucks.filter(t=>t.state==='dock').length;
  SIM.dockBusySum+=busy/Math.max(1,D.dockCount); SIM.dockSamples++;
  // labor utilization EMA (2 h)
  const util = clamp((SIM.backlog>0?1:0.35)+(SIM.staged>10?.15:0),0,1);
  SIM.utilEMA += (util-SIM.utilEMA)/7200;
  // trucks state machine
  truckTick();
}
function pickersEffective(){
  const n = S.staff.picking*(SIM.rosterToday/Math.max(1,S_totalHeads()));
  const agvAssist = Math.min(S.autom.agv*1.6, n*.8);
  // non-linear aisle congestion: penalty grows quadratically past 10 manual pickers, mitigated by automation
  const manual = Math.max(0, n-agvAssist*.4);
  const pen = manual>10 ? Math.pow((manual-10)/14,2)*(S.autom.slotting?0.55:1)*(S.autom.agv>0?0.7:1) : 0;
  return (n+agvAssist*.9) * clamp(1-pen,0.45,1);
}
/* ── trucks ── */
let truckId=0;
function spawnTruck(kind, delay){
  SIM.trucks.push({ id:++truckId, kind, state:'arrive', t:0, delay, x:-60, y:0, dock:-1,
    capacity: kind==='in'? Math.round(RNG.range(18,30)) : Math.round(RNG.range(24,32)), load:0,
    pallets: kind==='in'? Math.round(RNG.range(18,30)):0, smoke:RNG.r()<.3 });
}
function truckTick(){
  const P=D.pen, serviceBase = 55; // s per pallet unload w/ levellers
  for(const t of SIM.trucks){
    t.t++;
    switch(t.state){
      case 'arrive': if(t.t>t.delay+40){ t.state='queue'; t.t=0; } break;
      case 'queue': {
        if(t.t===2700){ SIM.fin.otherToday+=180; logEvent('Truck #'+t.id+' hit 45-min detention in the queue (+$180)','warn'); }
        const gateBusy = SIM.trucks.some(o=>o!==t && o.state==='gate');
        const ahead = SIM.trucks.filter(o=>o!==t&&o.state==='queue'&&o.id<t.id).length;
        if(!gateBusy && ahead===0 && t.t> (S.dd.gatehouse?90:30)){ t.state='gate'; t.t=0; }
        break; }
      case 'gate': if(t.t> (S.dd.gatehouse?110:260)){ // no gatehouse → paperwork chaos at dock
          const free=[...Array(D.dockCount).keys()].filter(i=>!SIM.trucks.some(o=>o.dock===i&&['dock','toDock','departPrep'].includes(o.state)));
          if(free.length){
            // dock zoning: inbound berths near receiving (left half), outbound near dispatch (right half)
            const half=D.dockCount/2;
            const pref=free.filter(i=> t.kind==='in' ? i<half : i>=half);
            const pool=pref.length?pref:free;
            t.dock=pool[Math.floor(RNG.r()*pool.length)]; t.state='toDock'; t.t=0; }
        } break;
      case 'toDock': if(t.t> 70*D.truckTurnVar*wxYard()){ t.state='dock'; t.t=0; } break;
      case 'dock':
        if(t.kind==='in'){
          const per = serviceBase*P.unloadMult*wxUnload();
          if(t.t> per*(t.capacity-t.pallets+1) && t.pallets>0){ t.pallets--; SIM.staged++; SIM.receivedToday++; SIM.fin.otherToday+=D.linehaulIn/t.capacity*0; }
          if(t.pallets<=0){ t.state='departPrep'; t.t=0; SIM.fin.otherToday += D.linehaulIn*t.capacity; }
        } else {
          if(t.state==='dock' && t.t>1500 && t.load>4) t.state='departPrep';   // cut-off departure
        }
        break;
      case 'departPrep': if(t.t>60){ if(t.kind==='out') SIM.fin.otherToday += D.linehaulOut*Math.ceil(t.load/12); t.state='depart'; t.t=0; } break;
      case 'depart': if(t.t>200){ t.dead=true; } break;
    }
  }
  SIM.trucks = SIM.trucks.filter(t=>!t.dead);
}

/* ═══════════════════════════════════════════════════════════════════
   §8 FINANCIAL & INVESTOR ENGINE  (§5)
   ═══════════════════════════════════════════════════════════════════ */
function modelRate(){ // steady-state estimate straight from the input model
    const rev = D.basePallets*D.storRate/7 + D.baseOrders*D.pickFee;
    const opex = D.laborDay + (D.refrigKwhDay+D.lightKwhDay)*D.powerTariffEff + D.leaseDay + D.maintDay + D.insuranceYr/365 + D.securityDay + D.adminDay + D.baseOrders/28*3*D.linehaulOut + D.baseOrders*D.picksPerOrder/48*D.linehaulIn;
    return {revDay:rev, opexDay:opex, orders:D.baseOrders, laborDay:D.laborDay, energyDay:(D.refrigKwhDay+D.lightKwhDay)*D.powerTariffEff, estimated:true};
}
function uphNow(){ // labor productivity: units picked per rostered labor-hour (trailing 7d or model)
  const days=SIM.fin.days.slice(-7);
  const ord = days.length? days.reduce((a,d)=>a+d.orders,0)/days.length : D.baseOrders;
  return ord*D.picksPerOrder/Math.max(1,(SIM.rosterToday||S_totalHeads())*8);
}
function runRate(){
  const days=SIM.fin.days.slice(-30);
  if(!days.length) return modelRate();
  const s=days.reduce((a,d)=>({rev:a.rev+d.rev,opex:a.opex+d.opex,orders:a.orders+d.orders,labor:a.labor+d.labor,energy:a.energy+d.energy}),{rev:0,opex:0,orders:0,labor:0,energy:0});
  const n=days.length;
  return {revDay:s.rev/n, opexDay:s.opex/n, orders:s.orders/n, laborDay:s.labor/n, energyDay:s.energy/n, estimated:false};
}
function project5y(over={}){
  // monthly cashflows, yr1 ramp 70→100%, growth 3%/yr, seasonality applied
  // base the projection on steady state: trailing sim data once 60 mature days exist, else the input model
  const rr = SIM.fin.days.length>=60 ? runRate() : modelRate();
  const cf=[]; let rev0=rr.revDay*30.4*(over.demand||1), opx0=rr.opexDay*30.4;
  const laborShare=rr.laborDay/Math.max(1,rr.opexDay), energyShare=rr.energyDay/Math.max(1,rr.opexDay);
  const leaseShare=D.leaseDay*30.4/Math.max(1,opx0);
  for(let m=0;m<60;m++){
    const ramp = m<10 ? .7+.03*m : 1;
    const g = Math.pow(1.03, m/12);
    const seas = Object.entries(D.shares).reduce((a,[k,s])=>a+s*VERTICALS[k].season[m%12],0)||1;
    let opexM = opx0*g*( 1 + laborShare*((over.wage||1)-1) + energyShare*((over.energy||1)-1) + leaseShare*((over.lease||1)-1) );
    opexM *= (.55 + .45*ramp*seas*(over.demand||1)); // variable portion flexes w/ volume
    const revM = rev0*ramp*seas*g;
    cf.push({rev:revM, opex:opexM, ebitda:revM-opexM, cash:revM-opexM-D.debtSvcMo});
  }
  if(S.site.tenure==='buy' && D.capex.landOrEntry>0){
    // terminal: property at 3%/yr appreciation less outstanding debt balance after 60 payments
    const r=S.site.debtRate/100/12, n=S.site.debtTermYr*12;
    const bal = D.debt>0? D.debt*(Math.pow(1+r,n)-Math.pow(1+r,60))/(Math.pow(1+r,n)-1) : 0;
    cf[59].cash += D.capex.landOrEntry*Math.pow(1.03,5) - bal;
  }
  return cf;
}
function npvIrr(cf){
  const rM = S.site.discountRate/100/12;
  let npv=-D.equity; cf.forEach((c,i)=>npv+=c.cash/Math.pow(1+rM,i+1));
  // IRR bisection on equity cashflows
  let lo=-0.05, hi=1.0, irr=NaN;
  const f=r=>{let v=-D.equity; cf.forEach((c,i)=>v+=c.cash/Math.pow(1+r/12,i+1)); return v;};
  if((f(lo)>0)!==(f(hi)>0)){ for(let i=0;i<60;i++){ const mid=(lo+hi)/2; if(f(mid)>0) lo=mid; else hi=mid; } irr=(lo+hi)/2; }
  // payback + breakeven
  let cum=-D.equity, payback=null, breakeven=null;
  cf.forEach((c,i)=>{ cum+=c.cash; if(payback===null&&cum>=0)payback=i+1; if(breakeven===null&&c.ebitda>0)breakeven=i+1; });
  const yr1=cf.slice(0,12), ebitdaYr=yr1.reduce((a,c)=>a+c.ebitda,0);
  const dscr = D.debtSvcMo>0 ? ebitdaYr/(D.debtSvcMo*12) : Infinity;
  return {npv, irr, payback, breakeven, dscr, ebitdaYr};
}
function sensitivity(){
  const base=npvIrr(project5y()).npv, out=[];
  [['Demand','demand'],['Wages','wage'],['Lease','lease'],['Energy','energy']].forEach(([lbl,k])=>{
    const up=npvIrr(project5y({[k]:1.2})).npv, dn=npvIrr(project5y({[k]:0.8})).npv;
    out.push({lbl, up:up-base, dn:dn-base});
  });
  return {base, bars:out.sort((a,b)=>Math.abs(b.up-b.dn)-Math.abs(a.up-a.dn))};
}
function confidenceScore(){
  const rr=runRate(), pj=npvIrr(project5y()), L=S.loc;
  const marginY = (rr.revDay-rr.opexDay)/Math.max(1,rr.revDay);
  const comp=[
    {k:'Site readiness (DD)', v:D.ddScore/100, w:.25, why:'due-diligence score'},
    {k:'EBITDA margin', v:clamp(marginY/0.28,0,1), w:.20, why:'vs 28% best-in-class 3PL'},
    {k:'IRR vs 12% hurdle', v: isNaN(pj.irr)?0:clamp(pj.irr/0.24,0,1), w:.20, why:'equity IRR'},
    {k:'Climate & regulatory risk', v:clamp(1-(L.riskCyclone*.5+L.riskFlood*.35+L.riskBushfire*.15+(S.dd.permits!=='Approved'?.25:0)),0,1), w:.15, why:'insurable hazards + permits'},
    {k:'Utilization headroom', v:clamp(SIM.started? SIM.pallets/Math.max(1,D.palletCap)/0.85 : .7,0,1), w:.10, why:'rack utilization vs 85% target'},
    {k:'Labor market', v:L.laborAvail, w:.10, why:'availability index'},
  ];
  let score=Math.round(100*comp.reduce((a,c)=>a+c.v*c.w,0));
  let override=null;
  if(!D.pen.canOccupy){ score=Math.min(score,25); override='Occupancy blocked: '+(!S.dd.zoningOk?'zoning non-conforming':!S.dd.occCert?'no occupancy certificate':'egress non-compliant'); }
  const verdict = score>=70?'GO':score>=50?'CONDITIONAL':'NO-GO';
  const flips = comp.slice().sort((a,b)=>a.v*a.w-b.v*b.w).slice(0,3).map(c=>flipText(c));
  return {score, verdict, comp, flips, override, pj, rr, marginY};
}
function flipText(c){
  const map={
    'Site readiness (DD)':'Lift DD score above 80 (resolve red items — sprinklers, power, compliance paperwork).',
    'EBITDA margin':'Raise margin above 18% — rebalance mix toward higher-rate verticals or cut CPO with automation.',
    'IRR vs 12% hurdle':'Push equity IRR past the 12% hurdle — reduce CapEx (lease vs buy) or negotiate rates.',
    'Climate & regulatory risk':'Secure approved permits and price hardened insurance / mitigation for climate exposure.',
    'Utilization headroom':'Fill racking to ≥70% steady-state via anchor-tenant contracts before commit.',
    'Labor market':'De-risk labor: shift premium, transport shuttle, or automation offsetting scarce local workforce.'
  };
  return map[c.k]||c.k;
}

   §9 AI ADVISOR — KPI watchers → actionable cards with payback  (§5)

   payback:()=>({save:0, months:null, note:'Adds 3 picking heads to close the SLA gap (OpEx, no CapEx).'}),

   payback:()=>({save:0,months:null,note:'Adds 2 receiving + 2 putaway heads (OpEx, not CapEx).'}),

function slaOnTime(){ const t=SIM.slaTrend.slice(-7); return t.length? t.reduce((a,b)=>a+b,0)/t.length : 1; }
function lastCpo(){ const c=SIM.cpoTrend.filter(x=>x>0); return c.length?c[c.length-1]:0; }
function dockSat(){ return SIM.dockBusySum/Math.max(1,SIM.dockSamples); }
function energyShare(){ const rr=runRate(); return rr.energyDay/Math.max(1,rr.opexDay); }
function activeAdvice(){ return ADVISOR_RULES.filter(r=>!S.advisorDone[r.id] && !S.advisorDismissed[r.id] && r.when()); }

/* ═══════════════════════════════════════════════════════════════════
   §10 SCENARIOS — save up to 3 configs, compare side-by-side  (§5)
   ═══════════════════════════════════════════════════════════════════ */
function snapshotScenario(slot){
  const cs=confidenceScore(), rr=runRate();
  S.scenarios[slot]={
    name:S.loc.name+' · '+(S.site.areaM2/1000)+'k m²',
    saved:new Date().toLocaleTimeString(),
    cfg:JSON.parse(JSON.stringify({locKey:S.locKey, loc:S.loc, site:S.site, dd:S.dd, mix:S.mix, staff:S.staff, autom:S.autom})),

  ctx.beginPath();

function drawProp(ctx,p,B,nite,snow){

function drawRoofSolar(ctx,W,Hh,sun,nite){

  const cols=Math.max(3,Math.floor(W/5)), rows=Math.max(2,Math.floor(Hh/6));

/* camera + hit-testing */
function bindCanvas(){
  const cv=el('simCanvas');
  cv.addEventListener('mousedown',e=>{ CAM.dragging=true; CAM.touched=true; CAM.lx=e.clientX; CAM.ly=e.clientY; cv.style.cursor='grabbing'; CAM.moved=false;});
  window.addEventListener('mousemove',e=>{ if(!CAM.dragging)return; CAM.x+=e.clientX-CAM.lx; CAM.y+=e.clientY-CAM.ly; if(Math.abs(e.clientX-CAM.lx)+Math.abs(e.clientY-CAM.ly)>3)CAM.moved=true; CAM.lx=e.clientX; CAM.ly=e.clientY; });
  window.addEventListener('mouseup',()=>{ CAM.dragging=false; cv.style.cursor='grab'; });
  cv.addEventListener('wheel',e=>{ e.preventDefault(); CAM.touched=true; CAM.z=clamp(CAM.z*(e.deltaY<0?1.1:0.9),0.4,3); },{passive:false});
  cv.addEventListener('click',e=>{ if(CAM.moved)return; const r=cv.getBoundingClientRect();
    const sx=(e.clientX-r.left-r.width/2-CAM.x)/CAM.z, sy=(e.clientY-r.top-r.height/2-CAM.y)/CAM.z;
    selectedHit=hitTest(sx,sy); renderLeft(); });
  let pinch0=0, tz0=1;
  cv.addEventListener('touchstart',e=>{ CAM.touched=true; if(e.touches.length===1){ CAM.dragging=true; CAM.lx=e.touches[0].clientX; CAM.ly=e.touches[0].clientY; CAM.moved=false; }
    else if(e.touches.length===2){ CAM.dragging=false; pinch0=Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY)||1; tz0=CAM.z; } },{passive:true});
  cv.addEventListener('touchmove',e=>{ e.preventDefault();
    if(e.touches.length===1&&CAM.dragging){ CAM.x+=e.touches[0].clientX-CAM.lx; CAM.y+=e.touches[0].clientY-CAM.ly; CAM.lx=e.touches[0].clientX; CAM.ly=e.touches[0].clientY; CAM.moved=true; }
    else if(e.touches.length===2){ const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY); CAM.z=clamp(tz0*d/pinch0,0.4,3); } },{passive:false});
  cv.addEventListener('touchend',()=>{ CAM.dragging=false; });
  el('btnZoomIn').onclick=()=>{CAM.touched=true;CAM.z=clamp(CAM.z*1.2,0.4,3);};
  el('btnZoomOut').onclick=()=>{CAM.touched=true;CAM.z=clamp(CAM.z/1.2,0.4,3);};
  el('btnCenter').onclick=()=>{ CAM.touched=false;
    if(VIEW.mode==='plan'){ fitPlan(); return; }
    fitCamera(); if(!CAM.z){CAM.x=0;CAM.y=-40;CAM.z=1;} };
}
function hitTest(sx,sy){
  const near=(px,py,r)=>Math.hypot(px-sx,py-sy)<r;
  for(const w of SIM.workers) if(w._sx!==undefined&&near(w._sx,w._sy,10)) return {type:'worker',ref:w};
  for(const v of SIM.vehicles) if(v._sx!==undefined&&near(v._sx,v._sy,12)) return {type:'vehicle',ref:v};
  for(const t of SIM.trucks) if(t._sx!==undefined&&near(t._sx,t._sy,20)) return {type:'truck',ref:t};
  // zones: invert iso approx — test center distance
  for(const r of WORLD.rackBlocks){ const cx=isoX(r.gx+r.w/2,r.gy+6),cy=isoY(r.gx+r.w/2,r.gy+6); if(near(cx,cy,r.w*TILE*.6)) return {type:'rack',ref:r}; }
  for(const z of WORLD.zones){ const cx=isoX(z.gx+z.w/2,z.gy+z.h/2),cy=isoY(z.gx+z.w/2,z.gy+z.h/2); if(near(cx,cy,Math.max(z.w,z.h)*TILE*.55)) return {type:'zone',ref:z}; }
  return null;
}

function lineChart(cv, series, opts={}){
  const dpr=window.devicePixelRatio||1, r=cv.getBoundingClientRect();
  cv.width=r.width*dpr; cv.height=r.height*dpr;
  const ctx=cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,r.width,r.height);
  const pad={l:44,r:8,t:8,b:18};
  const all=series.flatMap(s=>s.data); if(!all.length){ctx.fillStyle='#5D6C81';ctx.font='11px monospace';ctx.fillText('run the simulation to populate',pad.l,r.height/2);return;}
  let mn=Math.min(0,...all), mx=Math.max(...all,1); if(mx===mn)mx=mn+1;
  const X=i=>pad.l+(r.width-pad.l-pad.r)*i/Math.max(1,series[0].data.length-1);
  const Y=v=>r.height-pad.b-(r.height-pad.t-pad.b)*(v-mn)/(mx-mn);
  ctx.strokeStyle='#D4DCE7'; ctx.fillStyle='#5D6C81'; ctx.font='9px monospace';
  for(let i=0;i<=4;i++){ const v=mn+(mx-mn)*i/4, y=Y(v); ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(r.width-pad.r,y);ctx.stroke(); ctx.fillText(opts.fmt?opts.fmt(v):fmtN(v),4,y+3); }
  if(opts.zero&&mn<0){ ctx.strokeStyle='#D3303666'; ctx.beginPath();ctx.moveTo(pad.l,Y(0));ctx.lineTo(r.width-pad.r,Y(0));ctx.stroke(); }
  if(opts.sla){ ctx.strokeStyle='#D33036'; ctx.setLineDash([4,4]); ctx.beginPath();ctx.moveTo(pad.l,Y(opts.sla));ctx.lineTo(r.width-pad.r,Y(opts.sla));ctx.stroke(); ctx.setLineDash([]); ctx.fillStyle='#D33036'; ctx.fillText('SLA '+(opts.fmt?opts.fmt(opts.sla):opts.sla), r.width-70, Y(opts.sla)-4); }
  series.forEach(s=>{ ctx.strokeStyle=s.color; ctx.lineWidth=1.6; ctx.beginPath();
    s.data.forEach((v,i)=>{ i?ctx.lineTo(X(i),Y(v)):ctx.moveTo(X(i),Y(v)); }); ctx.stroke();
    if(s.fill){ ctx.lineTo(X(s.data.length-1),Y(Math.max(mn,0))); ctx.lineTo(X(0),Y(Math.max(mn,0))); ctx.closePath(); ctx.fillStyle=s.color+'22'; ctx.fill(); } });
}
function barChart(cv, labels, values, colors, fmt){
  const dpr=window.devicePixelRatio||1, r=cv.getBoundingClientRect();
  cv.width=r.width*dpr; cv.height=r.height*dpr;
  const ctx=cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,r.width,r.height);
  const mx=Math.max(...values,1), bw=(r.width-50)/labels.length;
  labels.forEach((l,i)=>{ const h=(r.height-30)*values[i]/mx;
    ctx.fillStyle=colors[i]||'#2F6E9E'; ctx.fillRect(40+i*bw+3, r.height-20-h, bw-6, h);
    ctx.fillStyle='#5D6C81'; ctx.font='9px monospace'; ctx.save(); ctx.translate(40+i*bw+bw/2, r.height-8); ctx.textAlign='center'; ctx.fillText(l,0,0); ctx.restore();
    ctx.fillStyle='#1C2634'; ctx.textAlign='center'; ctx.fillText(fmt?fmt(values[i]):fmtN(values[i]), 40+i*bw+bw/2, r.height-24-h); ctx.textAlign='left'; });
}
function tornadoChart(cv, sens){
  const dpr=window.devicePixelRatio||1, r=cv.getBoundingClientRect();
  cv.width=r.width*dpr; cv.height=r.height*dpr;
  const ctx=cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,r.width,r.height);
  const mx=Math.max(...sens.bars.flatMap(b=>[Math.abs(b.up),Math.abs(b.dn)]),1);
  const cx=r.width/2, rowH=(r.height-24)/sens.bars.length;
  ctx.strokeStyle='#5D6C81'; ctx.beginPath(); ctx.moveTo(cx,4); ctx.lineTo(cx,r.height-20); ctx.stroke();
  sens.bars.forEach((b,i)=>{ const y=8+i*rowH;
    ctx.fillStyle='#1E8E4299'; const w1=(Math.max(b.up,b.dn))/mx*(cx-70); const w2=(Math.min(b.up,b.dn))/mx*(cx-70);
    ctx.fillRect(cx, y, Math.max(0,w1), rowH-12);
    ctx.fillStyle='#D3303699'; ctx.fillRect(cx+Math.min(0,w2), y, Math.abs(Math.min(0,w2)), rowH-12);
    ctx.fillStyle='#1C2634'; ctx.font='10px monospace'; ctx.fillText(b.lbl+' ±20%', 4, y+rowH/2);

    ctx.fillText(sgn$(Math.max(b.up,b.dn)), cx+(cx-70)*Math.max(0,Math.max(b.up,b.dn))/mx+6, y+rowH/2); });
  ctx.fillStyle='#5D6C81'; ctx.font='9px monospace'; ctx.textAlign='center'; ctx.fillText('Δ NPV vs base '+fmt$(sens.base), cx, r.height-6); ctx.textAlign='left';
}

function updateHeader(){
  const e=el('hdrLoc'); if(!e) return;
  e.textContent=S.loc.name;
  const h=Math.floor(hourOf()), m=Math.floor((SIM.t%3600)/60);
  el('hdrClock').textContent='DAY '+SIM.day+' · '+String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+' · '+MONTHS[SIM.month];
  el('hdrDayPart').textContent=(h>=6&&h<18)?'☀ day':'☾ night';
  el('hdrWeather').textContent=wxLabel();
  el('hdrWeather').className=(SIM.outage?'text-warn blink':(wxLabel()!=='clear')?'text-amber':'text-mut');
}
function kpiRibbon(){
  const rr=runRate();
  const util=SIM.started? SIM.pallets/Math.max(1,D.palletCap):0;
  const kpis=[
    ['ORDERS TODAY', fmtN(Math.round(SIM.shippedToday))+' / '+fmtN(Math.round(SIM.ordersToday)), SIM.backlog>150?'warn':'ok'],
    ['BACKLOG', fmtN(Math.round(SIM.backlog)), SIM.backlog>150?'warn':SIM.backlog>60?'amb':'ok'],
    ['UTILIZATION', (util*100).toFixed(1)+'%', util>.92?'warn':util>.5?'ok':'amb'],
    ['DOCK SAT.', (dockSat()*100).toFixed(0)+'%', dockSat()>.85?'warn':'ok'],
    ['CPO', lastCpo()?fmt$(lastCpo()):'—', lastCpo()>D.pickFee*1.15?'warn':'ok'],
    ['REV / DAY', fmt$(rr.revDay), 'std'],
    ['EBITDA / DAY', fmt$(rr.revDay-rr.opexDay), rr.revDay>rr.opexDay?'ok':'warn'],
    ['CASH (CUM.)', fmt$(SIM.fin.cum), SIM.fin.cum>=0?'ok':'amb'],
  ];
  el('kpiRibbon').innerHTML=kpis.map(([l,v,c])=>`<div class="kpi-cell">
    <div class="lbl">${l}</div>
    <div class="num text-[15px] font-bold ${c==='warn'?'text-warn':c==='ok'?'text-ok':c==='amb'?'text-amber':'text-[#1C2634]'}">${v}</div></div>`).join('');
  const n=activeAdvice().length, b=el('advBadge');
  b.textContent=n; b.classList.toggle('hidden',n===0);
}
function setTab(t){
  S.tab=t; if(typeof closeDrawer==='function') closeDrawer();
  if(t==='comms'){ try{ merBuildComms(); MER.unread=0; merRenderChat(); }catch(e){} }
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));
  document.querySelectorAll('.stage-pane').forEach(p=>p.classList.add('hidden'));
  el('stage-'+t).classList.remove('hidden');
  renderStage(); renderLeft();
}
function renderAll(){ recompute(); kpiRibbon(); renderStage(); renderLeft(); }
function renderStage(){
  (({setup:renderSetup, dd:renderDD, sim:renderSimUi, fin:renderFin, adv:renderAdv, rep:renderRep, scn:renderScenarios, comms:merBuildComms})[S.tab]||function(){})();
}

function numIn(val,cb,attrs=''){ return `<input type="number" value="${val}" ${attrs} onchange="(${cb})(+this.value);uiChanged()">`; }
window.uiChanged=function(){ recompute(); if(SIM.started){ spawnWorld(); } kpiRibbon(); renderLeft(); if(S.tab!=='sim') renderStage(); };
window.setMix=function(k,v){ S.mix[k]=+v; uiChanged(); const t=Object.values(S.mix).reduce((a,b)=>a+b,0); const e=el('mixTotal'); if(e){e.textContent=t+'%'; e.className='num font-bold '+(t===100?'text-ok':'text-warn');} };
window.setDD=function(k,v){ const it=DD_ITEMS.find(i=>i.k===k); S.dd[k]= it.type==='chk'? v : (it.type==='num'? +v : v); uiChanged(); if(S.tab==='dd') renderDD(); };
window.setLoc=function(k,v){ S.loc[k]=+v; S.custom=true; uiChanged(); };
window.setLocFlag=function(k,v){ S.loc[k]=v; S.custom=true; uiChanged(); if(S.tab==='setup')renderSetup(); };
window.pickLoc=function(key){ S.locKey=key; S.custom=false; S.loc=JSON.parse(JSON.stringify(LOCATIONS[key])); uiChanged(); renderSetup(); };
window.setSite=function(k,v){ S.site[k]= k==='tenure'? v : +v; uiChanged(); if(k==='tenure'&&S.tab==='setup')renderSetup(); };

function renderSimUi(){
  el('speedSeg').innerHTML=SIM.speeds.map(s=>`<button class="${SIM.speed===s?'on':''}" onclick="setSpeed(${s})">${s}×</button>`).join('');
  const vs=el('viewSeg');
  if(vs) vs.innerHTML=[['iso','ISO'],['plan','PLAN']].map(([m,l])=>
    `<button class="${VIEW.mode===m?'on':''}" onclick="setView('${m}')">${l}</button>`).join('');
  el('btnPause').textContent=SIM.paused?'▶':'⏸';
  /* site environment readout — makes it visible that the floor is being
     driven by this location's own geometry and climate, not a generic day */
  const _sun=solarEnv(), _b=siteBiome(), _lat=siteLat();
  const hhmm=v=>{ if(v<=0||v>=24) return '—'; const H=Math.floor(v), M=Math.round((v-H)*60);
    return String(H).padStart(2,'0')+':'+String(M===60?0:M).padStart(2,'0'); };
  const sunLine = _sun.dayLen>=24 ? 'midnight sun · 24 h'
    : _sun.dayLen<=0 ? 'polar night · 0 h'
    : '↑'+hhmm(_sun.rise)+'  ↓'+hhmm(_sun.set)+'  ·  '+_sun.dayLen.toFixed(1)+' h';
  el('simLegend').innerHTML=
    `<div class="lbl mb-1">Site</div>`
   +`<div class="text-mut">${esc(S.loc.name)}</div>`
   +`<div class="text-mut">${Math.abs(_lat).toFixed(2)}°${_lat>=0?'N':'S'} · ${esc(_b.name)} · ${WORLD.W||34}×${WORLD.H||22} cells</div>`
   +`<div class="lbl mb-1 mt-1.5">Setout</div>`
   +siteSetoutLines().map(([k,v])=>`<div class="flex justify-between gap-3"><span class="text-mut">${esc(k)}</span><span class="num">${esc(v)}</span></div>`).join('')
   +siteSpec().warnings.slice(0,2).map(x=>`<div class="${x.level==='hard'?'text-warn':'text-mut'} mt-1">▸ ${esc(x.msg)}</div>`).join('')
   +`<div class="text-mut">${sunLine}</div>`
   +`<div class="text-mut">sun ${_sun.el>0?_sun.el.toFixed(0)+'° up':'below horizon'}${snowSeason()?' · snow season':''}</div>`
   +`<div class="lbl mb-1 mt-1.5">Departments</div>`
   +Object.entries(DEPT_COLORS).map(([d,c])=>`<div class="flex items-center gap-1.5"><span class="w-2 h-2 inline-block rounded-sm" style="background:${c}"></span>${d}</div>`).join('');
  const wx=el('wxOverlay');
  const msg=SIM.outage?'⚡ GRID OUTAGE — ops halted'
    :SIM.weather.snow?'❄ Snow — yard moves −35%, turnarounds +55%'
    :SIM.weather.rain?'🌧 Rain — yard ops slowed'
    :SIM.weather.smoke?'🔥 Bushfire smoke — filtration load +4%'
    :SIM.weather.heat?'🔥 Heatwave — energy +12%':'';
  wx.classList.toggle('hidden',!msg); wx.textContent=msg; wx.className='absolute top-3 right-3 card px-3 py-1.5 mono text-[11px] no-print '+(SIM.outage?'text-warn blink':'text-amber');
  const ds=el('dockStrip');
  if(ds) ds.innerHTML='<div class="lbl mb-1">Dock board · <span class="text-steel">in</span>/<span class="text-[#FF9B54]">out</span></div><div class="flex gap-1 flex-wrap max-w-[190px]">'
    +[...Array(D.dockCount).keys()].map(i=>{
      const t=SIM.trucks.find(o=>o.dock===i&&['toDock','dock','departPrep'].includes(o.state));

}
